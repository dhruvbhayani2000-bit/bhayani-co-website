<!doctype html><html><head><meta charset=utf8><meta name="robots" content="noindex"><script src="/portal/supabase.js"></script><script src="/portal/config.js"></script><script src="/portal/connect.js" data-tool="internal-audit"></script><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Internal Audit Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: same ERP shell as Society Desk — sticky top bar, module rail on the left, content on slate; phones get a bottom tab bar and slide-in menu. */
:root{
  --bg:#f8fafc; --surface:#ffffff; --sunk:#f1f5f9; --line:#e2e8f0;
  --fg:#0f172a; --muted:#64748b; --primary:#0284c7; --primary-fg:#ffffff; --ink:#0f172a; --ink-fg:#ffffff;
  --accent:#d97706; --accent-ink:#b45309; --accent-soft:#fffbeb; --action:#ea580c;
  --good:#059669; --good-soft:#ecfdf5; --warn:#b45309; --warn-soft:#fffbeb; --bad:#dc2626; --bad-soft:#fef2f2;
  --sky:#0284c7; --sky-soft:#e0f2fe; --sky-fg:#ffffff;
  --hero-a:#0f172a; --hero-b:#0c4a6e; --hero-eyebrow:#38bdf8;
  --paper:#ffffff; --paper-fg:#0f172a;
  --shadow:0 1px 2px rgba(15,23,42,.05);
  --display:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1120; --surface:#111a2e; --sunk:#0f172a; --line:#1e293b;
  --fg:#e2e8f0; --muted:#94a3b8; --primary:#38bdf8; --primary-fg:#082f49; --ink:#e2e8f0; --ink-fg:#0f172a;
  --accent:#f59e0b; --accent-ink:#fbbf24; --accent-soft:#2a1f0a; --action:#f97316;
  --good:#34d399; --good-soft:#062e22; --warn:#fbbf24; --warn-soft:#2a1f0a; --bad:#f87171; --bad-soft:#3b1212;
  --sky:#38bdf8; --sky-soft:#0c2a40; --sky-fg:#082f49;
  --hero-a:#0b1222; --hero-b:#0c3a57; --hero-eyebrow:#7dd3fc;
  --paper:#111a2e; --paper-fg:#e2e8f0;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1120; --surface:#111a2e; --sunk:#0f172a; --line:#1e293b;
  --fg:#e2e8f0; --muted:#94a3b8; --primary:#38bdf8; --primary-fg:#082f49; --ink:#e2e8f0; --ink-fg:#0f172a;
  --accent:#f59e0b; --accent-ink:#fbbf24; --accent-soft:#2a1f0a; --action:#f97316;
  --good:#34d399; --good-soft:#062e22; --warn:#fbbf24; --warn-soft:#2a1f0a; --bad:#f87171; --bad-soft:#3b1212;
  --sky:#38bdf8; --sky-soft:#0c2a40; --sky-fg:#082f49;
  --hero-a:#0b1222; --hero-b:#0c3a57; --hero-eyebrow:#7dd3fc;
  --paper:#111a2e; --paper-fg:#e2e8f0;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.2;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:800} h2{font-size:1.08rem} h3{font-size:.98rem}
p{margin:0}
a{color:var(--primary)}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.85rem}
.eyebrow{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

.app{display:grid;grid-template-columns:256px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100%}
.topbar{grid-column:1/-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--surface)}
.brand{display:flex;gap:12px;align-items:center;min-width:0;flex:1 1 auto}
.logo-tile{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));display:grid;place-items:center;flex:none;color:#7dd3fc}
.brand-name{font-weight:700;font-size:1rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{display:flex;align-items:center;gap:10px;flex:none}
.status-pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:.78rem;font-weight:600;border:1px solid}
.status-pill.on{background:var(--good-soft);color:var(--good);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.status-pill.demo{background:var(--accent-soft);color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.status-pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.role-chip{display:grid;gap:1px;border:1px solid var(--line);border-radius:12px;padding:4px 12px;background:var(--surface);max-width:280px}
.role-chip .eyebrow{font-size:.62rem}
.role-chip b{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none}
.rail{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:calc(64px + env(safe-area-inset-top,0px));height:calc(100vh - 64px - env(safe-area-inset-top,0px));overflow:auto;display:flex;flex-direction:column}
.rail-label{padding:18px 22px 6px;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.nav{display:flex;flex-direction:column;padding:4px 12px 12px;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:12px;color:var(--muted);font-weight:500;font-size:.9rem;display:flex;align-items:center;gap:12px}
.nav button svg{flex:none;opacity:.85}
.nav button span.l{flex:1;min-width:0}
.nav button:hover{background:var(--sunk);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--sky);color:var(--sky-fg);font-weight:600;box-shadow:0 4px 10px -4px color-mix(in srgb,var(--sky) 60%,transparent)}
.nav button:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
.badge{font-family:var(--mono);font-size:.7rem;background:var(--accent);color:#1c1300;border-radius:999px;padding:0 7px;line-height:1.6;font-weight:600}
.badge.bad{background:var(--bad);color:#fff}
.nav button[aria-current="page"] .badge{background:var(--sky-fg);color:var(--sky)}
.rail-foot{margin-top:auto;padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:8px}
.usercard{display:flex;gap:10px;align-items:center;padding:12px 16px 16px;border-top:1px solid var(--line)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--ink-fg);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none}
.usercard .n{font-weight:600;font-size:.88rem;line-height:1.2}
.usercard .r{font-size:.72rem;color:var(--sky);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tabbar,.scrim{display:none}

.hero{border-radius:24px;padding:28px 30px;background:linear-gradient(120deg,var(--hero-a) 0%,var(--hero-a) 35%,var(--hero-b) 100%);color:#f8fafc;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;box-shadow:0 20px 25px -12px rgba(15,23,42,.35)}
.hero .eyebrow{color:var(--hero-eyebrow)}
.hero h1{font-size:clamp(1.5rem,3.2vw,2rem);color:#fff;margin-top:6px}
.hero p{color:#cbd5e1;max-width:62ch;margin-top:6px;font-size:.92rem}
.hero p b{color:#fff}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap}
.btn.hero-primary{background:#0ea5e9;border-color:#0ea5e9;color:#fff}
.btn.hero-ghost{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff}
.btn.hero-ghost:hover{background:rgba(255,255,255,.16)}
.kpi-ic{position:absolute;top:16px;right:16px}
.tone-sky{color:var(--sky)} .tone-good{color:var(--good)} .tone-warn{color:var(--accent)} .tone-bad{color:var(--bad)}
.alert-strip{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);background:var(--bad-soft);border-radius:var(--r);padding:12px 16px}
.alert-strip .t{font-weight:700;color:var(--bad);display:flex;gap:10px;align-items:center}
.alert-strip p{color:var(--muted);font-size:.82rem}
main{min-width:0;padding-block:24px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:grid;gap:20px;align-content:start;max-width:1280px;width:100%}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
.head p{color:var(--muted);max-width:62ch}
.banner{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:var(--r);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.banner p{max-width:72ch}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:14px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:4px;box-shadow:var(--shadow);align-content:start;min-width:0}
.tile .v{font-family:var(--mono);font-size:clamp(1.25rem,2.1vw,1.6rem);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.25}
.tile .v small{font-size:.6em;font-family:var(--body);letter-spacing:0}
.tile .eyebrow{padding-right:28px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);display:grid;gap:12px;min-width:0;align-content:start}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .grow{flex:1 1 200px}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
.toolbar input,.toolbar select{width:auto;max-width:100%}
.toolbar .grow input{width:100%}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 16px;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.btn.sky{background:var(--sky);color:var(--sky-fg);border-color:var(--sky)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.85rem;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.icon:hover{background:var(--sunk)}
.segs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.segs button{all:unset;cursor:pointer;padding:6px 12px;font-size:.86rem;color:var(--muted)}
.segs button[aria-pressed="true"]{background:var(--primary);color:var(--primary-fg)}
.segs button:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}

.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--sunk);color:var(--muted)}
.pill.sky{background:var(--sky-soft);color:var(--sky)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--sunk)}
td.r,th.r{text-align:right}
.sev{border-left:4px solid transparent}
.sev.High{border-left-color:var(--bad)} .sev.Medium{border-left-color:var(--accent)} .sev.Low{border-left-color:var(--good)}

.list{display:grid}
.item{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}
.item>div{min-width:0}
.date-chip{font-family:var(--mono);font-size:.78rem;background:var(--sunk);border-radius:6px;padding:2px 6px;white-space:nowrap}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--sky);border-radius:99px}
.bar.good>span{background:var(--good)} .bar.over>span{background:var(--bad)}
.hbar{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.stack span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.card{all:unset;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;cursor:pointer;align-content:start;box-shadow:var(--shadow)}
.card:hover{border-color:var(--muted)}
.card:focus-visible{outline:2px solid var(--sky)}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.card.sel{border-color:var(--sky);box-shadow:0 0 0 1px var(--sky)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* risk heat map */
.heat{display:grid;grid-template-columns:28px repeat(5,minmax(0,1fr));gap:4px;font-size:.78rem}
.heat .ax{display:grid;place-items:center;color:var(--muted);font-family:var(--mono)}
.heat .cell{min-height:58px;border-radius:8px;padding:4px;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start}
.cell.h{background:var(--bad-soft)} .cell.m{background:var(--warn-soft)} .cell.l{background:var(--good-soft)}
.chip{all:unset;cursor:pointer;font-family:var(--mono);font-size:.68rem;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--surface);border:1px solid var(--line)}
.chip:focus-visible{outline:2px solid var(--sky)}

/* work programme */
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .no{font-family:var(--mono);font-size:.78rem;color:var(--muted);padding-top:2px}
.step .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.step .row input{width:90px}
.step .row input.wp{width:110px}
.step .row input.note{flex:1 1 220px;width:auto}
.res button[aria-pressed="true"][data-v="ok"]{background:var(--good);color:#fff}
.res button[aria-pressed="true"][data-v="exc"]{background:var(--bad);color:#fff}
.res button[aria-pressed="true"][data-v="na"]{background:var(--muted);color:var(--surface)}
.area-tabs{display:flex;gap:6px;flex-wrap:wrap}
.area-tabs button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.84rem;background:var(--surface);display:inline-flex;gap:6px;align-items:center}
.area-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.area-tabs button:focus-visible{outline:2px solid var(--sky)}

/* report paper */
.paper{background:var(--paper);color:var(--paper-fg);border:1px solid var(--line);border-radius:12px;padding:clamp(18px,4vw,44px);max-width:900px;width:100%;justify-self:center;box-shadow:0 12px 30px -18px rgba(15,23,42,.35);font-size:.93rem}
.paper h1{font-size:1.5rem} .paper h2{font-size:1.05rem;margin-top:22px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.paper h3{font-size:.95rem;margin-top:14px}
.paper p{margin-top:6px;max-width:75ch}
.paper table{font-size:.84rem;margin-top:8px}
.paper .rtab{overflow-x:auto}
.paper .obs{border:1px solid var(--line);border-radius:10px;margin-top:12px;overflow:hidden}
.paper .obs-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;background:var(--sunk)}
.paper .obs dl{display:grid;grid-template-columns:minmax(110px,150px) 1fr;margin:0}
.paper .obs dt,.paper .obs dd{padding:8px 12px;border-top:1px solid var(--line);margin:0}
.paper .obs dt{color:var(--muted);font-weight:600;font-size:.8rem}
.paper .sign{display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;margin-top:30px}

.form{display:grid;gap:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted);font-weight:500;min-width:0}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px;margin:0;min-width:0}
legend{font-weight:600;padding:0 6px;font-family:var(--display)}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:6px 14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

#modal{position:fixed;inset:0;background:rgba(10,14,24,.55);z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:14px;width:min(680px,100%);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet.wide{width:min(920px,100%)}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);border-radius:14px 14px 0 0;z-index:1}
.sheet-body{padding:16px;display:grid;gap:16px}
.timeline{display:grid;gap:10px;border-left:2px solid var(--line);padding-left:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-weight:500;max-width:calc(100% - 32px)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);display:grid;gap:8px;justify-items:center}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:grid}
  .role-chip,.status-pill span{display:none}
  .status-pill{padding:6px}

const HEADS={REV:'Revenue from operations',OI:'Other income',OPEN:'Opening stock',PUR:'Purchases',DIR:'Direct / manufacturing expenses',EMP:'Employee benefit expenses',FIN:'Finance costs',DEP:'Depreciation',OTH:'Other expenses',

function classify(a,map){
  if(map&&map[a.account]) return map[a.account];
  const g=(a.group||'').toLowerCase(), n=a.account.toLowerCase(), s=g+' | '+n;
  if(/suspense|difference in|unadjust|clearing/.test(s)) return 'SUS';
  if(/opening stock/.test(s)) return 'OPEN';
  if(/indirect income|other income/.test(g)) return 'OI';
  if(/sales account|^sales|revenue from|direct income/.test(g)) return 'REV';
  if(/purchase/.test(g)) return 'PUR';
  if(/expense/.test(g)){
    if(/salar|wage|bonus|gratuity|staff welfare|provident|esic|leave encash|pf contribution|esi contribution/.test(n)&&!/contract/.test(n)) return 'EMP';
    if(/interest|finance charge|processing fee/.test(n)) return 'FIN';
    if(/depreciation|amortis/.test(n)) return 'DEP';
    return /indirect/.test(g)?'OTH':'DIR'; }
  if(/capital account|share capital|reserve|surplus|profit & loss|profit and loss|partner/.test(s)) return 'EQ';
  if(/bank od|overdraft|cash credit|\bcc\b|working capital loan/.test(s)) return 'BORS';
  if(/secured loan|unsecured loan|term loan|loans \(liability\)|borrowing/.test(s)) return 'BORL';
  if(/sundry creditor|trade payable|creditor/.test(g)) return 'PAY';
  if(/sundry debtor|trade receivable|debtor/.test(g)) return 'REC';
  if(/duties|taxes|provision|current liabilit|payable/.test(s)) return 'OCL';
  if(/fixed asset|property|plant|ppe|capital work/.test(g)) return 'FA';
  if(/investment/.test(s)) return 'INVST';
  if(/stock-in-hand|stock in hand|inventor|closing stock/.test(s)) return 'INV';
  if(/cash-in-hand|cash in hand|bank account|bank/.test(s)) return 'CASH';
  if(/deposit|loans & advances|loans and advances|current asset|advance|receivable|prepaid/.test(s)) return 'LA';

function buildFS(tb,map,days){
  const L=tb.map(a=>({...a,h:classify(a,map)}));

  const mk=(t,y)=>{
    const open=t.OPEN|| (y==='cy'?tot('py').INV:0);
    const cogs=open+t.PUR+t.DIR-t.INV;
    const rev=t.REV, pbt=rev+t.OI-cogs-t.EMP-t.FIN-t.DEP-t.OTH;
    const assets=t.FA+t.INVST+t.INV+t.REC+t.CASH+t.LA+Math.max(0,t.SUS);
    const liab=t.EQ+pbt+t.BORL+t.BORS+t.PAY+t.OCL+Math.max(0,-t.SUS);
    const ca=t.INV+t.REC+t.CASH+t.LA, cl=t.PAY+t.OCL+t.BORS;

    tbDiffCY:sum(tb,a=>a.cy), tbDiffPY:sum(tb,a=>a.py), hasClose:L.some(a=>a.h==='INV'), unclassified:L.filter(a=>a.h==='SUS')};

function materiality(fs,eng){

  const a=rev*0.01, b=pbt>0?pbt*0.05:Infinity;

const C_={pur:r=>[fmtDate(r.date),r.inv,r.party,inr(r.total)],sal:r=>[fmtDate(r.date),r.inv,r.party,inr(r.total)],pay:r=>[fmtMonth(r.month),r.emp,r.name,inr(r.gross)],bank:r=>[fmtDate(r.date),r.narr,r.dr?inr(r.dr):'',r.cr?inr(r.cr):''],tb:r=>[r.account,r.group,inr(r.cy),inr(r.py)],vend:r=>[r.vendor,r.gstin,r.pan,r.bank]};
const GST_RATES=[0,0.1,0.25,1.5,3,5,6,12,18,28,40];
function rateOk(r){ if(!r.taxable||!r.tax) return true; const p=Math.abs(r.tax/r.taxable*100); return GST_RATES.some(x=>Math.abs(p-x)<0.35); }
const invKey=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/^0+/,'');

/* Trial balance and financial statements */
T('tb_bal','tb','frc','Trial balance does not tally','Total debits must equal total credits in the trial balance.','An untallied trial balance means the books are incomplete or corrupted; financial statements cannot be relied upon.','Trace the difference to its source voucher or opening balance and correct it before closing the period.',(D,C)=>{
  const d=C.fs.tbDiffCY, inv=C.fs.cy.t.INV;
  if(Math.abs(d)<=1) return {sev:'Pass',rows:[],value:0};
  if(Math.abs(Math.abs(d)-Math.abs(inv))<=1) return {sev:'Pass',rows:[],value:0,note:'The difference equals closing stock, which Tally shows only on the asset side. Treated as tallied.'};
  return {sev:'High',value:d,rows:[ex(['Difference (Dr − Cr)','',inr(d),''],'Trial balance difference',d)]}; });
T('tb_susp','tb','frc','Balances in suspense, difference or round-off ledgers','Suspense and clearing ledgers should be nil at period end.','Unexplained entries may hide errors, unrecorded liabilities or misappropriation.','Analyse each entry in these ledgers, pass rectification entries and keep them at nil at every close.',(D,C)=>{
  const rows=D.tb.filter(a=>/suspense|difference|unadjust|clearing|round.?off|temporary|misc(ellaneous)? (a\/c|account)/i.test(a.account+' '+a.group)&&Math.abs(a.cy)>Math.max(1000,C.mat.tr*0.2));
  const v=sum(rows,a=>Math.abs(a.cy)); return {sev:rows.length?(Math.abs(v)>=C.mat.pm?'High':'Medium'):'Pass',value:v,rows:rows.map(a=>ex(C_.tb(a),'Balance left in a clearing ledger',a.cy,a))}; });
T('tb_abn','tb','frc','Ledgers with abnormal balances','Asset and expense ledgers carry debit balances; liability and income ledgers carry credit balances.','Abnormal balances usually mean misposting, unadjusted advances or duplicate entries.','Review each ledger, reclassify advances (for example customer credit balances to advances from customers) and correct misposted entries.',(D,C)=>{
  const rows=[]; C.fs.L.forEach(a=>{ let why='';
    if(a.h==='CASH'&&a.cy<0) why='Cash or bank ledger in credit';
    else if(a.h==='REC'&&a.cy<0) why='Customer ledger with a credit balance';
    else if(a.h==='PAY'&&a.cy>0) why='Vendor ledger with a debit balance';
    else if(['PUR','DIR','EMP','FIN','DEP','OTH'].includes(a.h)&&a.cy<0) why='Expense ledger in credit';
    else if(['REV','OI'].includes(a.h)&&a.cy>0) why='Income ledger in debit';
    if(why&&Math.abs(a.cy)>=C.mat.tr*0.2) rows.push(ex(C_.tb(a),why,a.cy,a)); });
  const v=sum(rows,x=>Math.abs(x.amt)); return {sev:sevV(v,rows.length,C),value:v,rows}; });
T('tb_fluct','tb','frc','Large unexplained fluctuations in income and expense ledgers','Changes against the previous period above performance materiality and 20% should be explained by management.','Unexplained swings may point to misclassification, missed accruals or irregular spending.','Obtain written reasons for each fluctuation with supporting evidence and test the largest items.',(D,C)=>{
  if(!C.fs.hasPY) return null;
  const rows=C.fs.L.filter(a=>['REV','OI','PUR','DIR','EMP','FIN','DEP','OTH'].includes(a.h)).map(a=>({a,d:Math.abs(a.cy)-Math.abs(a.py)})).filter(x=>Math.abs(x.d)>=C.mat.pm*0.5&&x.a.py&&Math.abs(x.d/x.a.py)>=0.2);
  return {sev:rows.length?(rows.length>=3?'High':'Medium'):'Pass',value:sum(rows,x=>Math.abs(x.d)),head:['Ledger','This period','Last period','Change'],rows:rows.map(x=>ex([x.a.account,inr(Math.abs(x.a.cy)),inr(Math.abs(x.a.py)),(x.d>0?'+':'')+pct(x.d/Math.abs(x.a.py),0)],'Change above 20% and performance materiality',x.d,x.a))}; });
const ratioRow=(label,cy,py,fmt)=>[label,fmt(cy),py==null?'—':fmt(py),py==null||cy==null?'—':(cy-py>0?'+':'')+fmt(cy-py)];
T('fs_gm','tb','inv','Gross margin has fallen','Gross margin should stay stable unless prices or input costs changed in a known way.','A falling margin may signal unrecorded sales, inflated purchases, stock losses or wrong closing stock.','Reconcile the margin bridge (price, mix, input cost, stock) with management and test closing stock valuation.',(D,C)=>{
  const a=C.fs.cy.r.gm, b=C.fs.py&&C.fs.py.r.gm; if(a==null||b==null) return null; const d=a-b;
  return {sev:d<=-0.06?'High':d<=-0.03?'Medium':'Pass',value:Math.abs(d)*C.fs.cy.rev,head:['Ratio','This period','Last period','Change'],rows:d<=-0.03?[ex(ratioRow('Gross margin',a,b,x=>pct(x)),'Margin down '+pct(-d)+' points',Math.abs(d)*C.fs.cy.rev)]:[]}; });
T('fs_dd','tb','o2c','Debtor days are high or rising','Collections should follow the agreed credit terms.','Slow collection raises the risk of bad debts and fictitious or disputed sales.','Review the ageing, confirm large balances and provide for doubtful debts per policy.',(D,C)=>{
  const a=C.fs.cy.r.dd, b=C.fs.py&&C.fs.py.r.dd; if(a==null) return null; const bad=a>90||(b!=null&&a-b>15);
  return {sev:bad?(a>120?'High':'Medium'):'Pass',value:bad?C.fs.cy.t.REC:0,head:['Ratio','This period','Last period','Change'],rows:bad?[ex(ratioRow('Debtor days',a,b,x=>Math.round(x)+' days'),'Above 90 days or up by over 15 days',C.fs.cy.t.REC)]:[]}; });
T('fs_cd','tb','p2p','Creditor days are high (MSME 45-day risk)','MSME suppliers must be paid within 45 days; other suppliers per terms.','Long credit periods risk disallowance u/s 43B(h) and interest under the MSMED Act.','Identify MSME vendors and their overdue amounts; align payment runs with the 45-day rule.',(D,C)=>{
  const a=C.fs.cy.r.cd, b=C.fs.py&&C.fs.py.r.cd; if(a==null) return null; const bad=a>60||(b!=null&&a-b>15);
  return {sev:bad?'Medium':'Pass',value:bad?C.fs.cy.t.PAY:0,head:['Ratio','This period','Last period','Change'],rows:bad?[ex(ratioRow('Creditor days',a,b,x=>Math.round(x)+' days'),'Above 60 days or up by over 15 days',C.fs.cy.t.PAY)]:[]}; });
T('fs_id','tb','inv','Inventory days are rising','Inventory holding should match production and sales plans.','Rising stock days may mean slow-moving or obsolete stock, or overstated closing stock.','Obtain item-wise ageing, review non-moving items and test valuation at lower of cost and NRV.',(D,C)=>{
  const a=C.fs.cy.r.id, b=C.fs.py&&C.fs.py.r.id; if(a==null||b==null) return null; const bad=a-b>10;
  return {sev:bad?(a-b>25?'High':'Medium'):'Pass',value:bad?C.fs.cy.t.INV:0,head:['Ratio','This period','Last period','Change'],rows:bad?[ex(ratioRow('Inventory days',a,b,x=>Math.round(x)+' days'),'Up by over 10 days',C.fs.cy.t.INV)]:[]}; });
T('fs_liq','tb','tre','Liquidity or leverage under strain','Current ratio above 1.1, debt-equity below 2 and interest cover above 2 are usual comfort levels.','Weak liquidity raises going-concern, covenant-breach and payment-default risk.','Review cash flow forecasts, bank covenants and limits; report to the board.',(D,C)=>{
  const r=C.fs.cy.r, p=C.fs.py&&C.fs.py.r, rows=[];
  if(r.cr!=null&&r.cr<1.1) rows.push(ex(ratioRow('Current ratio',r.cr,p&&p.cr,x=>x.toFixed(2)),'Below 1.1'));
  if(r.de!=null&&r.de>2) rows.push(ex(ratioRow('Debt-equity',r.de,p&&p.de,x=>x.toFixed(2)),'Above 2'));
  if(r.ic!=null&&r.ic<2) rows.push(ex(ratioRow('Interest cover',r.ic,p&&p.ic,x=>x.toFixed(2)),'Below 2'));
  return {sev:rows.length>=2?'High':rows.length?'Medium':'Pass',value:0,head:['Ratio','This period','Last period','Change'],rows}; });

/* Reconciliations between registers and the trial balance */
function coversPeriod(D,ds,C){ const m=C.meta[ds]; if(!m||!m.from||!m.to) return false;
  const f=m.from.length===7?m.from+'-01':m.from, t=m.to.length===7?addDays(addDays(m.to+'-01',32).slice(0,7)+'-01',-1):m.to;
  return daysBetween(C.from,f)<=10&&daysBetween(t,C.to)<=10; }
T('rc_pur',['pur','tb'],'p2p','Purchase register does not agree with the purchase ledger','Purchases in the register should equal purchases booked in the trial balance.','A difference means unrecorded or duplicated purchases, or expenses booked outside the register.','Reconcile month-wise and investigate unmatched entries.',(D,C)=>{
  if(!coversPeriod(D,'pur',C)) return null; const a=sum(D.pur,r=>r.taxable), b=C.fs.cy.t.PUR, d=a-b;
  return {sev:sevV(d,Math.abs(d)>C.mat.tr?1:0,C),value:d,head:['Source','Amount','',''],rows:Math.abs(d)>C.mat.tr?[ex(['Purchase register (taxable value)',inr(a),'',''],''),ex(['Trial balance, purchase accounts',inr(b),'',''],''),ex(['Difference',inr(d),'',''],'Unreconciled',d)]:[]}; });
T('rc_sal',['sal','tb'],'o2c','Sales register does not agree with the sales ledger','Sales in the register should equal revenue booked in the trial balance.','A difference may mean unrecorded sales, sales booked through journals or cut-off errors.','Reconcile month-wise with GSTR-1 and investigate journal entries to sales.',(D,C)=>{
  if(!coversPeriod(D,'sal',C)) return null; const a=sum(D.sal,r=>r.taxable), b=C.fs.cy.t.REV, d=a-b;
  return {sev:sevV(d,Math.abs(d)>C.mat.tr?1:0,C),value:d,head:['Source','Amount','',''],rows:Math.abs(d)>C.mat.tr?[ex(['Sales register (taxable value)',inr(a),'',''],''),ex(['Trial balance, revenue',inr(b),'',''],''),ex(['Difference',inr(d),'',''],'Unreconciled',d)]:[]}; });
T('rc_pay',['pay','tb'],'pay','Payroll register does not agree with salary ledgers','Gross salary in the payroll register should equal salary and wages in the books.','A difference may mean off-register payments or wrong provisioning.','Reconcile month-wise and explain each difference.',(D,C)=>{
  if(!coversPeriod(D,'pay',C)) return null; const a=sum(D.pay,r=>r.gross), b=sum(C.fs.L.filter(x=>x.h==='EMP'&&/salar|wage/i.test(x.account)),x=>x.cy), d=a-b;
  return {sev:sevV(d,Math.abs(d)>C.mat.tr?1:0,C),value:d,head:['Source','Amount','',''],rows:Math.abs(d)>C.mat.tr?[ex(['Payroll register, gross',inr(a),'',''],''),ex(['Salary and wages ledgers',inr(b),'',''],''),ex(['Difference',inr(d),'',''],'Unreconciled',d)]:[]}; });

/* Purchase register */
T('pur_dup','pur','p2p','Duplicate purchase invoices','The same vendor invoice must be booked only once.','Duplicate booking leads to double payment and excess input tax credit.','Block duplicate vendor invoice numbers in the ERP; recover any double payments from vendors.',(D,C)=>{
  const g=groupBy(D.pur.filter(r=>r.inv),r=>r.party.toLowerCase()+'|'+invKey(r.inv)); const rows=[];
  Object.values(g).forEach(a=>{ if(a.length>1) a.slice(1).forEach(r=>rows.push(ex(C_.pur(r),'Invoice '+r.inv+' booked '+a.length+' times',r.total,r))); });
  const v=sum(rows,x=>x.amt); return {sev:rows.length?(v>=C.mat.pm?'High':'Medium'):'Pass',value:v,rows}; });
T('pur_dup2','pur','p2p','Possible duplicates: same vendor, amount and date','Two invoices from one vendor on one day for the same amount need checking.','May be the same supply booked twice under a changed invoice number.','Vouch each pair with GRNs and delivery records.',(D,C)=>{
  const g=groupBy(D.pur,r=>r.party.toLowerCase()+'|'+r.date+'|'+Math.round(r.total)); const rows=[];
  Object.values(g).forEach(a=>{ const inv=new Set(a.map(r=>invKey(r.inv))); if(a.length>1&&inv.size>1) a.slice(1).forEach(r=>rows.push(ex(C_.pur(r),'Same vendor, date and amount as invoice '+a[0].inv,r.total,r))); });
  return {sev:rows.length?'Medium':'Pass',value:sum(rows,x=>x.amt),rows}; });
T('pur_gstin','pur','stat','GST charged by vendors with missing or invalid GSTIN','Input tax credit is available only on invoices from registered persons with a valid GSTIN (Sec 16, CGST Act).','Credit on these invoices is at risk of reversal with interest and penalty.','Validate GSTINs on the GST portal and match invoices with GSTR-2B before claiming credit.',(D,C)=>{
  const rows=D.pur.filter(r=>r.tax>0&&!GSTIN_RE.test(r.gstin)).map(r=>ex(C_.pur(r),r.gstin?'GSTIN '+r.gstin+' is not valid':'No GSTIN, GST of '+inr(r.tax),r.tax,r));
  return {sev:sevV(sum(rows,x=>x.amt),rows.length,C),value:sum(rows,x=>x.amt),rows}; });
T('pur_rate','pur','stat','GST amount does not match a valid rate','GST should be charged at a notified rate (5%, 12%, 18%, 28% and so on).','Wrong rates mean excess or short credit and possible errors in booking.','Recheck these invoices against the vendor copy and the HSN rate.',(D,C)=>{
  const rows=D.pur.filter(r=>!rateOk(r)).map(r=>ex(C_.pur(r),'Effective GST rate '+(r.tax/r.taxable*100).toFixed(2)+'%',r.tax,r));
  return {sev:rows.length?'Medium':'Pass',value:sum(rows,x=>x.amt),rows}; });
T('pur_194q','pur','stat','TDS u/s 194Q not deducted after ₹50 lakh purchases from a seller','A buyer with turnover above ₹10 crore must deduct 0.1% TDS on purchases from a seller beyond ₹50 lakh in the year (Sec 194Q).','Interest u/s 201(1A) and disallowance of 30% of the expense u/s 40(a)(ia).','Track cumulative purchases per seller in the ERP and deduct TDS from the invoice that crosses ₹50 lakh.',(D,C)=>{
  const g=groupBy([...D.pur].sort((a,b)=>a.date.localeCompare(b.date)),r=>r.party); const rows=[];
  for(const [p,a] of Object.entries(g)){ let cum=0; for(const r of a){ const before=cum; cum+=r.taxable; if(cum>5e6&&(!C.has.pur.includes('tds')||!r.tds)){ const over=Math.min(r.taxable,cum-Math.max(before,5e6)); rows.push(ex(C_.pur(r),C.has.pur.includes('tds')?'No TDS; cumulative purchases '+lakh(cum):'Cumulative purchases '+lakh(cum)+'; check TDS',over,r)); } } }
  const v=sum(rows,x=>x.amt); return {sev:rows.length?(C.has.pur.includes('tds')?'High':'Medium'):'Pass',value:v,rows,note:C.has.pur.includes('tds')?'':'No TDS column in the register, so these are listed for checking.'}; });
T('pur_msme','pur','p2p','MSME invoices not paid within 45 days','Sec 15 of the MSMED Act requires payment within 45 days of acceptance; Sec 43B(h) disallows dues unpaid within that time.','Disallowance of the expense and compound interest at three times the RBI bank rate.','Capture Udyam details in the vendor master and run a weekly report of MSME dues nearing 45 days.',(D,C)=>{
  if(!C.has.pur.includes('msme')) return null;
  const rows=D.pur.filter(r=>r.msme).map(r=>({r,d:daysBetween(r.date,r.payDate||C.to)})).filter(x=>x.d>45).map(x=>ex(C_.pur(x.r),x.r.payDate?'Paid after '+x.d+' days':'Unpaid '+x.d+' days at period end',x.r.total,x.r));
  const v=sum(rows,x=>x.amt); return {sev:rows.length?(v>=C.mat.tr?'High':'Medium'):'Pass',value:v,rows}; });
T('pur_cut','pur','frc','Purchase cut-off: invoices outside the period or large ones at period end','Purchases belong to the period in which goods are received.','Purchases may be shifted between periods to manage profit.','Match these invoices with GRN dates and stock records.',(D,C)=>{
  const rows=D.pur.filter(r=>r.date>C.to||r.date<C.from||(daysBetween(r.date,C.to)<=2&&r.total>=C.mat.om)).map(r=>ex(C_.pur(r),r.date>C.to||r.date<C.from?'Dated outside the audit period':'Large invoice in the last 3 days',r.total,r));
  return {sev:rows.length?'Medium':'Pass',value:sum(rows,x=>x.amt),rows}; });
T('pur_sun','pur','p2p','Purchase invoices dated on Sundays','Invoices are normally raised on working days.','Sunday-dated entries can indicate back-dated or fictitious bills.','Check GRN and gate entry records for these invoices.',(D,C)=>{
  const rows=D.pur.filter(r=>dow(r.date)===0).map(r=>ex(C_.pur(r),'Sunday',r.total,r));
  return {sev:rows.length?'Low':'Pass',value:sum(rows,x=>x.amt),rows}; });
T('pur_round','pur','p2p','Round-sum purchase invoices','Genuine trade invoices rarely total to exact thousands.','Round amounts can indicate estimates, advances booked as purchases or fictitious bills.','Vouch these invoices to the vendor’s original and the GRN.',(D,C)=>{
  const rows=D.pur.filter(r=>r.total>=50000&&Math.round(r.total)%10000===0).map(r=>ex(C_.pur(r),'Round amount',r.total,r));
  return {sev:rows.length>=10?'Medium':rows.length?'Low':'Pass',value:sum(rows,x=>x.amt),rows}; });
T('pur_split','pur','p2p','Invoices split to stay under the approval limit','Purchases should not be split to avoid the approval required above the limit.','Bypasses delegation of authority and competitive quotes.','Review these vendors for split orders and enforce PO approval on the combined value.',(D,C)=>{
  const L=C.limit, g=groupBy(D.pur.filter(r=>r.taxable>=L*0.8&&r.taxable<L),r=>r.party+'|'+r.date); const rows=[];
  Object.values(g).forEach(a=>{ if(a.length>1) a.forEach(r=>rows.push(ex(C_.pur(r),a.length+' invoices just under '+inr(L)+' on one day',r.total,r))); });
  return {sev:rows.length?'Medium':'Pass',value:sum(rows,x=>x.amt),rows}; });
T('pur_conc','pur','p2p','High dependence on one vendor','No single vendor should be critical without a documented reason and backup.','Supply disruption and the risk of collusion or unfavourable pricing.','Review rate contracts and develop alternate vendors.',(D,C)=>{
  const g=groupBy(D.pur,r=>r.party), tot=sum(D.pur,r=>r.taxable); if(!tot) return null;
  const top=Object.entries(g).map(([p,a])=>[p,sum(a,r=>r.taxable)]).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const bad=top[0]&&top[0][1]/tot>0.3;
  return {sev:bad?'Low':'Pass',value:0,head:['Vendor','Purchases','Share',''],rows:bad?top.map(([p,v])=>ex([p,inr(v),pct(v/tot),''],'Top vendors')):[]}; });
T('pur_benford','pur','p2p','First digits of purchase amounts depart from Benford’s law','In natural transaction data, first digits follow Benford’s distribution.','Large deviations can indicate made-up or manipulated amounts.','Drill into the over-represented digits and test those invoices.',(D,C)=>{
  const a=D.pur.map(r=>Math.abs(r.total)).filter(x=>x>=10); if(a.length<300) return null;
  const cnt=Array(10).fill(0); a.forEach(x=>cnt[+String(Math.floor(x))[0]]++);
  let mad=0; const rows=[]; for(let d=1;d<=9;d++){ const e=Math.log10(1+1/d), o=cnt[d]/a.length; mad+=Math.abs(o-e); rows.push(ex([String(d),pct(e),pct(o),(o-e>0?'+':'')+pct(o-e)],Math.abs(o-e)>0.03?'Over or under-represented':'')); } mad/=9;
  return {sev:mad>0.015?'Medium':mad>0.012?'Low':'Pass',value:0,head:['First digit','Expected','Actual','Gap'],rows:mad>0.012?rows:[],note:'Mean absolute deviation '+mad.toFixed(4)+' (above 0.015 is non-conformity).'}; });

/* Sales register */
T('sal_dup','sal','o2c','Duplicate sales invoice numbers','Every tax invoice must carry a unique serial number (Rule 46, CGST Rules).','Duplicates may hide unrecorded sales or double billing to customers.','Lock invoice numbering in the ERP and investigate each duplicate.',(D,C)=>{
  const g=groupBy(D.sal.filter(r=>r.type==='INV'),r=>invKey(r.inv)); const rows=[];
  Object.values(g).forEach(a=>{ if(a.length>1) a.slice(1).forEach(r=>rows.push(ex(C_.sal(r),'Invoice number used '+a.length+' times',r.total,r))); });
  const v=sum(rows,x=>x.amt); return {sev:rows.length?(v>=C.mat.pm?'High':'Medium'):'Pass',value:v,rows}; });
T('sal_gap','sal','o2c','Gaps in the sales invoice series','Invoice numbers should run without breaks; cancelled invoices should be on record.','Missing numbers may be sales issued but not recorded in the books.','Obtain the cancelled-invoice list and match gaps with GSTR-1 and e-invoice records.',(D,C)=>{
  const g=groupBy(D.sal.filter(r=>r.type==='INV'&&/\d+$/.test(r.inv)),r=>r.inv.replace(/\d+$/,'')); const rows=[];
  for(const [pre,a] of Object.entries(g)){ const ns=[...new Set(a.map(r=>+r.inv.match(/(\d+)$/)[1]))].sort((x,y)=>x-y); if(ns.length<10) continue;
    for(let i=1;i<ns.length&&rows.length<300;i++) for(let k=ns[i-1]+1;k<ns[i]&&rows.length<300&&ns[i]-ns[i-1]<50;k++) rows.push(ex(['—',pre+String(k).padStart(String(ns[i]).length,'0'),'Not in register',''],'Missing number')); }
  return {sev:rows.length?(rows.length>5?'High':'Medium'):'Pass',value:0,rows}; });
T('sal_cn','sal','o2c','High level of credit notes','Credit notes should be exceptional and supported by returns or approved discounts.','Frequent credit notes can reverse genuine sales or hide kickbacks.','Review approvals, link each credit note to a goods return or approved scheme.',(D,C)=>{
  const cn=D.sal.filter(r=>r.type==='CN'), gross=sum(D.sal.filter(r=>r.type==='INV'),r=>r.taxable), v=Math.abs(sum(cn,r=>r.taxable));
  const ratio=gross?v/gross:0; const late=cn.filter(r=>r.date>C.to);
  const bad=ratio>0.03||late.length;
  return {sev:bad?(ratio>0.06?'High':'Medium'):'Pass',value:v,rows:bad?cn.map(r=>ex(C_.sal(r),r.date>C.to?'Issued after period end':'Credit note',Math.abs(r.total),r)):[],note:'Credit notes are '+pct(ratio)+' of sales.'}; });
T('sal_price','sal','o2c','Sales below the usual selling price','Selling prices should follow the approved price list; deviations need approval.','Under-pricing causes revenue leakage and may favour related or colluding customers.','Obtain approval for each low-priced sale and review the customer relationships.',(D,C)=>{
  if(!C.has.sal.includes('item')||!C.has.sal.includes('rate')) return null;
  const g=groupBy(D.sal.filter(r=>r.type==='INV'&&r.item&&r.rate>0),r=>r.item); const rows=[];
  for(const a of Object.values(g)){ if(a.length<5) continue; const m=median(a.map(r=>r.rate)); a.filter(r=>r.rate<m*0.85).forEach(r=>rows.push(ex(C_.sal(r),r.item+' at '+inr(r.rate)+' vs usual '+inr(m),(m-r.rate)*(r.qty||1),r))); }

function runAudit(eng,D,meta){
  const has=Object.fromEntries(DS_ORDER.map(k=>[k,(meta[k]&&meta[k].has)||[]]));
  const from=eng.periodFrom, to=eng.periodTo, days=Math.max(1,daysBetween(from,to)+1);
  const st=eng.settings||{};
  const tm=Object.fromEntries((Array.isArray(eng.tbMap)?eng.tbMap:[]).map(x=>Array.isArray(x)?x:[x.a,x.h]));
  const fs=D.tb&&D.tb.length?buildFS(D.tb,tm,days):null;
  const mat=materiality(fs,eng);
  const C={eng,fs,mat,from,to,days,has,meta,limit:+st.limit||100000,mS:(st.mS!=null?+st.mS:25)/100,mD:(st.mD!=null?+st.mD:40)/100};
  const Dx={...Object.fromEntries(DS_ORDER.map(k=>[k,D[k]||[]]))};
  const results=TESTS.map(t=>{
    const ready=t.ds.every(k=>Dx[k].length)&&(!t.ds.includes('tb')||fs);
    if(!ready) return {...t,sev:'NA',rows:[],value:0,need:t.ds.filter(k=>!Dx[k].length)};
    let r=null; try{ r=t.fn(Dx,C); }catch(e){ console.error(t.id,e); r={sev:'NA',rows:[],value:0,note:'Could not run: '+e.message}; }
    if(!r) return {...t,sev:'NA',rows:[],value:0,need:[],note:'Needs columns or a period that this data does not have.'};
    return {...t,...r,count:r.rows.length,head:r.head||H[t.ds[0]]};
  });
  return {fs,mat,results,C};
}
const SEV_PTS={High:3,Medium:2,Low:1,Pass:0,NA:0};
function areaRisk(eng,run,areas){
  const ind=INDUSTRIES[eng.industry]||INDUSTRIES.mfg;
  const keys=[...new Set([...areas.map(a=>a.key),...run.results.filter(r=>r.sev!=='NA'&&r.sev!=='Pass').map(r=>r.area)])].filter(k=>LIB[k]||areas.some(a=>a.key===k));
  return keys.map(k=>{
    const a=areas.find(x=>x.key===k), [L0,I0]=a?[a.L,a.I]:matrixLI(eng.industry,k);
    const R=run.results.filter(r=>r.area===k), ran=R.filter(r=>r.sev!=='NA'), fail=ran.filter(r=>r.sev!=='Pass');
    const hi=fail.filter(r=>r.sev==='High').length, md=fail.filter(r=>r.sev==='Medium').length, val=sum(fail,r=>Math.abs(r.value||0));
    let L=L0, I=I0, Ld=null, basis='Inherent rating only: no automated tests for this area';
    if(ran.length){
      // data likelihood from how much of the testing failed, and how badly
      const dens=sum(fail,r=>SEV_PTS[r.sev])/(3*ran.length);
      Ld=dens===0?1:dens<0.15?2:dens<0.35?3:dens<0.6?4:5; if(hi) Ld=Math.max(Ld,hi>1?5:4);
      // blend with the industry rating, leaning towards the data
      L=clamp(Ld>L0?Math.ceil((L0+Ld)/2):Math.floor((L0+Ld)/2),1,5);
      basis=`${ran.length} automated test${ran.length===1?'':'s'} run, ${fail.length} with exceptions`; }
    else if(R.length) basis='Data needed: '+[...new Set(R.flatMap(r=>r.need||[]))].map(d=>DS[d].name).join(', ');
    return {key:k,name:(a&&a.name)||LIB[k].name,inScope:!!a,L0,I0,L,I,rating:riskOf(L,I),inherent:riskOf(L0,I0),ran:ran.length,total:R.length,fail,value:val,basis,pts:sum(fail,r=>SEV_PTS[r.sev])};
  }).sort((x,y)=>y.L*y.I-x.L*x.I||y.pts-x.pts);
}

/* ---------- risk-based sampling (monetary unit) ---------- */
const POP={
  pur:(r,i)=>({i,date:r.date,ref:r.inv,party:r.party,amt:r.total}),
  sal:(r,i)=>({i,date:r.date,ref:r.inv,party:r.party,amt:r.total}),
  pay:(r,i)=>({i,date:r.month,ref:r.emp,party:r.name,amt:r.gross}),
  bank:(r,i)=>({i,date:r.date,ref:String(r.narr).slice(0,40),party:'',amt:r.dr||r.cr})
};
const SAMPLE_N={High:40,Medium:25,Low:15};
function drawSample(rows,ds,n,pm,seed,flagged){
  const rnd=mulberry32(seed), pop=rows.map(POP[ds]).filter(p=>Math.abs(p.amt)>0);
  const out=[], used=new Set();
  const key=Math.max(pm,sum(pop,p=>Math.abs(p.amt))/Math.max(1,n));
  pop.filter(p=>Math.abs(p.amt)>=key).forEach(p=>{ used.add(p.i); out.push({...p,why:'Key item: above the sampling interval'}); });
  (flagged||[]).slice(0,10).forEach(([i,why])=>{ if(used.has(i)) return; const p=pop.find(x=>x.i===i); if(p){ used.add(i); out.push({...p,why:'Flagged: '+why}); } });
  const rest=pop.filter(p=>!used.has(p.i)), total=sum(rest,p=>Math.abs(p.amt)), m=Math.min(n,rest.length);
  if(m&&total>0){ const step=total/m; let start=rnd()*step, cum=0, k=0;
    for(const p of rest){ const a=Math.abs(p.amt); while(k<m&&start+k*step<cum+a){ if(!used.has(p.i)){ used.add(p.i); out.push({...p,why:'Monetary unit selection'}); } k++; } cum+=a; }
    const left=rest.filter(p=>!used.has(p.i)); let c=out.filter(x=>x.why==='Monetary unit selection').length;
    while(c<m&&left.length){ const j=Math.floor(rnd()*left.length); const p=left.splice(j,1)[0]; used.add(p.i); out.push({...p,why:'Random selection'}); c++; } }
  return out.map(x=>({...x,st:'',rm:''}));
}

async function ensureData(engId){

  LOADING[engId]=true;
  try{ for(const m of need){ const snap=await db.collection('rows').where('engId','==',engId).where('ds','==',m.ds).get();
      const docs=snap.docs.map(d=>d.data()).filter(d=>d.ver===m.ver).sort((a,b)=>a.n-b.n);
      const rows=docs.flatMap(d=>JSON.parse(d.json||'[]').map(a=>toObj(m.ds,a)));

async function saveDataset(engId,ds,rows,info){
  const ver=rid(), meta={engId,ds,ver,...dsMeta(ds,rows),has:info.has,fileName:info.fileName,uploadedAt:nowIso(),skipped:info.skipped||0};
  if(!S.live){ (DATA[engId]=DATA[engId]||{})[ds]={ver,rows}; const i=S.d.datasets.findIndex(d=>d.engId===engId&&d.ds===ds); const v={...meta,id:engId+'__'+ds}; if(i>=0) S.d.datasets[i]=v; else S.d.datasets.push(v); AUTO.key=''; render(); return; }
  const chunks=[]; let cur=[], len=0;
  rows.forEach(r=>{ const a=toArr(ds,r), s=JSON.stringify(a).length+1; if(len+s>180000&&cur.length){ chunks.push(cur); cur=[]; len=0; } cur.push(a); len+=s; });
  if(cur.length) chunks.push(cur);
  for(let n=0;n<chunks.length;n++){ await db.doc(`rows/${engId}__${ds}__${ver}__${n}`).set({engId,ds,ver,n,json:JSON.stringify(chunks[n])}); }
  (DATA[engId]=DATA[engId]||{})[ds]={ver,rows};
  await db.doc(`datasets/${engId}__${ds}`).set({...meta,chunks:chunks.length});
  try{ const old=await db.collection('rows').where('engId','==',engId).where('ds','==',ds).get(); for(const d of old.docs){ if(d.data().ver!==ver) await db.doc('rows/'+d.id).delete(); } }catch(e){ console.warn('cleanup',e); }

async function saveEng(id){

  const data={industry:val('f-ind'),title:val('f-title')||'Internal audit',code:val('f-code'),status:val('f-status'),periodFrom:val('f-from'),periodTo:val('f-to'),start:val('f-start'),reportDue:val('f-due'),partner:val('f-partner'),manager:val('f-manager'),team:val('f-team'),budgetHours:num('f-hours')};

function pbcItems(e){
  const ind=INDUSTRIES[e.industry]||INDUSTRIES.mfg, up=dsMetaOf(e.id);
  const items=[...ind.ds.map(k=>({key:'ds:'+k,label:DS[k].name,need:DS[k].need+' Excel or CSV, in the template format or any similar export (Tally, SAP, Busy).',kind:'data',up:!!up[k]})),
    ...[...ind.docs,...COMMON_DOCS].map(d=>({key:'doc:'+slug(d),label:d,kind:'doc'})),
    ...(e.pbcCustom||[]).map(c=>({key:'cu:'+c.id,label:c.label,kind:'doc',custom:true}))];
  const P=e.pbc||{};
  items.forEach(i=>{ const p=P[i.key]||{}; i.st=p.st||(i.up?'Received':'Requested'); if(i.up&&i.st==='Requested') i.st='Received'; i.due=p.due||''; });
  return items;
}

  const n=needEng(); if(n) return `<div class="head"><div><h1>Data request</h1></div></div>`+n;
  const e=engById(S.eng), items=pbcItems(e), got=items.filter(i=>i.st==='Received'||i.st==='Not applicable').length;
  const row=i=>`<div class="pbc-row"><div style="min-width:0"><b>${esc(i.label)}</b>${i.kind==='data'?` <span class="pill sky">Data for automated tests</span>`:''}${i.up?' <span class="pill good">Uploaded</span>':''}${i.need?`<div class="muted small">${esc(i.need)}</div>`:''}</div>
    <select data-pbc="${esc(i.key)}" data-f="st" aria-label="Status" ${S.canWrite?'':'disabled'}>${['Requested','Partly received','Received','Not applicable'].map(s=>`<option ${s===i.st?'selected':''}>${s}</option>`).join('')}</select>
    <input type="date" data-pbc="${esc(i.key)}" data-f="due" value="${esc(i.due)}" aria-label="Due date" ${S.canWrite?'':'disabled'}></div>`;

let UP=null;
async function startUpload(file,ds){
  if(typeof XLSX==='undefined') return toast('The spreadsheet reader did not load. Check your connection and reopen the page.');
  if(file.size>25e6) return toast('That file is over 25 MB. Split it by quarter and upload the parts one at a time.');
  toast('Reading '+file.name+'…');
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:false,raw:false});
    const sheets=wb.SheetNames.map(n=>({n,aoa:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''})})).filter(s=>s.aoa.length);
    if(!sheets.length) return toast('The file has no rows.');
    const si=sheets.reduce((b,s,i)=>s.aoa.length>sheets[b].aoa.length?i:b,0);
    const hdr=detectHeader(sheets[si].aoa,ds);
    UP={ds,file:file.name,sheets,si,hdr,map:autoMap(sheets[si].aoa[hdr]||[],ds)};
    mapModal();
  }catch(e){ console.error(e); toast('Could not read that file. Save it as .xlsx or .csv and try again.'); }
}
function mapModal(){
  const u=UP, aoa=u.sheets[u.si].aoa, headers=(aoa[u.hdr]||[]).map((h,i)=>String(h||'').trim()||'Column '+(i+1));
  const err=mapError(u.ds,u.map), prev=err?{rows:[],skipped:0}:parseSheet(aoa,u.hdr,u.map,u.ds);
  const keys=DS[u.ds].keys;
  const opts=k=>`<option value="">— not in this file —</option>`+headers.map((h,i)=>`<option value="${i}" ${u.map[k]===i?'selected':''}>${esc(h)}</option>`).join('');
  openModal('Match columns: '+DS[u.ds].name,`<p class="muted small">${esc(u.file)}. The system matched the columns it recognised. Check them, fix any that are wrong, then import.</p>
    <div class="fgrid">${u.sheets.length>1?`<label class="f">Sheet<select data-upf="si">${u.sheets.map((s,i)=>`<option value="${i}" ${i===u.si?'selected':''}>${esc(s.n)} (${s.aoa.length} rows)</option>`).join('')}</select></label>`:''}<label class="f">Header row<input type="number" min="1" data-upf="hdr" value="${u.hdr+1}"></label></div>
    <div class="mapgrid">${DS[u.ds].fields.map(f=>`<label class="f">${esc(f.label)}${f.req?' <span class="req">*</span>':''}<select data-map="${f.k}">${opts(f.k)}</select></label>`).join('')}</div>
    ${err?`<div class="alert-strip"><div class="t">${ic('alert',16)}${esc(err)}</div></div>`:`<div class="steps-line"><b>${prev.rows.length.toLocaleString('en-IN')}</b> rows ready to import${prev.skipped?`, ${prev.skipped} skipped (blank, totals or no date)`:''}.</div>
    <div class="preview"><table><thead><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${prev.rows.slice(0,6).map(r=>`<tr>${keys.map(k=>`<td class="small">${esc(typeof r[k]==='number'?r[k].toLocaleString('en-IN'):r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
    <div class="actions"><button class="btn" data-act="up-cancel">Cancel</button><button class="btn sky" data-act="up-import" ${err||!prev.rows.length?'disabled':''}>Import ${prev.rows.length.toLocaleString('en-IN')} rows</button></div>`,true);
}
async function doImport(){
  const u=UP; const aoa=u.sheets[u.si].aoa; const p=parseSheet(aoa,u.hdr,u.map,u.ds);
  if(!p.rows.length) return toast('No rows to import.');
  const eng=S.eng, ds=u.ds; const btn=document.querySelector('[data-act="up-import"]'); if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  const ok=await guard(()=>saveDataset(eng,ds,p.rows,{has:hasKeys(ds,u.map),fileName:u.file,skipped:p.skipped}),`Imported ${p.rows.length.toLocaleString('en-IN')} rows of ${DS[ds].name.toLowerCase()}`);
  if(ok){ UP=null; closeModal(); AUTO.key=''; render(); }
  else if(btn){ btn.disabled=false; btn.textContent='Import'; }
}

  const line=(label,a,b,cls)=>{ const d=chg(a,b); return `<tr class="${cls||''}"><td class="${cls==='tot'?'':'ind'}">${esc(label)}</td><td class="r mono">${lakh(a)}</td><td class="r mono">${p?lakh(b):'—'}</td><td class="r mono ${d!=null&&Math.abs(d)>=0.2?'flag':''}">${d==null?'—':(d>0?'+':'')+pct(d,0)}</td></tr>`; };

  const R=[['Gross margin','gm',x=>pct(x)],['Net margin (PBT)','nm',x=>pct(x)],['Debtor days','dd',x=>Math.round(x)+' d'],['Creditor days','cd',x=>Math.round(x)+' d'],['Inventory days','id',x=>Math.round(x)+' d'],['Current ratio','cr',x=>x.toFixed(2)],['Debt-equity','de',x=>x.toFixed(2)],['Interest cover','ic',x=>x.toFixed(2)],['Employee cost to revenue','emp',x=>pct(x)]];
  const flags=new Set(run.results.filter(r=>r.id.startsWith('fs_')&&r.sev!=='Pass'&&r.sev!=='NA').flatMap(r=>r.rows.map(x=>x.c[0])));

    ${tile('Revenue',lakh(c.rev),'fin','tone-sky',p?'Last period '+lakh(p.rev):'No comparative')}

    ${tile('Profit before tax',lakh(c.pbt),'fin',c.pbt<0?'tone-bad':'tone-good',p?'Last period '+lakh(p.pbt):'')}
    ${tile('Materiality',lakh(run.mat.om),'auto','tone-warn','Performance '+lakh(run.mat.pm)+' · '+run.mat.basis)}
  </div>
  ${!fs.hasClose?`<div class="alert-strip"><div class="t">${ic('alert',16)}No closing stock found in the trial balance</div><p>Gross margin and inventory ratios need closing stock. Add the closing stock ledger or map it below.</p></div>`:''}
  ${Math.abs(c.diff)>1?`<div class="alert-strip"><div class="t">${ic('alert',16)}Balance sheet differs by ${inr(c.diff)}</div><p>Usually a ledger in the wrong head, or the trial balance includes current profit already. Check the grouping below.</p></div>`:''}
  <div class="grid2">
    <div class="panel"><h2>Statement of profit and loss</h2><div class="tablewrap"><table class="fs"><thead><tr><th>Particulars</th><th class="r">This period</th><th class="r">Last period</th><th class="r">Change</th></tr></thead><tbody>
      ${pl.map(([k,l])=>line(l,c.t[k],p&&p.t[k])).join('')}
      ${line('Total income',c.rev+c.t.OI,p&&p.rev+p.t.OI,'tot')}
      ${line('Cost of materials and direct costs',c.cogs,p&&p.cogs)}
      ${ex.map(([k])=>line(HEADS[k],c.t[k],p&&p.t[k])).join('')}
      ${line('Profit before tax',c.pbt,p&&p.pbt,'tot')}
    </tbody></table></div></div>
    <div class="panel"><h2>Balance sheet</h2><div class="tablewrap"><table class="fs"><thead><tr><th>Particulars</th><th class="r">This period</th><th class="r">Last period</th><th class="r">Change</th></tr></thead><tbody>

      ${line('Total equity and liabilities',c.liab,p&&p.liab,'tot')}
      ${['FA','INVST','INV','REC','CASH','LA'].map(k=>line(HEADS[k],c.t[k],p&&p.t[k])).join('')}
      ${c.t.SUS?line(HEADS.SUS,c.t.SUS,p&&p.t.SUS):''}
      ${line('Total assets',c.assets,p&&p.assets,'tot')}

  </div>

    ${R.map(([l,k,f])=>{ const a=c.r[k], b=p&&p.r[k]; return `<tr><td>${l}</td><td class="r mono">${a==null?'—':f(a)}</td><td class="r mono">${b==null?'—':f(b)}</td><td>${flags.has(l)?'<span class="pill warn">Flagged</span>':''}</td></tr>`; }).join('')}
  </tbody></table></div><p class="muted small">Days use the ${run.C.days}-day audit period. Cost of materials = opening stock + purchases + direct expenses − closing stock.</p></div>

/* ---------- Automated audit ---------- */
VIEWS.auto=function(){
  const n=needEng(); if(n) return `<div class="head"><div><h1>Automated audit</h1></div></div>`+n;
  const e=engById(S.eng), run=auto(S.eng), meta=dsMetaOf(e.id), ind=INDUSTRIES[e.industry]||INDUSTRIES.mfg;
  const head=engHeader('Automated audit','The system runs every test the uploaded data allows, scores each process area High, Medium or Low against the industry risk matrix, and drafts observations for you to review.',S.canWrite?`<button class="btn" data-act="auto-settings">Settings</button>`:'');
  const cov=`<div class="cov">${ind.ds.map(k=>`<span class="${meta[k]?'on':''}">${ic(meta[k]?'check':'clock',12)}${esc(DS[k].name)}</span>`).join('')}</div>`;
  if(!run||run.empty) return head+cov+noDataBox(); if(run.loading) return head+cov+loadingBox();
  const R=run.results, ran=R.filter(r=>r.sev!=='NA'), fail=ran.filter(r=>r.sev!=='Pass');
  const cnt=s=>fail.filter(r=>r.sev===s).length;
  const groups=S.ui.autoGroup==='ds'?DS_ORDER.map(k=>[DS[k].name,ran.filter(r=>r.ds[0]===k)]):run.areas.map(a=>[a.name,ran.filter(r=>r.area===a.key)]);
  const drafted=new Set(S.d.observations.filter(o=>o.engId===e.id&&o.source).map(o=>o.source));
  return head+cov+`
  <div class="tiles">
    ${tile('Tests run',ran.length+' / '+R.length,'auto','tone-sky',R.length-ran.length+' need more data')}
    ${tile('With exceptions',fail.length,'alert',fail.length?'tone-bad':'tone-good',`${cnt('High')} high · ${cnt('Medium')} medium · ${cnt('Low')} low`)}
    ${tile('Materiality',lakh(run.mat.om),'fin','tone-warn','Performance '+lakh(run.mat.pm)+' · trivial '+lakh(run.mat.tr))}
    ${tile('High-risk areas',run.areas.filter(a=>a.rating==='High').length,'plan','tone-bad','of '+run.areas.length+' areas scored')}
  </div>
  <div class="toolbar">${S.canWrite?`<button class="btn sky" data-act="auto-apply">${ic('plan',16)}Apply ratings to audit plan</button><button class="btn" data-act="auto-draft">${ic('observations',16)}Draft observations for high and medium results</button>`:''}<button class="btn" data-act="auto-xlsx">${ic('download',16)}Export results</button><button class="btn" data-tab="sample">${ic('sample',16)}Pick samples</button></div>
  <h2>Risk output by area</h2>
  <div class="risk-cards">${run.areas.map(areaCard).join('')}</div>
  <div class="panel"><div class="panel-h"><h2>Test results</h2><div class="segs" role="group" aria-label="Group by"><button data-act="agroup" data-v="area" aria-pressed="${S.ui.autoGroup!=='ds'}">By area</button><button data-act="agroup" data-v="ds" aria-pressed="${S.ui.autoGroup==='ds'}">By data set</button></div></div>
  <div class="tablewrap"><table><thead><tr><th>Result</th><th>Test</th><th class="r">Exceptions</th><th class="r">Value</th><th></th></tr></thead><tbody>
  ${groups.filter(g=>g[1].length).map(([g,rs])=>`<tr><td colspan="5" style="background:var(--sunk)"><b>${esc(g)}</b></td></tr>`+rs.sort((a,b)=>SEV_PTS[b.sev]-SEV_PTS[a.sev]).map(r=>`<tr class="click sev ${r.sev}" data-act="test-open" data-id="${r.id}"><td>${sevPill(r.sev)}</td><td>${esc(r.title)}${drafted.has('auto:'+r.id)?' <span class="pill sky">Drafted</span>':''}<div class="muted small">${esc(S.ui.autoGroup==='ds'?areaName(r.area):r.ds.map(d=>DS[d].name).join(' + '))}${r.note?' · '+esc(r.note):''}</div></td><td class="r mono">${r.count||0}</td><td class="r mono small">${r.value?lakh(Math.abs(r.value)):'—'}</td><td><button class="btn sm">View</button></td></tr>`).join('')).join('')}
  </tbody></table></div></div>
  ${R.length>ran.length?`<div class="panel"><h2>Tests waiting for data</h2><div class="list">${R.filter(r=>r.sev==='NA').map(r=>`<div class="item"><div><b>${esc(r.title)}</b><div class="muted small">${esc(r.note||('Needs: '+(r.need||[]).map(d=>DS[d].name).join(', ')))}</div></div><span class="pill info">${esc(areaName(r.area))}</span></div>`).join('')}</div></div>`:''}`;
};
function testModal(id){
  const run=auto(S.eng); const r=run&&run.results&&run.results.find(x=>x.id===id); if(!r) return;

function obsFromTest(r,e){
  const top=(r.rows||[]).slice(0,5).map(x=>'• '+x.c.filter(Boolean).slice(0,3).join(' · ')+(x.why?' — '+x.why:'')).join('\n');

/* ---------- Sampling ---------- */
VIEWS.sample=function(){
  const n=needEng(); if(n) return `<div class="head"><div><h1>Sampling</h1></div></div>`+n;
  const e=engById(S.eng), run=auto(S.eng);
  const head=engHeader('Sampling','The system picks samples sized to each area’s risk: every item above the sampling interval, up to ten items flagged by the tests, then monetary unit selection from the rest, so larger amounts are more likely to be picked. Vouch each item and record the result.');
  if(!run||run.empty) return head+noDataBox(); if(run.loading) return head+loadingBox();
  const dsl=['pur','sal','pay','bank'].filter(k=>run.D[k]&&run.D[k].length);
  if(!dsl.length) return head+`<div class="empty">Upload a purchase, sales, payroll or bank file to sample from.</div>`;
  return head+`<div class="tiles">${tile('Performance materiality',lakh(run.mat.pm),'fin','tone-warn','Floor for key items tested in full')}${tile('Sample sizes',`${SAMPLE_N.High} / ${SAMPLE_N.Medium} / ${SAMPLE_N.Low}`,'sample','tone-sky','High / medium / low risk area')}</div>`+dsl.map(k=>{
    const rows=run.D[k], ar=run.areas.find(a=>a.key===DS[k].area), rating=ar?ar.rating:'Medium', sid=e.id+'__'+k, smp=S.d.samples.find(s=>s.id===sid);
    const pop=rows.length, popv=sum(rows,r=>Math.abs(POP[k](r,0).amt));
    if(!smp) return `<div class="panel"><div class="panel-h"><div><h2>${esc(DS[k].name)}</h2><div class="muted small">${pop.toLocaleString('en-IN')} items · ${lakh(popv)} · ${esc(LIB[DS[k].area].name)} is ${riskPill(rating)}</div></div>
      ${S.canWrite?`<div class="toolbar"><label class="small muted">Sample size <input type="number" min="1" max="500" id="n-${k}" value="${SAMPLE_N[rating]}" style="width:80px"></label><button class="btn sky" data-act="smp-draw" data-ds="${k}">${ic('sample',16)}Draw sample</button></div>`:''}</div></div>`;
    const done=smp.items.filter(i=>i.st).length, exc=smp.items.filter(i=>i.st==='exc').length;
    return `<div class="panel"><div class="panel-h"><div><h2>${esc(DS[k].name)}</h2><div class="muted small">${smp.items.length} items selected from ${pop.toLocaleString('en-IN')} (${lakh(sum(smp.items,i=>Math.abs(i.amt)))} covered, ${pct(sum(smp.items,i=>Math.abs(i.amt))/popv,0)} of value) · ${done} vouched · ${exc} exceptions · drawn ${fmtDate((smp.drawnAt||'').slice(0,10))}</div></div>
      <div class="toolbar"><button class="btn sm" data-act="smp-xlsx" data-ds="${k}">${ic('download',14)}Excel</button>${S.canWrite?`<button class="btn sm" data-act="smp-redraw" data-ds="${k}">Redraw</button>`:''}</div></div>
      <div class="bar good"><span style="width:${smp.items.length?done*100/smp.items.length:0}%"></span></div>
      <div class="tablewrap"><table><thead><tr><th>#</th><th>Date</th><th>Reference</th><th>Party</th><th class="r">Amount</th><th>Why selected</th><th>Result</th><th>Remark</th></tr></thead><tbody>
      ${smp.items.map((it,i)=>`<tr data-vouch="${sid}" data-i="${i}"><td class="mono small">${i+1}</td><td class="small">${k==='pay'?fmtMonth(it.date):fmtDate(it.date)}</td><td class="small">${esc(it.ref)}</td><td class="small">${esc(it.party)}</td><td class="r mono small">${inr(it.amt)}</td><td class="small muted">${esc(it.why)}</td>
        <td><div class="segs res" role="group" aria-label="Result"><button data-act="vouch" data-v="ok" aria-pressed="${it.st==='ok'}" ${S.canWrite?'':'disabled'}>OK</button><button data-act="vouch" data-v="exc" aria-pressed="${it.st==='exc'}" ${S.canWrite?'':'disabled'}>Exception</button></div></td>
        <td><input type="text" data-vrm="1" value="${esc(it.rm)}" placeholder="Document seen, issue" aria-label="Remark" style="min-width:160px" ${S.canWrite?'':'disabled'}></td></tr>`).join('')}
      </tbody></table></div></div>`; }).join('');
};

/* ---------- Risk & planning ---------- */
VIEWS.plan=function(){
  const n=needEng(); if(n) return `<div class="head"><div><h1>Risk & planning</h1></div></div>`+n;
  const e=engById(S.eng), A=areasOf(S.eng), h=hours(S.eng);
  const cell=(L,I)=>{ const s=L*I; const cls=s>=15?'h':s>=8?'m':'l'; const items=A.filter(a=>{ const [l,i]=effLI(a); return l===L&&i===I; }); return `<div class="cell ${cls}" title="Likelihood ${L} × Impact ${I} = ${s}">${items.map(a=>`<button class="chip" data-act="area-edit" data-id="${a.id}" title="${esc(a.name)}">${esc(a.code||a.name.slice(0,4))}</button>`).join('')}</div>`; };
  const budget=e.budgetHours||0, auto_=A.some(a=>a.autoL);
  return engHeader('Risk & planning',`Inherent ratings come from the ${esc(indName(e.industry).toLowerCase())} risk matrix. ${auto_?'Data-driven ratings from the automated audit are applied.':'Run the automated audit and apply its ratings to adjust them with data.'}`)+`
  <div class="tiles">
    ${tile('Areas in scope',A.length,'plan','tone-sky',`${A.filter(a=>riskOf(...effLI(a))==='High').length} rated high`)}
    ${tile('Planned hours',h.plan,'clock','tone-sky',budget?`Budget ${budget} hours`:'No budget set')}
    ${tile('Hours used',h.act,'clock',budget&&h.act>budget?'tone-bad':'tone-good',budget?`${Math.round(h.act*100/budget)}% of budget`:'')}
    ${tile('Areas reviewed',A.filter(a=>a.reviewed).length+' / '+A.length,'check','tone-good','Signed off by manager')}
  </div>
  <div class="grid2">
    <div class="panel"><div class="panel-h"><h2>Risk heat map</h2><span class="muted small">${auto_?'Data-driven where applied':'Inherent'}</span></div>
      <div class="heat">${[5,4,3,2,1].map(L=>`<div class="ax">${L}</div>${[1,2,3,4,5].map(I=>cell(L,I)).join('')}`).join('')}<div></div>${[1,2,3,4,5].map(I=>`<div class="ax">${I}</div>`).join('')}</div>
      <div class="legend"><span>↑ Likelihood · Impact →</span><span><i style="background:var(--bad-soft);outline:1px solid var(--bad)"></i>High</span><span><i style="background:var(--warn-soft);outline:1px solid var(--accent)"></i>Medium</span><span><i style="background:var(--good-soft);outline:1px solid var(--good)"></i>Low</span></div>
    </div>
    <div class="panel"><div class="panel-h"><h2>Hours by area</h2><span class="muted small">Used of planned</span></div>
      <div class="list">${A.map(a=>{ const p=a.plannedHours?Math.min(100,a.actualHours*100/a.plannedHours):0; return `<div class="hbar"><span>${esc(a.name)}</span><div class="bar ${a.actualHours>a.plannedHours?'over':'good'}"><span style="width:${p}%"></span></div><span class="mono small">${a.actualHours}/${a.plannedHours}</span></div>`; }).join('')}</div>
    </div>
  </div>
  <div class="panel"><div class="panel-h"><h2>Audit plan</h2>${S.canWrite?`<button class="btn sm" data-act="area-add">${ic('plus',14)}Add area</button>`:''}</div>
  <div class="tablewrap"><table><thead><tr><th>Area</th><th>Inherent</th><th>Data-driven</th><th>Auditee</th><th class="r">Hours</th><th>Tested</th><th>Status</th></tr></thead><tbody>
  ${A.map(a=>{ const st=a.steps||[], d=st.filter(s=>s.result).length, [l,i]=effLI(a); return `<tr class="click sev ${riskOf(l,i)}" data-act="area-edit" data-id="${a.id}"><td><b>${esc(a.name)}</b> <span class="muted mono small">${esc(a.code||'')}</span></td><td>${riskPill(riskOf(a.L,a.I))} <span class="mono small muted">${a.L}×${a.I}</span></td><td>${a.autoL?`${riskPill(riskOf(a.autoL,a.autoI))} <span class="mono small muted">${a.autoL}×${a.autoI}</span>`:'<span class="muted small">Not applied</span>'}</td><td class="small">${esc(a.auditee||'—')}</td><td class="r mono">${a.actualHours}/${a.plannedHours}</td><td class="mono small">${d}/${st.length}</td><td><span class="pill ${a.status==='Done'?'good':a.status==='In progress'?'sky':'info'}">${esc(a.status)}</span>${a.reviewed?' <span class="pill good">Reviewed</span>':''}</td></tr>`; }).join('')||`<tr><td colspan="7" class="muted">No areas yet.</td></tr>`}
  </tbody></table></div></div>`;
};

/* ---------- Work programme ---------- */
VIEWS.work=function(){
  const n=needEng(); if(n) return `<div class="head"><div><h1>Work programme</h1></div></div>`+n;
  const A=areasOf(S.eng); if(!A.length) return engHeader('Work programme','No areas in scope yet.')+`<div class="empty">Add process areas in Risk & planning first.<button class="btn" data-tab="plan">Go to planning</button></div>`;
  if(!A.some(a=>a.id===S.area)) S.area=A[0].id;
  const a=A.find(x=>x.id===S.area), st=a.steps||[], d=st.filter(s=>s.result).length, p=progress(S.eng);
  const run=auto(S.eng), at=run&&run.results?run.results.filter(r=>r.area===a.key&&r.sev!=='NA'):[];
  return engHeader('Work programme',`Record the result of each test step with the sample and working paper reference. ${p.done} of ${p.total} steps tested across all areas.`)+`
  <div class="area-tabs" role="group" aria-label="Process area">${A.map(x=>{ const s=x.steps||[], dd=s.filter(y=>y.result).length, ex=s.filter(y=>y.result==='exc').length; return `<button data-act="area-pick" data-id="${x.id}" aria-pressed="${x.id===a.id}">${esc(x.name)} <span class="mono small">${dd}/${s.length}</span>${ex?`<span class="badge bad">${ex}</span>`:''}</button>`; }).join('')}</div>
  ${at.length?`<div class="panel"><div class="panel-h"><h3>Automated tests for this area</h3><button class="btn sm" data-tab="auto">All results</button></div><div class="list">${at.map(r=>`<div class="item click" data-act="test-open" data-id="${r.id}" style="cursor:pointer"><span>${esc(r.title)}</span><span>${sevPill(r.sev)} <span class="mono small">${r.count||0}</span></span></div>`).join('')}</div></div>`:''}
  <div class="panel">
    <div class="panel-h"><div><h2>${esc(a.name)}</h2><div class="muted small">${riskPill(riskOf(...effLI(a)))} · ${d} of ${st.length} tested · Auditee: ${esc(a.auditee||'not set')}</div></div>
      <div class="toolbar">${S.canWrite?`<button class="btn sm" data-act="step-add" data-id="${a.id}">${ic('plus',14)}Add step</button>`:''}<button class="btn sm" data-act="area-edit" data-id="${a.id}">Area details</button></div></div>
    <div class="list">${st.map((s,i)=>`<div class="step" data-area="${a.id}" data-step="${s.id}">
      <div class="no">${String(i+1).padStart(2,'0')}</div>
      <div><div>${esc(s.text)}</div>
        <div class="row">
          <div class="segs res" role="group" aria-label="Result">${[['ok','Satisfactory'],['exc','Exception'],['na','N/A']].map(([v,l])=>`<button data-act="step-res" data-v="${v}" aria-pressed="${s.result===v}" ${S.canWrite?'':'disabled'}>${l}</button>`).join('')}</div>
          <label class="small muted">Sample <input type="number" min="0" data-sf="sample" value="${esc(s.sample)}" aria-label="Sample size" ${S.canWrite?'':'disabled'}></label>
          <label class="small muted">Exceptions <input type="number" min="0" data-sf="exceptions" value="${esc(s.exceptions||0)}" aria-label="Exceptions found" ${S.canWrite?'':'disabled'}></label>
          <input type="text" class="wp" data-sf="wp" value="${esc(s.wp)}" placeholder="WP ref" aria-label="Working paper reference" ${S.canWrite?'':'disabled'}>
          <input type="text" class="note" data-sf="note" value="${esc(s.note)}" placeholder="Note: what you checked and found" aria-label="Note" ${S.canWrite?'':'disabled'}>
          ${s.result==='exc'&&S.canWrite?`<button class="btn sm danger" data-act="obs-from-step">${ic('observations',14)}Raise observation</button>`:''}
        </div></div></div>`).join('')||'<p class="muted">No steps. Add one.</p>'}</div>
  </div>`;
};
async function saveStep(areaId,stepId,patch){
  const a=S.d.areas.find(x=>x.id===areaId); if(!a) return;
  const steps=(a.steps||[]).map(s=>s.id===stepId?{...s,...patch}:s);
  const all=steps.length&&steps.every(s=>s.result), any=steps.some(s=>s.result);
  const status=all?'Done':any?'In progress':a.status;
  if(!S.live){ a.steps=steps; a.status=status; return; }
  await guard(()=>db.doc('areas/'+areaId).update({steps,status}));
}

/* ---------- Observations ---------- */
VIEWS.observations=function(){
  const u=S.ui;
  let list=S.d.observations.filter(o=>(!u.oEng||o.engId===u.oEng)&&(!u.oRisk||o.risk===u.oRisk)&&(!u.oStat||o.status===u.oStat));
  const q=u.q.toLowerCase(); if(q) list=list.filter(o=>(o.title+' '+o.ref+' '+o.condition+' '+o.owner).toLowerCase().includes(q));
  list.sort((a,b)=>RISKS.indexOf(a.risk)-RISKS.indexOf(b.risk)||String(a.ref).localeCompare(String(b.ref),undefined,{numeric:true}));
  return `<div class="head"><div><h1>Observations</h1><p>Findings in the five-part format: criteria, condition, cause, effect and recommendation, with management’s response and an owner. Drafts from the automated audit wait here for your review.</p></div>${S.canWrite?`<button class="btn sky" data-act="obs-new">${ic('plus',16)}New observation</button>`:''}</div>
  <div class="toolbar"><div class="grow"><input type="search" id="q" data-ch="q" placeholder="Search title, reference, owner" value="${esc(u.q)}"></div>
    <select data-ch="oEng" aria-label="Engagement">${engOptions(u.oEng,true)}</select>
    <select data-ch="oRisk" aria-label="Risk"><option value="">All risks</option>${RISKS.map(r=>`<option ${u.oRisk===r?'selected':''}>${r}</option>`).join('')}</select>
    <select data-ch="oStat" aria-label="Status"><option value="">All statuses</option>${OSTAT.map(r=>`<option ${u.oStat===r?'selected':''}>${r}</option>`).join('')}</select>
    <button class="btn" data-act="xlsx-obs">${ic('download',16)}Excel</button></div>
  ${list.length?`<div class="tablewrap"><table><thead><tr><th>Ref</th><th>Observation</th><th>Area</th><th>Risk</th><th class="r">Impact</th><th>Owner</th><th>Target</th><th>Status</th></tr></thead><tbody>
  ${list.map(o=>`<tr class="click sev ${o.risk}" data-act="obs-open" data-id="${o.id}"><td class="mono small">${esc(o.ref)}</td><td><b>${esc(o.title)}</b>${o.repeat?' <span class="pill warn">Repeat</span>':''}${o.source?' <span class="pill sky">From data</span>':''}<div class="muted small">${esc(clientOf(engById(o.engId)).name)}</div></td><td class="small">${esc(areaName(o.area))}</td><td>${riskPill(o.risk)}</td><td class="r mono small">${o.impact?lakh(o.impact):'—'}</td><td class="small">${esc(o.owner||'—')}</td><td class="small ${isOverdue(o)?'tone-bad':''}">${fmtDate(o.targetDate)}</td><td>${oPill(o.status)}</td></tr>`).join('')}
  </tbody></table></div>`:`<div class="empty">${ic('observations',28)}<b>No observations match</b><p>Draft them from the automated audit, raise one from an exception in the work programme, or create one directly.</p></div>`}`;
};

    <fieldset><legend>Finding</legend>

      ${Fx('o-condition','Condition: what we found',o.condition,'Facts with numbers: how many tested, how many failed, amount',4)}
      ${Fx('o-cause','Cause: why it happened',o.cause,'',2)}
      ${Fx('o-effect','Effect: risk or impact',o.effect,'',2)}

    </fieldset>

function nextRef(engId){ const e=engById(engId); const used=new Set(S.d.observations.filter(o=>o.engId===engId).map(o=>o.ref)); let n=S.d.observations.filter(o=>o.engId===engId).length+1, r; do{ r=`${(e&&e.code)||'IA'}-${String(n++).padStart(2,'0')}`; }while(used.has(r)); return r; }
async function saveObs(id){
  const engId=val('o-eng');
  const data={engId,area:val('o-area'),title:val('o-title'),risk:val('o-risk'),impact:num('o-impact'),status:val('o-status'),repeat:!!(document.getElementById('o-repeat')||{}).checked,
    criteria:val('o-criteria'),condition:val('o-condition'),cause:val('o-cause'),effect:val('o-effect'),recommendation:val('o-rec'),response:val('o-resp'),owner:val('o-owner'),targetDate:val('o-target')};
  if(!data.title) return toast('Give the observation a title.');
  data.ref=val('o-ref')||(id?(S.d.observations.find(o=>o.id===id)||{}).ref:'')||nextRef(engId);
  if(val('o-source')) data.source=val('o-source');
  if(id){ const old=S.d.observations.find(o=>o.id===id); if(await guard(()=>store.set('observations',id,{...old,...data}),'Observation saved')) closeModal(); }
  else if(await guard(()=>store.add('observations',{...data,followUps:[],createdAt:nowIso()}),'Observation raised')) closeModal();
}

/* ---------- Action tracker ---------- */
function actionTable(list){
  if(!list.length) return `<p class="muted">Nothing to track.</p>`;
  const t=today();
  return `<div class="tablewrap"><table><thead><tr><th>Observation</th><th>Risk</th><th>Owner</th><th>Target</th><th>Ageing</th><th>Status</th><th></th></tr></thead><tbody>
  ${list.map(o=>{ const dl=o.targetDate?daysBetween(t,o.targetDate):null; const done=['Implemented','Closed'].includes(o.status);
