async function saveFile(name,data,mime){
  if(downloads){ try{ await downloads.save({filename:name,data}); return true; }catch(e){ if(e&&e.code&&/declin|cancel/i.test(e.code)) return true; console.warn(e); } }
  if(!window.claude){ try{ const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:mime})); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); return true; }catch{} }
  toast('Downloads are not available here. Open this page on claude.ai to save files.'); return false;
}
function obsRows(list){ return list.map(o=>({Ref:o.ref,Client:clientOf(engById(o.engId)).name,Engagement:(engById(o.engId)||{}).title||'',Area:areaName(o.area),Observation:o.title,Risk:o.risk,'Impact (₹)':o.impact||0,Repeat:o.repeat?'Yes':'No',Criteria:o.criteria,Condition:o.condition,Cause:o.cause,Effect:o.effect,Recommendation:o.recommendation,'Management response':o.response,Owner:o.owner,'Target date':o.targetDate,Status:o.status,'Latest follow-up':((o.followUps||[]).slice(-1)[0]||{}).note||''})); }
async function xlsx(name,sheets){
  if(typeof XLSX==='undefined') return toast('The Excel library did not load. Check your connection.');
  const wb=XLSX.utils.book_new();
  for(const [n,rows,aoa] of sheets){ const ws=aoa?XLSX.utils.aoa_to_sheet(aoa):XLSX.utils.json_to_sheet(rows.length?rows:[{Note:'No records'}]);
    if(!aoa){ const keys=Object.keys(rows[0]||{Note:1}); ws['!cols']=keys.map(k=>({wch:Math.min(60,Math.max(10,k.length+2,...rows.slice(0,200).map(r=>String(r[k]??'').length)))})); }
    XLSX.utils.book_append_sheet(wb,ws,n.slice(0,31)); }
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  await saveFile(name,new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}

/* ---------- clicks ---------- */
document.addEventListener('click',async ev=>{
  if(ev.target.id==='modal'){ closeModal(); return; }
  const t=ev.target.closest('[data-act],[data-tab]'); if(!t) return;
  if(t.dataset.tab && !t.dataset.act){ if(!$('#modal').hidden) closeModal(); go(t.dataset.tab); return; }
  const a=t.dataset.act, id=t.dataset.id, e=engById(S.eng);
  if(a==='drawer') return toggleDrawer();
  if(a==='drawer-close') return toggleDrawer(false);
  if(a==='close'||a==='up-cancel') return closeModal();
  if(a==='estat'){ S.ui.eStat=t.dataset.v; return render(); }
  if(a==='atab'){ S.ui.aTab=t.dataset.v; return render(); }
  if(a==='agroup'){ S.ui.autoGroup=t.dataset.v; return render(); }

  /* engagements */
  if(a==='eng-new'){ if(!S.canWrite) return toast('You have view-only access.'); return openModal('New engagement',engForm(),true); }
  if(a==='eng-open'){ S.eng=id; LS.set('eng',id); const x=engById(id); const p=progress(id), h=hours(id);

  if(a==='auto-settings'){ const st=e.settings||{}; const run=auto(S.eng);
    return openModal('Automated audit settings',`<div class="form"><div class="fgrid">
      <label class="f">Overall materiality (₹)<input type="number" id="as-om" min="0" value="${esc(st.om||'')}" placeholder="${run&&run.mat?'Auto: '+Math.round(run.mat.om):'Auto'}"></label>

  if(a==='as-save'){ const s={om:num('as-om')||0,limit:num('as-lim')||100000,mS:Number(val('as-ms')||25),mD:Number(val('as-md')||40)}; if(await guard(()=>store.update('engagements',e.id,{settings:s}),'Settings saved')){ AUTO.key=''; closeModal(); render(); } return; }
  if(a==='auto-apply'){ const run=auto(S.eng); if(!run||!run.areas) return;
    const ok=await guard(async()=>{ for(const r of run.areas){ const ar=S.d.areas.find(x=>x.engId===e.id&&x.key===r.key);
      if(ar){ if(r.ran) await store.update('areas',ar.id,{autoL:r.L,autoI:r.I,autoAt:nowIso()}); }
      else if(LIB[r.key]&&r.fail.length){ const na=newArea(e.id,r.key,e.industry); na.autoL=r.L; na.autoI=r.I; na.autoAt=nowIso(); await store.add('areas',na); } } },'Data-driven ratings applied to the audit plan');

  if(a==='auto-draft'){ const run=auto(S.eng); if(!run||!run.results) return;
    const have=new Set(S.d.observations.filter(o=>o.engId===e.id&&o.source).map(o=>o.source));
    const todo=run.results.filter(r=>(r.sev==='High'||r.sev==='Medium')&&!have.has('auto:'+r.id));

    let n=S.d.observations.filter(o=>o.engId===e.id).length;
    const ok=await guard(async()=>{ for(const r of todo){ n++; await store.add('observations',{...obsFromTest(r,e),ref:`${e.code||'IA'}-${String(n).padStart(2,'0')}`,followUps:[],createdAt:nowIso()}); } },todo.length+' draft observations created');

  if(a==='auto-xlsx'){ const run=auto(S.eng); return xlsx(slug(clientOf(e).name)+'-automated-audit.xlsx',[['Area risk',run.areas.map(x=>({Area:x.name,'In scope':x.inScope?'Yes':'No','Inherent':`${x.inherent} (${x.L0}×${x.I0})`,'Data-driven':`${x.rating} (${x.L}×${x.I})`,'Tests run':x.ran,'Tests with exceptions':x.fail.length,'Exposure (₹)':Math.round(x.value),Basis:x.basis}))],['Tests',autoRows(run)]]); }

  /* sampling */
  if(a==='smp-draw'||a==='smp-redraw'){ const k=t.dataset.ds, run=auto(S.eng), rows=run.D[k];

    return openModal('Add process area',`<div class="form"><label class="f">From the library<select id="aa-key">${opts.map(k=>`<option value="${k}">${esc(LIB[k].name)} (${LIB[k].steps.length} steps)</option>`).join('')}<option value="__custom">Custom area…</option></select></label><label class="f">Custom area name (if custom)<input type="text" id="aa-name" placeholder="e.g. CSR spend"></label><div class="actions"><button class="btn" data-act="close">Cancel</button><button class="btn sky" data-act="area-add-save">Add area</button></div></div>`); }

  if(a==='step-add-save'){ const txt=val('st-text'); if(!txt) return toast('Write the test step.'); const ar=S.d.areas.find(x=>x.id===id); const steps=[...(ar.steps||[]),{id:'s'+rid().slice(0,6),text:txt,result:'',sample:'',exceptions:0,wp:'',note:''}];

  if(a==='obs-from-step'){ const row=t.closest('.step'); const ar=S.d.areas.find(x=>x.id===row.dataset.area); const st=ar.steps.find(s=>s.id===row.dataset.step);

  if(a==='fu-save'){ const o=S.d.observations.find(x=>x.id===id); const note=val('fu-note'); if(!note) return toast('Write what was seen in this follow-up.');

    if(await guard(()=>id?store.update('clients',id,d):store.add('clients',{...d,createdAt:nowIso()}),'Client saved')) closeModal(); return; }
  if(a==='set-save'){ const d=firmData(); if(S.live){ await guard(()=>db.doc('config/firm').update(d),'Firm details saved'); } else { Object.assign(S.cfg,d); render(); toast('Saved for this sample session'); } return; }
  if(a==='start-live') return openModal('Start your firm’s workspace',`<p class="muted">Clients, engagements, uploaded data, test results and observations will be saved online on this page, visible to people you share it with. The sample firm stays separate.</p>${firmForm({tagline:'Chartered Accountants'},'live-create')}`);
  if(a==='live-create'){ const d=firmData(); S.pendingLive=true; if(await guard(()=>db.doc('config/firm').set({...d,matrix:{},createdAt:nowIso()}),'Workspace created')){ closeModal(); if(LIVE.cfg){ setView('live'); go('engagements'); } } return; }
  if(a==='go-live'){ setView('live'); return render(); }
  if(a==='go-demo'){ setView('demo'); return render(); }

  /* exports */
  if(a==='xlsx-obs'){ const u=S.ui; const list=S.d.observations.filter(o=>(!u.oEng||o.engId===u.oEng)&&(!u.oRisk||o.risk===u.oRisk)&&(!u.oStat||o.status===u.oStat)); return xlsx('Observations-'+today()+'.xlsx',[['Observations',obsRows(list)]]); }
  if(a==='xlsx-atr'){ const list=S.d.observations.filter(o=>o.status!=='Draft'&&(!S.ui.aEng||o.engId===S.ui.aEng)); const t0=today();
    return xlsx('Action-taken-report-'+t0+'.xlsx',[['ATR',list.map(o=>({...obsRows([o])[0],'Days overdue':isOverdue(o)?daysBetween(o.targetDate,t0):0}))]]); }
  if(a==='xlsx-eng') return xlsx(slug(clientOf(e).name)+'-'+slug(e.code||e.title)+'-workpapers.xlsx',engWorkpapers(e));
  if(a==='doc-report') return saveFile(slug(clientOf(e).name)+'-Internal-Audit-Report.doc',new Blob(['﻿'+wordDoc(e)],{type:'application/msword'}),'application/msword');
});

  if(t.dataset.map!=null&&UP){ UP.map[t.dataset.map]=t.value===''?null:+t.value; for(const k in UP.map) if(k!==t.dataset.map&&UP.map[k]===UP.map[t.dataset.map]&&t.value!=='') UP.map[k]=null; return mapModal(); }

  if(t.id==='f-client'){ const w=$('#newclient-wrap'); if(w) w.hidden=t.value!=='__new'; const c=S.d.clients.find(x=>x.id===t.value); if(c&&c.industry&&$('#f-ind')){ $('#f-ind').value=c.industry; const sc=$('#scope-checks'); if(sc) sc.innerHTML=scopeChecks(c.industry); } return; }
  if(t.id==='f-ind'){ const sc=$('#scope-checks'); if(sc) sc.innerHTML=scopeChecks(t.value); return; }
  if(t.id==='o-eng'){ const e=engById(t.value); const sel=$('#o-area'); if(e&&sel) sel.innerHTML=areasOf(e.id).map(a=>`<option value="${a.key}">${esc(a.name)}</option>`).join(''); return; }
  if(t.dataset.pbc){ const e=engById(S.eng); await guard(()=>store.update('engagements',e.id,{pbc:{[t.dataset.pbc]:{...((e.pbc||{})[t.dataset.pbc]||{}),[t.dataset.f]:t.value}}})); return; }
  if(t.dataset.tbmap!=null){ const e=engById(S.eng); const m=(Array.isArray(e.tbMap)?e.tbMap:[]).map(x=>Array.isArray(x)?{a:x[0],h:x[1]}:x).filter(x=>x.a!==t.dataset.tbmap); m.push({a:t.dataset.tbmap,h:t.value}); AUTO.key=''; await guard(()=>store.update('engagements',e.id,{tbMap:m}),'Ledger regrouped'); return; }
  if(t.dataset.vrm){ const tr=t.closest('[data-vouch]'), s=S.d.samples.find(x=>x.id===tr.dataset.vouch), i=+tr.dataset.i; const items=s.items.map((x,j)=>j===i?{...x,rm:t.value.trim()}:x); if(!S.live){ s.items=items; return; } await guard(()=>store.update('samples',s.id,{items})); return; }
  const k=t.dataset.ch;
  if(k==='eng'){ S.eng=t.value; S.area=''; LS.set('eng',t.value); return render(); }
  if(k==='showAllDs'){ S.ui.showAllDs=t.checked; return render(); }
  if(k&&k!=='q'){ S.ui[k]=t.value; return render(); }
  const sf=t.dataset.sf; if(sf){ const row=t.closest('.step'); const v=sf==='sample'||sf==='exceptions'?(t.value===''?'':Number(t.value)):t.value.trim(); await saveStep(row.dataset.area,row.dataset.step,{[sf]:v}); }
});
let qT=null;
document.addEventListener('input',ev=>{ if(ev.target.dataset.ch==='q'){ S.ui.q=ev.target.value; clearTimeout(qT); qT=setTimeout(()=>{ const pos=ev.target.selectionStart; render(); const q=$('#q'); if(q){ q.focus(); try{ q.setSelectionRange(pos,pos); }catch{} } },250); } });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&!$('#modal').hidden) closeModal(); });

init();
setTimeout(()=>{ if(!S.ready){ setView('demo'); S.ready=true; render(); } },11000);
</script>
