<title>CFO Portal Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* Layout: private-office command desk — a white rail of sections on the left, a calm light working area on the right; navy carries the text, gold marks only what a CFO must look at. */
/* Light, single-theme on purpose: a private-bank report look — white paper, deep navy ink, one restrained gold accent. */
:root {
  --bg: #F3F5F8; --bg2: #EAEEF3; --surface: #FFFFFF; --raise: #F7F8FA; --line: #E1E6ED; --line2: #CDD5E0;
  --fg: #0F1B2D; --muted: #5A6577; --faint: #8A93A3; --navy: #12305A; --navy2: #1D4478;
  --gold: #A07A33; --gold2: #B88F42; --gold-ink: #FFFFFF; --gold-soft: rgba(160, 122, 51, .09);
  --side: #FFFFFF; --side-fg: #12305A; --side-muted: #7A8597; --side-line: #E1E6ED;
  --focus: #1D4478; --input: #FFF9EC; --input-ink: #6A4E17;
  --good: #1B7F52; --good-bg: #E7F5EE; --warn: #A86512; --warn-bg: #FDF2E2; --bad: #B23A32; --bad-bg: #FBEAE8;
  --s1: #12305A; --s2: #A07A33; --s3: #C9D2DE;
  --shadow: 0 1px 2px rgba(15, 27, 45, .04), 0 10px 28px -18px rgba(15, 27, 45, .22);
  --f-display: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --f-body: "Manrope", "Segoe UI", system-ui, Arial, sans-serif;
  --f-num: "Manrope", "Segoe UI", system-ui, Arial, sans-serif;
  --f-code: "IBM Plex Mono", Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.5; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; background: linear-gradient(90deg, var(--side) 0 252px, transparent 252px); }
#view { display: grid; gap: 20px; align-content: start; }
#view > * { min-width: 0; }
.ref { display: block; font-size: 11.5px; color: var(--muted); }
.ref.neg { color: var(--bad); font-weight: 600; }
.scroll table td:first-child, .scroll table th:first-child { min-width: 180px; }
.mail-row td:first-child, .board table td:first-child { min-width: 0; }
table.trend td:first-child { min-width: 260px; }
.mail-row .actions button, .mail-row .actions a { white-space: nowrap; }
.app > * { min-width: 0; }

/* ---------- side rail */
.rail { background: var(--side); color: var(--side-fg); position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 18px;
  padding-block: 22px 18px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: 18px; border-right: 1px solid var(--side-line); }
.brand { display: flex; gap: 12px; align-items: center; }
.mono-mark { width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--gold); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .08em; color: #FFFFFF; flex: none; background: var(--navy); box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 4px var(--gold); }
.brand b { display: block; font-family: var(--f-display); font-size: 21px; font-weight: 600; letter-spacing: .01em; line-height: 1.1; color: var(--side-fg); }
.brand span { font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.rail label { color: var(--side-muted); }
.rail select { background: var(--raise); color: var(--fg); border-color: var(--line2); }
.nav { display: grid; gap: 14px; }
.nav-grp { display: grid; gap: 2px; }
.nav-grp > span { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--side-muted); padding: 0 10px 4px; }
.tab { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 8px; color: var(--side-fg); font-size: 13.5px; opacity: .78; border-left: 2px solid transparent; }
.tab:hover { opacity: 1; background: var(--raise); }
.tab[aria-selected="true"] { opacity: 1; background: linear-gradient(90deg, #EEF2F8, rgba(238, 242, 248, 0)); border-left-color: var(--gold); color: var(--navy); font-weight: 700; }
.tab:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.tab .cnt { font-size: 10.5px; font-weight: 700; min-width: 20px; text-align: center; padding: 1px 6px; border-radius: 999px; background: var(--bad-bg); color: var(--bad); }
.tab .cnt.w { background: var(--warn-bg); color: var(--warn); }
.rail-foot { margin-top: auto; display: grid; gap: 8px; font-size: 12px; color: var(--side-muted); }
.rail-foot button { background: var(--surface); color: var(--navy); border-color: var(--line2); }
.save-state { display: flex; align-items: center; gap: 7px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--side-muted); }
.dot.ok { background: var(--good); } .dot.warn { background: var(--warn); }

/* ---------- main */
.main { padding-block: 26px 56px; padding-right: max(28px, env(safe-area-inset-right, 0px)); padding-left: 28px; display: grid; gap: 20px; align-content: start; }
.main > * { min-width: 0; }
.topbar { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between; }
.eyebrow { font-size: 10.5px; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(30px, 3.2vw, 40px); line-height: 1.05; margin: 4px 0 0; letter-spacing: .005em; color: var(--navy); text-wrap: balance; }
h2, h3 { font-family: var(--f-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: .01em; color: var(--navy); }
h2 { font-size: 21px; } h3 { font-size: 18px; }
.sub { color: var(--muted); font-size: 13px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums lining-nums; text-align: right; white-space: nowrap; }
.mono { font-family: var(--f-code); font-size: 12px; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.pos { color: var(--good); } .neg { color: var(--bad); }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border-radius: 8px; border: 1px solid var(--line2); background: var(--surface); padding: 7px 13px; font-weight: 500; }
button:hover { border-color: var(--gold); }
button.primary { background: var(--navy); color: #FFFFFF; border-color: var(--navy); font-weight: 700; letter-spacing: .01em; }
button.primary:hover { background: var(--navy2); border-color: var(--navy2); }
button.primary:hover { filter: brightness(1.05); }
button.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
button.link { border: 0; background: none; padding: 0; color: var(--navy2); text-decoration: underline; text-decoration-color: var(--gold-soft); text-underline-offset: 3px; text-align: left; font-weight: 500; }
button.sm { padding: 4px 10px; font-size: 12px; }
button.chipbtn { border-radius: 999px; padding: 5px 12px; font-size: 12.5px; background: var(--raise); }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, tr[tabindex]:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
input, select, textarea { background: var(--raise); border: 1px solid var(--line2); border-radius: 8px; padding: 7px 10px; width: 100%; min-width: 0; }
input[type="checkbox"] { width: auto; accent-color: var(--gold); }
input[type="range"] { accent-color: var(--gold); padding: 0; border: 0; background: none; width: 100%; }
label { display: grid; gap: 5px; font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
label.check { display: flex; align-items: center; gap: 8px; color: var(--fg); font-size: 13px; text-transform: none; letter-spacing: 0; font-weight: 500; }
a { color: var(--navy2); }
a.btn { display: inline-flex; align-items: center; border-radius: 8px; border: 1px solid var(--line2); padding: 4px 10px; font-size: 12px; color: var(--fg); text-decoration: none; background: var(--surface); }
a.btn:hover { border-color: var(--gold); }
td input.cell { font-family: var(--f-num); font-variant-numeric: tabular-nums; text-align: right; background: var(--input); color: var(--input-ink); padding: 3px 7px; min-width: 66px; border-radius: 6px; border-color: transparent; }
td input.cell:hover { border-color: var(--line2); }
td input.cell.txt { text-align: left; font-family: var(--f-body); background: var(--raise); color: var(--fg); min-width: 110px; }
td select.cell { padding: 3px 7px; font-size: 12.5px; min-width: 100px; }
.banner { background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 12px; padding: 11px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; font-size: 13px; }
.banner strong { color: var(--navy); font-weight: 700; }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; align-items: end; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
div.tot { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px 15px; display: grid; gap: 5px; align-content: start; box-shadow: var(--shadow); overflow: hidden; }
div.tot::before { content: ""; position: absolute; inset: 0 0 auto; height: 2px; background: linear-gradient(90deg, var(--gold), transparent 70%); opacity: .8; }
div.tot .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .16em; color: var(--muted); font-weight: 600; }
div.tot .v { font-family: var(--f-num); font-variant-numeric: tabular-nums lining-nums; font-size: 30px; font-weight: 300; letter-spacing: -.01em; line-height: 1.1; }
div.tot .n { font-size: 12px; color: var(--muted); }
div.tot.lead .v { color: var(--navy); }
div.tot.bad .v { color: var(--bad); } div.tot.warn .v { color: var(--warn); } div.tot.good .v { color: var(--good); }
div.tot.bad::before { background: linear-gradient(90deg, var(--bad), transparent 70%); } div.tot.good::before { background: linear-gradient(90deg, var(--good), transparent 70%); } div.tot.warn::before { background: linear-gradient(90deg, var(--warn), transparent 70%); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 11.5px; font-weight: 700; letter-spacing: .02em; border: 1px solid transparent; white-space: nowrap; }
.pill.ok { background: var(--good-bg); color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.pill.bad { background: var(--bad-bg); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.pill.warn { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.pill.idle { background: var(--raise); color: var(--muted); border-color: var(--line2); }
.pill.gold { background: var(--gold-soft); color: var(--gold2); border-color: color-mix(in srgb, var(--gold) 55%, transparent); }
.pill.gold { color: var(--gold); }
.chip { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--raise); color: var(--muted); white-space: nowrap; border: 1px solid var(--line); }
.chip.teal, .chip.f { color: var(--s2); background: color-mix(in srgb, var(--s2) 12%, transparent); border-color: transparent; }
.chip.warn { color: var(--warn); background: var(--warn-bg); border-color: transparent; }
.chip.bad { color: var(--bad); background: var(--bad-bg); border-color: transparent; }
.chip.a { color: var(--muted); }
.chip.gold { color: var(--gold2); background: var(--gold-soft); border-color: transparent; }
.chip.gold { color: var(--gold); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; min-width: 0; box-shadow: var(--shadow); }
.panel-head { padding: 16px 18px 10px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.panel-head .sub { color: var(--muted); font-size: 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 18px 12px; align-items: end; }
.filters label { min-width: 150px; flex: 0 1 210px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 11px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; background: #F5F7FA; white-space: nowrap; border-bottom: 1px solid var(--line2); }
th.num { text-align: right; }
td .ref { display: block; font-size: 11.5px; color: var(--muted); }
tbody tr[tabindex] { cursor: pointer; }
tbody tr[tabindex]:hover td { background: #F3F6FA; }
tr.tot td { font-weight: 700; border-top: 1px solid var(--gold); }
tr.sub td { font-weight: 700; background: color-mix(in srgb, var(--raise) 80%, transparent); }
tr.grp td { font-family: var(--f-display); font-size: 15px; font-weight: 600; color: var(--navy); padding-top: 14px; border-bottom-color: var(--line2); }
td.fc, th.fc { background: color-mix(in srgb, var(--s2) 6%, transparent); }
.empty { padding: 34px 18px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.note { padding: 10px 18px 16px; color: var(--muted); font-size: 12px; max-width: 110ch; }
.note p { margin: 0 0 6px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(400px, 100%), 1fr)); gap: 20px; align-items: start; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 20px; align-items: start; }
.grid-2 > *, .grid-3 > * { min-width: 0; }
.pad { padding: 4px 18px 18px; display: grid; gap: 12px; }
.todo { list-style: none; margin: 0; padding: 0 18px 14px; display: grid; }
.todo li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.todo li:last-child { border-bottom: 0; }
.sev { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--muted); box-shadow: 0 0 0 4px color-mix(in srgb, var(--muted) 15%, transparent); }
.sev.bad { background: var(--bad); box-shadow: 0 0 0 4px var(--bad-bg); } .sev.warn { background: var(--warn); box-shadow: 0 0 0 4px var(--warn-bg); } .sev.ok { background: var(--good); box-shadow: 0 0 0 4px var(--good-bg); }
.kv { display: grid; grid-template-columns: 1fr auto; }
.kv div { padding: 9px 18px; border-bottom: 1px solid var(--line); }
.kv .strong { font-weight: 700; }
.kv .num { text-align: right; }
.form-inline { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(175px, 100%), 1fr)); gap: 12px; padding: 4px 18px 16px; align-items: end; }
.lever { display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 2px 10px; align-items: center; }
.lever label { text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--fg); font-weight: 500; }
.lever output { font-variant-numeric: tabular-nums; text-align: right; font-size: 13px; color: var(--navy); font-weight: 700; }
.lever input[type=range] { grid-column: 1 / -1; }
.bar { height: 6px; background: var(--raise); border-radius: 4px; overflow: hidden; min-width: 60px; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--navy), var(--navy2)); }
svg.chart text { fill: var(--muted); font-family: var(--f-body); font-size: 10px; }
svg.chart text.ink { fill: var(--fg); font-weight: 600; }
.ask { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 0 18px 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 12px; }
.answer { margin: 0 18px 16px; padding: 14px 16px; border-radius: 12px; background: var(--raise); border: 1px solid var(--line); border-left: 2px solid var(--gold); font-size: 13.5px; white-space: pre-wrap; max-width: 100ch; }
.answer b { color: var(--navy); font-weight: 700; }
.page { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; background: var(--raise); display: grid; gap: 10px; }
.page h3 { color: var(--fg); }
.page .pno { font-size: 10.5px; color: var(--gold); letter-spacing: .2em; text-transform: uppercase; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); padding: 0 18px 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* ---------- mail desk and work board */
.mail-row td { vertical-align: middle; }
.mail-subj { font-weight: 600; }
.mail-snip { color: var(--muted); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 62ch; }
.why { font-size: 11px; color: var(--faint); }
.board { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); gap: 14px; padding: 0 18px 18px; overflow-x: auto; }
.col { background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 120px; }
.col > h3 { font-size: 15px; display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; cursor: pointer; text-align: left; font: inherit; color: inherit; }
.card:hover { border-color: var(--gold); }
.card .t { font-weight: 600; font-size: 13px; }
.card .m { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11.5px; color: var(--muted); }

/* ---------- boardroom */
.stage-wrap { display: grid; gap: 12px; }
.stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; border: 1px solid var(--line2); background: #FFFFFF; color: var(--fg); box-shadow: 0 24px 50px -30px rgba(15, 27, 45, .35); }
.stage::before { content: ""; position: absolute; inset: 0 0 auto; height: 6px; background: linear-gradient(90deg, var(--navy) 0 72%, var(--gold) 72% 100%); }
.stage:fullscreen { border-radius: 0; border: 0; }
.slide { position: absolute; inset: 0; padding: 3.6% 4% 5.2%; display: grid; grid-template-rows: auto 1fr; gap: 2.2%; }
.slide .s-eye { font-size: clamp(9px, 1.05vw, 13px); letter-spacing: .24em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.slide .s-title { font-family: var(--f-display); font-size: clamp(18px, 2.9vw, 40px); font-weight: 600; line-height: 1.05; margin-top: .3em; color: var(--navy); }
.slide .s-body { min-height: 0; display: grid; gap: 2.4%; align-content: start; }
.slide .s-foot { position: absolute; left: 4%; right: 4%; bottom: 2.2%; display: flex; justify-content: space-between; font-size: clamp(8px, .85vw, 11px); color: var(--faint); letter-spacing: .08em; border-top: 1px solid var(--line); padding-top: .6em; }
.s-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.4em 2.2%; align-items: start; margin-top: 1%; }
.s-kpi .v { margin: .15em 0 .1em; }
.s-kpi { border: 1px solid var(--line); border-top: 3px solid var(--navy); border-radius: 10px; padding: 1.4em 1.6em; background: #FAFBFC; display: grid; gap: .3em; align-content: start; }
.s-kpi .k { font-size: clamp(8px, .9vw, 12px); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.s-kpi .v { font-size: clamp(16px, 2.6vw, 36px); font-weight: 300; font-variant-numeric: tabular-nums; color: var(--navy); line-height: 1.1; }
.s-kpi .n { font-size: clamp(8px, .95vw, 13px); color: var(--muted); }
.s-kpi .n b { font-weight: 700; }
.s-kpi.g { border-top-color: var(--good); } .s-kpi.r { border-top-color: var(--bad); } .s-kpi.a { border-top-color: var(--warn); }
.s-kpi.g .n b { color: var(--good); } .s-kpi.r .n b { color: var(--bad); } .s-kpi.a .n b { color: var(--warn); }
.s-two { display: grid; grid-template-columns: 1.35fr 1fr; gap: 3%; min-height: 0; align-items: start; }

const budOf = (co, id) => co.buds.find(b => b.id === id) || null;

// ================================================================ industry revenue engines
const ENGINES = {

    fields: [['cap', 'Installed capacity (units a month)', 1], ['util', 'Utilisation %', .1], ['utilStep', 'Utilisation change each month (points)', .1], ['price', 'Average realisation per unit (₹)', 1], ['priceStep', 'Price change each month %', .1]],
    run: (e, i) => e.cap * Math.min(100, e.util + e.utilStep * i) / 100 * e.price * Math.pow(1 + e.priceStep / 100, i) / 1e5 },
  trade: { name: 'Trading / retail', what: 'Stores or outlets × sales per store, with new openings',
    fields: [['stores', 'Stores open now', 1], ['newPer', 'New stores each month', .1], ['perStore', 'Sales per store a month (₹ lakh)', .1], ['lfl', 'Same-store growth each month %', .1]],
    run: (e, i) => (e.stores + e.newPer * (i + 1)) * e.perStore * Math.pow(1 + e.lfl / 100, i + 1) },
  saas: { name: 'Software / SaaS', what: 'Customers after churn × average revenue per customer',
    fields: [['cust', 'Paying customers now', 1], ['newPer', 'New customers each month', 1], ['churn', 'Monthly churn %', .1], ['arpu', 'Revenue per customer a month (₹)', 1]],
    run: (e, i) => { let c = e.cust; for (let j = 0; j <= i; j++) c = c * (1 - e.churn / 100) + e.newPer; return c * e.arpu / 1e5; } },
  svc: { name: 'Professional services', what: 'Billable people × hours × utilisation × billing rate',

    run: (e, i) => (e.heads + e.hire * (i + 1)) * e.hours * e.util / 100 * e.rate / 1e5 },
  gen: { name: 'Generic growth', what: 'Last three months average grown at a monthly rate',

function engineSeries(co, fut) {

// ================================================================ forecast and outlook
function closedMonths(co) { const s = co.settings; return months(s.Y).filter(m => m <= s.closed && co.act[m]); }
function forecastBase(co, opt = {}) {
  const s = co.settings, ms = months(s.Y), closed = closedMonths(co), fut = ms.filter(m => !closed.includes(m));
  const B = activeBud(co), bd = mk => (B && B.d[mk]) || { v: {}, q: {}, p: {} };

  ['dso', 'Receivable days', ' d', -30, 30, 1], ['dio', 'Inventory days', ' d', -30, 30, 1], ['dpo', 'Payable days', ' d', -30, 30, 1]];
function applyScen(co, base, sc) {

const mS = n => !n || Math.abs(n) < .05 ? '₹0' : (n > 0 ? '+' : '−') + '₹' + fmt(Math.abs(n));
function niceScale(lo, hi, n = 4) {
  if (hi === lo) hi = lo + 1;
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag, step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, ticks = []; for (let t = a; t <= b + step / 2; t += step) ticks.push(Math.abs(t) < step / 1e6 ? 0 : t);
  return { lo: a, hi: b, ticks };
}
const pill = (cls, txt, title) => `<span class="pill ${cls}"${title ? ` title="${esc(title)}"` : ''}>${esc(txt)}</span>`;
const vcls = (v, good) => Math.abs(v) < .05 ? '' : (good ? v > 0 : v < 0) ? 'pos' : 'neg';
const BST = { Draft: 'idle', Submitted: 'warn', Approved: 'ok', 'Sent back': 'bad' };

function spark(vals, w = 96, h = 24) {
  const xs = vals.map(x => x.v).filter(v => v != null); if (xs.length < 2) return '';
  const mx = Math.max(...xs), mn = Math.min(...xs), rg = mx - mn || 1, n = vals.length;
  const pts = vals.map((x, i) => x.v == null ? null : `${(i / (n - 1) * (w - 4) + 2).toFixed(1)},${(h - 3 - (x.v - mn) / rg * (h - 6)).toFixed(1)}`).filter(Boolean);
  const last = pts[pts.length - 1].split(',');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts.join(' ')}" fill="none" stroke="var(--s1)" stroke-width="1.4"/><circle cx="${last[0]}" cy="${last[1]}" r="2.4" fill="var(--s2)"/></svg>`;
}
function waterfall(steps, W = 640, H = 250) {
  let run = 0; const lv = steps.map(s => { if (s[2]) { run = s[1]; return [0, s[1]]; } const a = run; run += s[1]; return [a, run]; });
  const all = lv.flat(), NS = niceScale(Math.min(0, ...all), Math.max(...all, 0) * 1.08), mx = NS.hi, mn = NS.lo, pl = 56, pb = 40, pt = 18, y = v => pt + (mx - v) / (mx - mn) * (H - pt - pb), bw = (W - pl - 8) / steps.length;
  let s = '';
  NS.ticks.forEach(v => { s += `<line x1="${pl}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(v) + 3}" text-anchor="end">${fmt(v) === '–' ? '0' : fmt(v)}</text>`; });
  steps.forEach((st, i) => {
    const [a, b] = lv[i], x = pl + i * bw + bw * .14, top = y(Math.max(a, b)), h = Math.max(1.5, Math.abs(y(a) - y(b)));
    const col = st[2] ? 'var(--s1)' : st[1] >= 0 ? 'var(--good)' : 'var(--bad)';
    s += `<rect x="${x}" y="${top}" width="${bw * .72}" height="${h}" rx="2" fill="${col}"/><text class="ink" x="${x + bw * .36}" y="${top - 5}" text-anchor="middle">${st[2] ? fmt(st[1]) : fmtS(st[1])}</text>`;
    const words = st[0].split(' '), l1 = words.slice(0, Math.ceil(words.length / 2)).join(' '), l2 = words.slice(Math.ceil(words.length / 2)).join(' ');
    s += `<text x="${x + bw * .36}" y="${H - 22}" text-anchor="middle">${esc(l1)}</text><text x="${x + bw * .36}" y="${H - 10}" text-anchor="middle">${esc(l2)}</text>`;
    if (i < steps.length - 1) { const nx = pl + (i + 1) * bw + bw * .14; s += `<line x1="${x + bw * .72}" x2="${nx}" y1="${y(b)}" y2="${y(b)}" stroke="var(--muted)" stroke-dasharray="2 2"/>`; }
  });
  return `<div class="scroll"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px" role="img" aria-label="Bridge chart">${s}</svg></div>`;

function barChart(vals, labels, opt = {}) {
  const W = opt.W || 900, H = opt.H || 220, pl = 56, pb = 26, pt = 14, all = [...vals, ...(opt.line != null ? [opt.line] : []), ...(opt.vals2 || []).filter(v => v != null), 0];

    s += `<text x="${pl + i * bw + bw / 2}" y="${H - 9}" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  if (opt.line != null) s += `<line x1="${pl}" x2="${W - 10}" y1="${y(opt.line)}" y2="${y(opt.line)}" stroke="var(--warn)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W - 10}" y="${y(opt.line) - 4}" text-anchor="end" style="fill:var(--warn)">${esc(opt.lineLabel || '')}</text>`;

        <div>Receivable / inventory / payable days</div><div class="num">${D.s.dso} / ${D.s.dio} / ${D.s.dpo}</div>
        <div>Cash conversion cycle</div><div class="num">${(+D.s.dso) + (+D.s.dio) - (+D.s.dpo)} days</div>
        <div>Lowest cash in the next 13 weeks</div><div class="num ${D.C13.lo < D.C13.min ? 'neg' : ''}">₹${fmt(D.C13.lo)}</div>

      </div></section></div>`;
}

// ================================================================ Budget

  const BP = mk => monthPl(co, sel.d[mk]), fy = addPl(co, ms.map(BP));

  const acts = [];
  if (edit) acts.push(`<button type="button" class="primary" data-act="bud-submit">Submit for approval</button>`);
  if (sel.status === 'Submitted') acts.push(`<button type="button" class="primary" data-act="bud-approve">Approve</button><button type="button" data-act="bud-sendback">Send back</button>`);
  if (sel.status === 'Approved' && sel.id !== s.activeBud) acts.push(`<button type="button" class="primary" data-act="bud-activate">Use for variance</button>`);
  acts.push(`<button type="button" data-act="bud-copy">New version from this</button><button type="button" data-act="bud-from-fc">New version from the outlook</button>`);
  if (edit && co.buds.length > 1) acts.push(`<button type="button" class="danger" data-act="bud-del">Delete draft</button>`);
  const t = sel.target || {}, gapR = fy.rev - (+t.rev || 0), gapE = fy.ebitda - (+t.ebitda || 0);

  let body = '';
  if (view === 'qp') {
    co.lines.filter(L => L.prod && (!cc || L.cc === cc)).forEach(L => {
      ['q', 'p'].forEach(f => { body += `<tr><td>${esc(L.name)}<span class="ref">${f === 'q' ? 'Quantity (' + esc(L.unit || 'units') + ')' : 'Price per ' + esc((L.unit || 'unit').replace(/s$/, '')) + ' (₹)'}</span></td>${ms.map(m => { const v = +((sel.d[m] || {})[f] || {})[L.k] || 0;
        return `<td class="num">${edit ? `<input class="cell" id="bq-${f}-${L.k}-${m}" data-bud="${f}" data-k="${L.k}" data-m="${m}" value="${Math.round(v)}" inputmode="decimal">` : qfmt(v)}</td>`; }).join('')}<td class="num">${f === 'q' ? qfmt(sum(ms, m => ((sel.d[m] || {}).q || {})[L.k])) : rs(fy.vals[L.k] * 1e5 / (sum(ms, m => ((sel.d[m] || {}).q || {})[L.k]) || 1))}</td></tr>`; });
    });
  } else {
    ['rev', 'cogs', 'opex', 'below'].forEach(g => {
      const gl = lines.filter(L => L.grp === g); if (!gl.length) return;
      body += `<tr class="grp"><td colspan="${ms.length + 2}">${GRP[g]}</td></tr>`;
      gl.forEach(L => { body += `<tr><td>${esc(L.name)}<span class="ref">${esc(L.cc || '')}${L.prod ? ' · from quantity × price' : L.beh === 'var' ? ' · variable' : ' · fixed'}</span></td>${ms.map(m => { const v = cellVal(sel.d[m], L);
        return `<td class="num">${edit && !L.prod ? `<input class="cell" id="bv-${L.k}-${m}" data-bud="v" data-k="${L.k}" data-m="${m}" value="${r1(v)}" inputmode="decimal">` : fmt(v)}</td>`; }).join('')}<td class="num"><strong>${fmt(fy.vals[L.k])}</strong></td></tr>`; });
      if (!cc) { const key = { rev: 'rev', cogs: 'gross', opex: 'ebitda', below: 'pat' }[g], nm = { rev: 'Total revenue', cogs: 'Gross margin', opex: 'EBITDA', below: 'Profit after tax' }[g];
        body += `<tr class="sub"><td>${nm}</td>${ms.map(m => `<td class="num">${fmt(BP(m)[key])}</td>`).join('')}<td class="num">${fmt(fy[key])}</td></tr>`; }
    });
    if (cc) body += `<tr class="tot"><td>${esc(cc)} total</td>${ms.map(m => `<td class="num">${fmt(sum(lines, L => cellVal(sel.d[m], L)))}</td>`).join('')}<td class="num">${fmt(sum(lines, L => fy.vals[L.k]))}</td></tr>`;
  }
  const log = (sel.log || []).slice().reverse().map(l => `<tr><td class="mono">${fdate(l.on)}</td><td>${esc(l.by || '—')}</td><td>${pill(l.act === 'Approved' ? 'ok' : l.act === 'Sent back' ? 'bad' : l.act === 'Submitted' ? 'warn' : 'idle', l.act)}</td><td class="small">${esc(l.note || '')}</td></tr>`).join('');
  return `<section class="panel"><div class="panel-head"><h2>Budget versions · ${fyLabel(s.Y)}</h2><div class="actions"><span class="sub">Select a version to open it</span><button type="button" class="sm primary" data-act="bud-new">New blank version</button></div></div>
      <div class="scroll"><table><thead><tr><th>Version</th><th>Status</th><th>Prepared</th><th>Approved</th><th class="num">Revenue</th><th class="num">EBITDA</th><th class="num">Margin</th></tr></thead><tbody>${list}</tbody></table></div>
      <p class="note">Flow: Draft → Submitted → Approved, or Sent back with a reason. The person who submits cannot approve the same version (maker-checker); change "Working as" at the top to act as the approver. Only an approved version can be used for variance, and approved versions are locked — make a new version to change them.</p></section>
    <div class="grid-2">
    <section class="panel"><div class="panel-head"><h2>${esc(sel.name)}</h2>${pill(BST[sel.status] || 'idle', sel.status)}</div><div class="pad"><div class="actions">${acts.join('')}</div>
      ${edit ? `<div class="form-inline" style="padding:0"><label for="bud-name">Version name<input id="bud-name" data-budf="name" value="${esc(sel.name)}"></label></div>` : ''}</div></section>
    <section class="panel"><div class="panel-head"><h2>Top-down target against bottom-up budget</h2><span class="sub">${unitLbl()}</span></div>
      <div class="scroll"><table><thead><tr><th></th><th class="num">Target</th><th class="num">Bottom-up</th><th class="num">Gap</th></tr></thead><tbody>
        <tr><td>Revenue</td><td class="num">${edit ? `<input class="cell" id="bt-rev" data-target="rev" value="${+t.rev || 0}">` : fmt(+t.rev)}</td><td class="num">${fmt(fy.rev)}</td><td class="num ${vcls(gapR, true)}">${fmtS(gapR)}</td></tr>
        <tr><td>EBITDA</td><td class="num">${edit ? `<input class="cell" id="bt-ebitda" data-target="ebitda" value="${+t.ebitda || 0}">` : fmt(+t.ebitda)}</td><td class="num">${fmt(fy.ebitda)}</td><td class="num ${vcls(gapE, true)}">${fmtS(gapE)}</td></tr>
      </tbody></table></div><p class="note">${gapE < -0.5 ? `Department budgets add up to ₹${fmt(-gapE)} less EBITDA than the target the board set. Close the gap or agree a lower target before approval.` : 'Department budgets meet the target.'}</p></section></div>
    <section class="panel"><div class="panel-head"><h2>${view === 'qp' ? 'Volumes and prices' : 'Department budgets'}</h2><span class="sub">${edit ? 'Yellow cells can be edited' : 'Locked — ' + sel.status.toLowerCase()} · ${view === 'qp' ? 'quantity and ₹ per unit' : unitLbl()}</span></div>
      <div class="filters">
        <label for="bud-view">Show<select id="bud-view" data-ui="budView"><option value="values"${view === 'values' ? ' selected' : ''}>Amounts by line</option><option value="qp"${view === 'qp' ? ' selected' : ''}>Volumes and prices (revenue)</option></select></label>
        <label for="bud-cc">Cost centre / department<select id="bud-cc" data-ui="budCc"><option value="">All departments</option>${co.ccs.map(c => `<option${cc === c ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
      </div>
      <div class="scroll"><table>${head}<tbody>${body}</tbody></table></div>
      ${edit ? `<div class="form-inline"><label for="sp-line">Spread a yearly amount — line<select id="sp-line">${co.lines.filter(L => !L.prod).map(L => `<option value="${L.k}">${esc(L.name)}</option>`).join('')}</select></label>
        <label for="sp-amt">Amount for the year (₹ lakh)<input id="sp-amt" type="number" min="0" step="1"></label>
        <label for="sp-how">Spread<select id="sp-how"><option value="ly">Like last year's months</option><option value="even">Evenly</option><option value="rev">Like budgeted sales</option></select></label>
        <button type="button" data-act="bud-spread">Spread</button></div>` : ''}</section>
    <section class="panel"><div class="panel-head"><h2>Approval log</h2></div><div class="scroll"><table><thead><tr><th>Date</th><th>By</th><th>Action</th><th>Note</th></tr></thead><tbody>${log}</tbody></table></div></section>`;
}

// ================================================================ Rolling forecast
function vFcst() {
  const co = cur, OL = R.OL, ms = OL.ms, B = R.B, meth = co.fc.meth || {}, ov = co.fc.ov || {};
  const bud = R.bud, BF = R.budFy;
  const head = `<tr><th>Line</th><th>Method</th>${ms.map(m => `<th class="num${OL.closed.includes(m) ? '' : ' fc'}">${smonth(m)}<br><span class="chip ${OL.closed.includes(m) ? 'a' : 'f'}">${OL.closed.includes(m) ? 'Actual' : 'Forecast'}</span></th>`).join('')}<th class="num">Outlook</th><th class="num">Budget</th><th class="num">Difference</th></tr>`;
  let body = '';
  const M = [['auto', 'Auto'], ['budget', 'Budget'], ['runrate', 'Last 3 months']];
  ['rev', 'cogs', 'opex', 'below'].forEach(g => {
    body += `<tr class="grp"><td colspan="${ms.length + 5}">${GRP[g]}</td></tr>`;
    co.lines.filter(L => L.grp === g).forEach(L => {
      body += `<tr><td>${esc(L.name)}</td><td><select class="cell" id="fm-${L.k}" data-meth="${L.k}" aria-label="Method for ${esc(L.name)}">${M.map(([v, t]) => `<option value="${v}"${(meth[L.k] || 'auto') === v ? ' selected' : ''}>${t}</option>`).join('')}</select></td>
        ${ms.map(m => { const v = OL.rows[m].vals[L.k]; if (OL.closed.includes(m)) return `<td class="num">${fmt(v)}</td>`; const man = ov[m] && ov[m][L.k] != null && ov[m][L.k] !== '';
          return `<td class="num fc"><input class="cell" id="fo-${L.k}-${m}" data-ov="${L.k}" data-m="${m}" value="${r1(v)}" title="${man ? 'Typed by hand — clear to go back to the method' : 'Worked out by the method; type to override'}"${man ? ' style="font-weight:600;outline:1px solid var(--warn)"' : ''}></td>`; }).join('')}
        <td class="num"><strong>${fmt(OL.fy.vals[L.k])}</strong></td><td class="num">${fmt(BF.vals[L.k])}</td><td class="num ${vcls(OL.fy.vals[L.k] - BF.vals[L.k], !isCost(L))}">${fmtS(OL.fy.vals[L.k] - BF.vals[L.k])}</td></tr>`;
    });
    const key = { rev: 'rev', cogs: 'gross', opex: 'ebitda', below: 'pat' }[g], nm = { rev: 'Total revenue', cogs: 'Gross margin', opex: 'EBITDA', below: 'Profit after tax' }[g];
    body += `<tr class="sub"><td>${nm}</td><td></td>${ms.map(m => `<td class="num${OL.closed.includes(m) ? '' : ' fc'}">${fmt(OL.rows[m][key])}</td>`).join('')}<td class="num">${fmt(OL.fy[key])}</td><td class="num">${fmt(BF[key])}</td><td class="num ${vcls(OL.fy[key] - BF[key], true)}">${fmtS(OL.fy[key] - BF[key])}</td></tr>`;
  });
  const snaps = (co.fc.snaps || []).slice().sort((a, b) => a.on < b.on ? 1 : -1).map(x => `<tr><td>${esc(x.name)}</td><td class="mono">${fdate(x.on)}</td><td class="num">${fmt(x.rev)}</td><td class="num">${fmt(x.ebitda)}</td><td class="num">${fmt(x.pat)}</td><td class="num ${vcls(OL.fy.ebitda - x.ebitda, true)}">${fmtS(OL.fy.ebitda - x.ebitda)}</td><td><button type="button" class="sm" data-act="snap-del" data-id="${x.id}">Remove</button></td></tr>`).join('');
  return `<section class="panel"><div class="panel-head"><h2>Rolling forecast · ${fyLabel(R.s.Y)}</h2><div class="actions"><span class="sub">Actuals to ${R.lastClosed ? fmonth(R.lastClosed) : '—'}, forecast after · ${unitLbl()}${co.eng && co.eng.use ? ' · revenue from the industry engine' : ''}</span><button type="button" class="sm" data-act="ov-clear">Clear typed overrides</button></div></div>
      <div class="scroll"><table>${head}<tbody>${body}</tbody></table></div>
      <div class="note"><p><strong>Methods.</strong> Auto — products: budgeted quantity × your year-to-date volume achievement, at the average price of the last three months; variable costs: their share of sales over the last three months × forecast sales; fixed costs: budget × your year-to-date spend against budget. Budget — the approved budget as it is. Last 3 months — the average of the last three closed months. Any forecast cell can be typed over; a typed cell is outlined and stays until you clear it.</p>
      <p>When a month is closed (Month-end close → Mark month closed, or "Actuals closed through" at the top), it moves from forecast to actual and every method re-runs, so the forecast always runs twelve months of this year: actual months plus the rest.</p></div></section>
    <section class="panel"><div class="panel-head"><h2>How the outlook has moved</h2><div class="actions"><input id="snap-name" type="text" placeholder="e.g. After October close" style="width:220px"><button type="button" class="sm primary" data-act="snap-save">Save today's outlook</button></div></div>
      ${snaps ? `<div class="scroll"><table><thead><tr><th>Snapshot</th><th>Saved</th><th class="num">Revenue</th><th class="num">EBITDA</th><th class="num">Profit after tax</th><th class="num">EBITDA now vs then</th><th></th></tr></thead><tbody>
        <tr class="sub"><td>Outlook now</td><td class="mono">${fdate(TODAY)}</td><td class="num">${fmt(OL.fy.rev)}</td><td class="num">${fmt(OL.fy.ebitda)}</td><td class="num">${fmt(OL.fy.pat)}</td><td></td><td></td></tr>${snaps}</tbody></table></div>` : '<div class="empty">Save the outlook after each close to see how the forecast moves month by month.</div>'}</section>`;
}

// ================================================================ Variance (price-volume-mix)
function varCtx() {
  const co = cur, OL = R.OL, p = ui.varP || (R.closed.length ? 'ytd' : 'fy'), cmp = budOf(co, ui.varB) || R.B;
  const bud = mk => (cmp && cmp.d[mk]) || { v: {}, q: {}, p: {} };
  let mks, getA, label, scope;
  if (p === 'fy') { mks = OL.ms; getA = m => OL.closed.includes(m) ? co.act[m] : OL.data[m]; label = `Full-year outlook ${fyLabel(R.s.Y)}`; scope = 'fy'; }
  else if (p === 'ytd') { mks = R.closed; getA = m => co.act[m]; label = `Year to date, ${R.closed.length ? fmonth(R.closed[0]) + ' to ' + fmonth(R.closed[R.closed.length - 1]) : '—'}`; scope = 'ytd'; }
  else { mks = [p]; getA = m => co.act[m]; label = fmonth(p); scope = p; }
  return { p, cmp, mks, getA, bud, label, scope, V: mks.length ? variance(co, mks, getA, bud) : null };
}
function vVar() {
  const co = cur, X = varCtx(), V = X.V;
  const opts = [['ytd', 'Year to date'], ...R.closed.slice().reverse().map(m => [m, fmonth(m)]), ['fy', 'Full-year outlook']];
  const ctl = `<div class="filters"><label for="var-p">Period<select id="var-p" data-ui="varP">${opts.map(([v, t]) => `<option value="${v}"${X.p === v ? ' selected' : ''}>${t}</option>`).join('')}</select></label>
    <label for="var-b">Against<select id="var-b" data-ui="varB">${co.buds.map(b => `<option value="${b.id}"${b === X.cmp ? ' selected' : ''}>${esc(b.name)} (${b.status.toLowerCase()})</option>`).join('')}</select></label></div>`;
  if (!V) return `<section class="panel"><div class="panel-head"><h2>Variance</h2></div>${ctl}<div class="empty">No closed months yet. Import actuals or set "Actuals closed through".</div></section>`;
  const A = V.A, B = V.B, flagged = V.lines.filter(x => x.big);
  const tiles = `<section class="totals">${tile('Revenue against budget', mS(A.rev - B.rev), `${pctS(ratio(A.rev - B.rev, B.rev))} · price ${fmtS(V.P.T.price)} · volume ${fmtS(V.P.T.vol)} · mix ${fmtS(V.P.T.mix)}`, A.rev >= B.rev ? 'good' : 'bad')}
    ${tile('EBITDA against budget', mS(A.ebitda - B.ebitda), `₹${fmt(A.ebitda)} actual · ₹${fmt(B.ebitda)} budget`, A.ebitda >= B.ebitda ? 'good' : 'bad')}
    ${tile('EBITDA margin', pct(A.em), `${bps(A.em - B.em)} against ${pct(B.em)} budget`, A.em >= B.em ? 'good' : 'warn')}
    ${tile('Lines to explain', flagged.length, `beyond ±${Math.round(V.thr * 100)}% · ${flagged.filter(x => !(co.comments || {})[`${X.scope}|${x.L.k}`]).length} without an owner comment`, flagged.length ? 'warn' : 'good')}</section>`;
  const pv = V.P.rows.map(r => `<tr><td>${esc(r.L.name)}<span class="ref">${esc(r.L.unit || '')}</span></td><td class="num">${qfmt(r.qb)}</td><td class="num">${rs(r.pb)}</td><td class="num">${fmt(r.rb)}</td><td class="num">${qfmt(r.qa)}</td><td class="num">${rs(r.pa)}</td><td class="num">${fmt(r.ra)}</td>
    <td class="num ${vcls(r.price, true)}">${fmtS(r.price)}</td><td class="num ${vcls(r.vol, true)}">${fmtS(r.vol)}</td><td class="num ${vcls(r.mix, true)}">${fmtS(r.mix)}</td><td class="num ${vcls(r.tot, true)}"><strong>${fmtS(r.tot)}</strong></td></tr>`).join('');
  let lt = '';
  ['rev', 'cogs', 'opex', 'below'].forEach(g => {
    lt += `<tr class="grp"><td colspan="10">${GRP[g]}</td></tr>`;
    V.lines.filter(x => x.L.grp === g).forEach(x => { const cm = (co.comments || {})[`${X.scope}|${x.L.k}`];
      lt += `<tr><td>${esc(x.L.name)}<span class="ref">${esc(x.L.cc || '')}</span></td><td class="num">${fmt(x.b)}</td><td class="num">${fmt(x.a)}</td><td class="num ${vcls(x.fav, true)}">${fmtS(x.v)}</td><td class="num ${vcls(x.fav, true)}">${pctS(x.vp)}</td>
        <td class="num">${isCost(x.L) && x.L.beh === 'var' && g !== 'below' ? fmtS(x.volEff) : '–'}</td><td class="num">${isCost(x.L) ? fmtS(x.rateEff) : '–'}</td>
        <td>${!x.big ? pill('ok', 'In range') : x.fav >= 0 ? pill('warn', 'Favourable') : pill('bad', 'Adverse')}</td>
        <td class="small">${cm ? `<strong>${esc(cm.owner || '')}</strong>: ${esc(cm.text)}${cm.action ? `<span class="ref">Action: ${esc(cm.action)}</span>` : ''}` : x.big ? '<span class="muted">Needs comment</span>' : ''}</td><td><button type="button" class="sm" data-act="comment" data-k="${x.L.k}" data-scope="${X.scope}">${cm ? 'Edit' : 'Comment'}</button></td></tr>`; });
    const key = { rev: 'rev', cogs: 'gross', opex: 'ebitda', below: 'pat' }[g], nm = { rev: 'Total revenue', cogs: 'Gross margin', opex: 'EBITDA', below: 'Profit after tax' }[g];
    lt += `<tr class="sub"><td>${nm}</td><td class="num">${fmt(B[key])}</td><td class="num">${fmt(A[key])}</td><td class="num ${vcls(A[key] - B[key], true)}">${fmtS(A[key] - B[key])}</td><td class="num">${pctS(ratio(A[key] - B[key], B[key]))}</td><td colspan="5"></td></tr>`;
  });
  const ccRows = co.ccs.map(c => { const ls = V.lines.filter(x => x.L.cc === c && isCost(x.L)); if (!ls.length) return ''; const b = sum(ls, x => x.b), a = sum(ls, x => x.a), fl = sum(ls, x => x.volEff);
    return `<tr><td>${esc(c)}</td><td class="num">${fmt(b)}</td><td class="num">${fmt(b + fl)}</td><td class="num">${fmt(a)}</td><td class="num ${vcls(b - a, true)}">${fmtS(a - b)}</td><td class="num ${vcls(b + fl - a, true)}">${fmtS(a - b - fl)}</td><td class="num">${pctS(ratio(a - b, b))}</td></tr>`; }).join('');
  const com = commentary(co, V, X.label);
  return `<section class="panel"><div class="panel-head"><h2>Budget against actual · ${esc(X.label)}</h2><span class="sub">${unitLbl()}</span></div>${ctl}</section>
    ${tiles}
    <div class="grid-2">
      <section class="panel"><div class="panel-head"><h2>EBITDA bridge</h2><span class="sub">Budget to actual</span></div>${waterfall(V.bridge)}

// ================================================================ Scenarios
function vScen() {
  const co = cur, sets = co.scen.sets, SC = R.SC, lv = co.scen.live || {};
  const tbl = `<table><thead><tr><th>Lever (applied to forecast months)</th><th class="num">Base</th><th class="num">Upside</th><th class="num">Downside</th></tr></thead><tbody>${LEVERS.map(([k, n, u]) => `<tr><td>${n}<span class="ref">${u === '%' ? '% change' : 'change in days'}</span></td><td class="num">0</td>
    ${['up', 'down'].map(sk => `<td class="num"><input class="cell" id="sc-${sk}-${k}" data-sc="${sk}" data-k="${k}" value="${+(sets[sk] || {})[k] || 0}" inputmode="decimal"></td>`).join('')}</tr>`).join('')}</tbody></table>`;
  const CMs = { base: R.CM, up: cashMonthly(co, SC.up, sets.up), down: cashMonthly(co, SC.down, sets.down) };
  const res = [['Revenue', x => fmt(x.fy.rev)], ['EBITDA', x => fmt(x.fy.ebitda)], ['EBITDA margin', x => pct(x.fy.em)], ['Profit after tax', x => fmt(x.fy.pat)]];

    ${res.map(([n, f]) => `<tr><td>${n}</td><td class="num">${f({ fy: BF })}</td><td class="num">${f(SC.down)}</td><td class="num"><strong>${f(SC.base)}</strong></td><td class="num">${f(SC.up)}</td></tr>`).join('')}
    <tr><td>Cash at 31 March</td><td class="num">–</td><td class="num">${fmt(cashLast('down'))}</td><td class="num">${fmt(cashLast('base'))}</td><td class="num">${fmt(cashLast('up'))}</td></tr>
    <tr><td>Lowest month-end cash</td><td class="num">–</td><td class="num ${cashMin('down') < (+co.cash.minCash || 0) ? 'neg' : ''}">${fmt(cashMin('down'))}</td><td class="num">${fmt(cashMin('base'))}</td><td class="num">${fmt(cashMin('up'))}</td></tr></tbody></table>`;
  // live what-if on top of base, forecast months only
  const W = outlook(co, lv), base = SC.base, fut = base.fut;
  const bF = addPl(co, fut.map(m => base.rows[m])), wF = addPl(co, fut.map(m => W.rows[m]));
  const k = x => (+lv[x] || 0) / 100, dPrice = wF.rev - bF.rev - bF.rev * k('vol'), dVol = bF.rev * k('vol') - bF.varc * k('vol'), dVar = -(wF.varc - bF.varc * (1 + k('vol'))), dFix = -(wF.fixc - bF.fixc);
  const bridge = [['Base outlook', bF.ebitda, 't'], ['Price', dPrice], ['Volume', dVol], ['Variable cost', dVar], ['Fixed cost', dFix], ['What-if', wF.ebitda, 't']];
  const WCm = cashMonthly(co, W, lv), wcRel = sum(WCm.rows, r => -r.dWC) - sum(R.CM.rows, r => -r.dWC);
  const sliders = LEVERS.map(([kk, n, u, mn, mx, st]) => `<div class="lever"><label for="lv-${kk}">${n}</label><output id="lo-${kk}">${(+lv[kk] > 0 ? '+' : '') + (+lv[kk] || 0)}${u}</output><input type="range" id="lv-${kk}" data-lv="${kk}" min="${mn}" max="${mx}" step="${st}" value="${+lv[kk] || 0}"></div>`).join('');
  // sensitivity: price × volume on full-year EBITDA

    <section class="panel"><div class="panel-head"><h2>Scenario levers</h2><span class="sub">Base = the rolling forecast</span></div><div class="scroll">${tbl}</div>
      <p class="note">Levers change only the forecast months (${fut.length ? fmonth(fut[0]) + ' to ' + fmonth(fut[fut.length - 1]) : 'none left'}); closed months stay at actual. Price moves sales value only; volume moves sales and variable costs; variable cost changes cost per unit; working-capital days change the cash forecast.</p></section>
    <section class="panel"><div class="panel-head"><h2>Results</h2><span class="sub">${unitLbl()}</span></div><div class="scroll">${rt}</div></section></div>
    <div class="grid-2">
    <section class="panel"><div class="panel-head"><h2>What-if</h2><div class="actions"><button type="button" class="sm" data-act="lv-reset">Reset</button><button type="button" class="sm" data-act="lv-save" data-to="up">Save as upside</button><button type="button" class="sm" data-act="lv-save" data-to="down">Save as downside</button></div></div>
      <div class="pad">${sliders}</div></section>
    <section class="panel"><div class="panel-head"><h2>Effect on the rest of the year</h2><span class="sub">${fut.length} forecast months</span></div>
      <div class="kv"><div>EBITDA, forecast months</div><div class="num"><strong>${fmt(wF.ebitda)}</strong> <span class="small ${vcls(wF.ebitda - bF.ebitda, true)}">${fmtS(wF.ebitda - bF.ebitda)}</span></div>
        <div>Full-year EBITDA</div><div class="num">${fmt(W.fy.ebitda)} <span class="small">${pct(W.fy.em)} margin</span></div>
        <div>Cash from working capital by 31 March</div><div class="num ${vcls(wcRel, true)}">${fmtS(wcRel)}</div>
        <div>Break-even monthly sales at this cost structure</div><div class="num">${fmt(wF.rev ? (wF.fixc / fut.length) / (1 - wF.varc / wF.rev) : 0)}</div></div>
      ${waterfall(bridge, 560, 230)}</section></div>
    <section class="panel"><div class="panel-head"><h2>Sensitivity: full-year EBITDA</h2><span class="sub">Price and volume changes on the forecast months · ${unitLbl()}</span></div><div class="scroll">${grid}</div></section>`;
}

  const list = items.filter(x => !who || x.owner === who), owners = [...new Set(items.map(x => x.owner).filter(Boolean))];

    return `<div class="col"><h3>${st}<span class="chip">${xs.length}</span></h3>${xs.map(x => `<button type="button" class="card" data-act="work-edit" data-kind="${x.kind}" data-id="${esc(x.id)}"><span class="t">${esc(x.title)}</span>
      <span class="m">${pill(PRI_CLS[x.pri], x.pri)}<span>${esc(x.owner || 'Not assigned')}</span><span class="${x.due < TODAY && st !== 'Done' ? 'neg' : ''}">${x.due ? 'by ' + fdate(x.due) : ''}</span></span><span class="m">${esc(x.src)}</span></button>`).join('') || '<span class="small muted" style="padding:4px">Nothing here</span>'}</div>`; };
  const load = owners.map(o => { const xs = items.filter(x => x.owner === o && x.status !== 'Done'); return `<tr><td>${esc(o)}<span class="ref">${esc(((co.team || []).find(t => t.name === o) || {}).role || '')}</span></td><td class="num">${xs.length}</td><td class="num">${xs.filter(x => x.pri === 'Critical' || x.pri === 'High').length}</td><td class="num ${xs.some(x => x.due < TODAY) ? 'neg' : ''}">${xs.filter(x => x.due < TODAY).length}</td></tr>`; }).join('');
  return `<section class="panel"><div class="panel-head"><div><h2>Work board</h2><div class="sub">Assigned mails, board actions and your own tasks in one place</div></div>
      <div class="actions"><label for="w-owner" style="min-width:180px">Show<select id="w-owner" data-ui="wOwner"><option value="">Whole team</option>${owners.map(o => `<option${o === who ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></label><button type="button" class="primary" data-act="work-add">Add task</button></div></div>
      <div class="board">${WSTAT.map(col).join('')}</div></section>
    <section class="panel"><div class="panel-head"><h2>Who is carrying what</h2><span class="sub">Open items by person</span></div>
      <div class="scroll"><table><thead><tr><th>Owner</th><th class="num">Open</th><th class="num">Critical / high</th><th class="num">Past due</th></tr></thead><tbody>${load}</tbody></table></div></section>`;
}

// ================================================================ KPIs and covenants
function vKpi() {
  const co = cur, K = kpiCompute(co), T = K.T;
  const rows = K.rows.map(r => `<tr><td>${esc(r.name)}${r.note ? `<span class="ref">${esc(r.note)}</span>` : ''}</td><td class="num"><strong>${kfmt(r.x, r.t)}</strong></td><td class="num muted">${r.dir === 'hi' ? '≥' : '≤'} ${kfmt(r.g, r.t)}</td><td>${pill(r.st, r.st === 'ok' ? 'Healthy' : r.st === 'warn' ? 'Watch' : r.st === 'bad' ? 'Act' : 'No data')}</td></tr>`).join('');
  const cov = K.cov.map(c => `<tr tabindex="0" data-act="cov-edit" data-id="${esc(c.id)}"><td>${esc(c.name)}</td><td class="num">${kfmt(c.x, (KPIS.find(k => k[1] === c.metric) || [])[2])}</td><td class="num">${c.op} ${c.limit}</td><td class="num ${c.st === 'bad' ? 'neg' : ''}">${c.head == null ? '–' : pct(c.head)}</td><td>${pill(c.st, c.ok == null ? 'No data' : c.ok ? (c.st === 'warn' ? 'Tight' : 'Met') : 'Breach')}</td></tr>`).join('');
  const D = K.dupont, bs = (co.kpi || {}).bs || {};
  return `<section class="totals">${tile('TTM revenue', '₹' + fmt(T.P.rev), `${T.n} months to ${fmonth(co.settings.closed)}`, 'lead')}${tile('TTM EBITDA', '₹' + fmt(T.P.ebitda), pct(T.P.em) + ' margin')}
      ${tile('Return on equity', kfmt(K.v.roe, 'p'), `DuPont: ${kfmt(D.margin, 'p')} × ${D.turnover ? D.turnover.toFixed(2) : '–'} × ${D.leverage ? D.leverage.toFixed(2) : '–'}`, K.v.roe >= .18 ? 'good' : 'warn')}
      ${tile('Covenants', `${K.cov.filter(c => c.ok).length}/${K.cov.length}`, K.cov.some(c => c.ok === false) ? 'a covenant is breached' : K.cov.some(c => c.st === 'warn') ? 'met, one is tight' : 'all met with headroom', K.cov.some(c => c.ok === false) ? 'bad' : K.cov.some(c => c.st === 'warn') ? 'warn' : 'good')}</section>
    <div class="grid-2">
      <section class="panel"><div class="panel-head"><h2>KPI scorecard</h2><span class="sub">Trailing twelve months of actuals + balance sheet below</span></div><div class="scroll"><table><thead><tr><th>Measure</th><th class="num">Now</th><th class="num">Healthy if</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div></section>
      <div style="display:grid;gap:20px;align-content:start">
      <section class="panel"><div class="panel-head"><h2>Lender covenants</h2><button type="button" class="sm" data-act="cov-add">Add covenant</button></div>
        <div class="scroll"><table><thead><tr><th>Covenant</th><th class="num">Now</th><th class="num">Limit</th><th class="num">Headroom</th><th></th></tr></thead><tbody>${cov}</tbody></table></div>
        <p class="note">Headroom under 15% is shown as tight, so treasury can act before a quarter-end test. Select a row to edit it.</p></section>
      <section class="panel"><div class="panel-head"><h2>Balance sheet at ${fmonth(co.settings.closed)}</h2><span class="sub">${unitLbl()}</span></div>
        <div class="form-inline">${KPI_IN.map(([l, k]) => `<label for="bs-${k}">${l}<input id="bs-${k}" type="number" step="1" data-bs="${k}" value="${+bs[k] || 0}"></label>`).join('')}</div></section></div></div>`;
}

// ================================================================ Decisions & capex
function vDec() {
  const co = cur, deals = co.deals || [], sel = deals.find(d => d.id === ui.dealSel) || deals[0];
  const DST = { Draft: 'idle', 'For board': 'gold', Approved: 'ok', Rejected: 'bad', Deferred: 'warn' };
  const lst = deals.map(d => { const A = appraise(d); return `<tr tabindex="0" data-act="deal-sel" data-id="${d.id}"${d === sel ? ' style="outline:1px solid var(--gold);outline-offset:-1px"' : ''}><td><strong>${esc(d.name)}</strong><span class="ref">${esc(d.sponsor || '')}</span></td><td class="num">${fmt(+d.capex)}</td><td class="num ${A.npv >= 0 ? 'pos' : 'neg'}">${fmt(A.npv)}</td><td class="num">${A.irr == null ? '–' : pct(A.irr)}</td><td class="num">${A.pb == null ? '–' : A.pb.toFixed(1) + ' yrs'}</td><td>${pill(DST[d.status] || 'idle', d.status)}</td></tr>`; }).join('');
  let det = '<div class="empty">Add a proposal to appraise it.</div>';
  if (sel) { const A = appraise(sel), yrs = A.cf.map((_, i) => i);
    det = `<div class="form-inline">${[['name', 'Proposal', 'text'], ['sponsor', 'Sponsor', 'text'], ['capex', 'Investment now (₹ lakh)', 'number'], ['rate', 'Hurdle rate / WACC %', 'number'], ['terminal', 'Value at the end (₹ lakh)', 'number'], ['maxPayback', 'Longest acceptable payback (years)', 'number']].map(([k, l, t]) => `<label for="dl-${k}">${l}<input id="dl-${k}" type="${t}" step="any" data-deal="${k}" value="${esc(sel[k] ?? '')}"></label>`).join('')}
        <label for="dl-flows" style="grid-column:1/-1">Cash inflow each year (₹ lakh, comma separated)<input id="dl-flows" data-deal="flows" value="${esc(sel.flows || '')}"></label>
        <label for="dl-status">Status<select id="dl-status" data-deal="status">${Object.keys(DST).map(s => `<option${s === sel.status ? ' selected' : ''}>${s}</option>`).join('')}</select></label>
        <label for="dl-note" style="grid-column:span 2">Note<input id="dl-note" data-deal="note" value="${esc(sel.note || '')}"></label></div>
      <section class="totals" style="padding:0 18px">${tile('Net present value', '₹' + fmt(A.npv), `at ${pct(A.r)} hurdle`, A.npv >= 0 ? 'good' : 'bad')}${tile('Internal rate of return', A.irr == null ? '–' : pct(A.irr), A.irr != null && A.irr > A.r ? `${bps(A.irr - A.r)} above hurdle` : 'below hurdle', A.irr != null && A.irr > A.r ? 'good' : 'bad')}
        ${tile('Payback', A.pb == null ? 'Never' : A.pb.toFixed(1) + ' yrs', `discounted ${A.dpb == null ? 'never' : A.dpb.toFixed(1) + ' yrs'}`, A.pb != null && A.pb <= (+sel.maxPayback || 99) ? 'good' : 'warn')}${tile('Recommendation', A.rec.split(' —')[0], A.pi ? `₹${A.pi.toFixed(2)} of value per ₹1 invested` : '', A.rec.startsWith('Recommend') ? 'lead' : 'bad')}</section>
      <div class="grid-2" style="padding:16px 18px 0">
        <div>${barChart(A.cf, yrs.map(i => 'Y' + i), { colorOf: v => v < 0 ? 'var(--bad)' : 'var(--s1)', W: 560, H: 200, minW: 380, label: 'Cash flows by year' })}</div>
        <div class="scroll"><table><thead><tr><th>Sensitivity</th><th class="num">NPV</th></tr></thead><tbody>${A.sens.map(x => `<tr><td>${x.dr ? `Hurdle ${x.dr > 0 ? '+' : '−'}2 points` : x.dc ? `Inflows ${x.dc > 0 ? '+' : '−'}10%` : 'As entered'}</td><td class="num ${x.npv >= 0 ? 'pos' : 'neg'}">${fmt(x.npv)}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="pad"><div class="actions"><button type="button" class="primary" data-act="deal-board">Send to the Board agenda</button><button type="button" data-act="deal-decide">Record the decision</button><button type="button" class="danger" data-act="deal-del">Delete proposal</button></div></div>`; }
  const log = (co.decisions || []).slice().sort((a, b) => a.date < b.date ? 1 : -1).map(k => `<tr tabindex="0" data-act="dec-edit" data-id="${k.id}"><td class="mono">${fdate(k.date)}</td><td>${esc(k.forum)}</td><td><strong>${esc(k.title)}</strong><span class="ref">${esc(k.decision)}</span></td><td>${esc(k.by)}</td><td>${pill(k.status === 'In force' ? 'ok' : k.status === 'Deferred' ? 'warn' : 'idle', k.status)}</td></tr>`).join('');
  return `<section class="panel"><div class="panel-head"><div><h2>Investment proposals</h2><div class="sub">NPV, IRR and payback for every capex request · ${unitLbl()}</div></div><button type="button" class="primary" data-act="deal-add">New proposal</button></div>
      <div class="scroll"><table><thead><tr><th>Proposal</th><th class="num">Investment</th><th class="num">NPV</th><th class="num">IRR</th><th class="num">Payback</th><th>Status</th></tr></thead><tbody>${lst}</tbody></table></div></section>
    <section class="panel"><div class="panel-head"><h2>${sel ? esc(sel.name) : 'Appraisal'}</h2><span class="sub">Year 0 is the investment; later years are net cash inflows after tax</span></div>${det}</section>
    <section class="panel"><div class="panel-head"><div><h2>Decision log</h2><div class="sub">What the Board and management decided, and why</div></div><button type="button" class="sm" data-act="dec-add">Record a decision</button></div>
      <div class="scroll"><table><thead><tr><th>Date</th><th>Forum</th><th>Decision</th><th>By</th><th>Status</th></tr></thead><tbody>${log}</tbody></table></div>
      <p class="note">Recording a decision can create follow-up actions on the Work board. Proposals marked "For board" appear on the Boardroom's decisions slide.</p></section>`;
}

// ================================================================ Boardroom (presentation for Directors)
function boardSlides() {
  const co = cur, D = R, s = co.settings, V = D.Vytd, OL = D.OL, BF = D.budFy, C = D.C13, K = kpiCompute(co), L = D.lastClosed;
  const kp = (k, v, n, cls) => `<div class="s-kpi ${cls || ''}"><span class="k">${k}</span><span class="v">${v}</span><span class="n">${n}</span></div>`;
  const rg = (d, good = true) => (good ? d >= 0 : d <= 0) ? 'g' : 'r';
  const foot = n => `<div class="s-foot"><span>${esc(s.name)} · ${fyLabel(s.Y)} · ${unitLbl()}</span><span>${n}</span></div>`;
  const out = [];
  out.push({ t: 'Cover', h: `<div class="slide"><div></div><div class="s-cover"><div class="s-eye">Board review · ${L ? fmonth(L) : fyLabel(s.Y)}</div><div class="big">${esc(s.name)}</div><div class="rule"></div>
    <div style="font-size:clamp(11px,1.5vw,20px);color:var(--muted);max-width:60ch">Performance, liquidity, outlook and the decisions we ask the Board to take.</div>
    <div style="font-size:clamp(9px,1vw,13px);color:var(--faint)">Presented by ${esc(s.actor || 'the CFO')} · ${fdate(TODAY)}</div></div>${foot('1')}</div>` });
  if (V) out.push({ t: 'Performance at a glance', h: `<div class="slide"><div><div class="s-eye">Year to date · ${fmonth(D.closed[0])} – ${fmonth(L)}</div><div class="s-title">Performance at a glance</div></div><div class="s-body"><div class="s-kpis">
    ${kp('Revenue', '₹' + fmt(V.A.rev), `<b>${pctS(ratio(V.A.rev - V.B.rev, V.B.rev))}</b> against budget`, rg(V.A.rev - V.B.rev))}${kp('EBITDA', '₹' + fmt(V.A.ebitda), `<b>${fmtS(V.A.ebitda - V.B.ebitda)}</b> against budget`, rg(V.A.ebitda - V.B.ebitda))}
    ${kp('EBITDA margin', pct(V.A.em), `<b>${bps(V.A.em - V.B.em)}</b> against ${pct(V.B.em)}`, rg(V.A.em - V.B.em))}${kp('Profit after tax', '₹' + fmt(V.A.pat), `<b>${fmtS(V.A.pat - V.B.pat)}</b> against budget`, rg(V.A.pat - V.B.pat))}
    ${kp('Full-year EBITDA outlook', '₹' + fmt(OL.fy.ebitda), `<b>${fmtS(OL.fy.ebitda - BF.ebitda)}</b> against budget`, rg(OL.fy.ebitda - BF.ebitda))}${kp('Cash today', '₹' + fmt(C.open), `lowest <b>₹${fmt(C.lo)}</b> in 13 weeks`, C.lo < C.min ? 'a' : 'g')}</div></div>${foot('2')}</div>` });
  if (V) { const com = commentary(co, V, 'Year to date'); out.push({ t: 'Profit bridge', h: `<div class="slide"><div><div class="s-eye">Why EBITDA differs from budget</div><div class="s-title">From budget to actual EBITDA</div></div><div class="s-body"><div class="s-two"><div>${waterfall(V.bridge, 640, 300)}</div><ul class="s-list">${com.slice(1, 5).map(t => `<li>${esc(t)}</li>`).join('')}</ul></div></div>${foot('3')}</div>` }); }
  if (V) out.push({ t: 'Revenue drivers', h: `<div class="slide"><div><div class="s-eye">Price, volume and mix</div><div class="s-title">What moved revenue</div></div><div class="s-body"><div class="s-two"><table class="s-table"><thead><tr><th>Product</th><th style="text-align:right">Price</th><th style="text-align:right">Volume</th><th style="text-align:right">Mix</th><th style="text-align:right">Total</th></tr></thead><tbody>${V.P.rows.map(r => `<tr><td>${esc(r.L.name)}</td><td style="text-align:right" class="${vcls(r.price, true)}">${fmtS(r.price)}</td><td style="text-align:right" class="${vcls(r.vol, true)}">${fmtS(r.vol)}</td><td style="text-align:right" class="${vcls(r.mix, true)}">${fmtS(r.mix)}</td><td style="text-align:right" class="${vcls(r.tot, true)}"><b>${fmtS(r.tot)}</b></td></tr>`).join('')}</tbody></table>
    <ul class="s-list"><li>Price added ₹${fmt(V.P.T.price)} — the increase agreed with customers is holding.</li><li>Volume ${V.P.T.vol >= 0 ? 'added' : 'cost'} ₹${fmt(Math.abs(V.P.T.vol))} and mix ${V.P.T.mix >= 0 ? 'added' : 'cost'} ₹${fmt(Math.abs(V.P.T.mix))}.</li>${(co.comments || {})['ytd|g'] ? `<li>${esc(co.comments['ytd|g'].text)}</li>` : ''}</ul></div></div>${foot('4')}</div>` });
  out.push({ t: 'Month by month', h: `<div class="slide"><div><div class="s-eye">Actual and forecast against budget</div><div class="s-title">EBITDA by month</div></div><div class="s-body">${barChart(OL.ms.map(m => OL.rows[m].ebitda), OL.ms.map(m => smonth(m) + (OL.rows[m].kind === 'A' ? '' : ' F')), { vals2: OL.ms.map(m => monthPl(co, D.bud(m)).ebitda), colorOf: (v, i) => OL.rows[OL.ms[i]].kind === 'A' ? '#12305A' : '#A07A33', W: 900, H: 300, minW: 300, label: 'EBITDA by month' })}
    <div class="legend" style="padding:0;color:var(--muted)"><span><i style="background:#12305A"></i>Actual</span><span><i style="background:#A07A33"></i>Forecast (F)</span><span><i style="background:#C9D2DE"></i>Budget</span></div></div>${foot('5')}</div>` });
  const cov = K.cov.map(c => `<tr><td>${esc(c.name)}</td><td style="text-align:right">${kfmt(c.x, (KPIS.find(k => k[1] === c.metric) || [])[2])}</td><td style="text-align:right">${c.op} ${c.limit}</td><td class="${c.ok === false ? 'neg' : 'pos'}">${c.ok == null ? '–' : c.ok ? (c.st === 'warn' ? 'Tight' : 'Met') : 'Breach'}</td></tr>`).join('');
  out.push({ t: 'Liquidity', h: `<div class="slide"><div><div class="s-eye">Cash, next 13 weeks and covenants</div><div class="s-title">Liquidity and lenders</div></div><div class="s-body"><div class="s-two"><div>${barChart(C.close, C.weeks.map(w => 'W' + (w.i + 1)), { line: C.min, lineLabel: 'buffer', colorOf: v => v < C.min ? '#B23A32' : '#12305A', W: 620, H: 280, minW: 300, label: 'Closing cash by week' })}</div>
    <div style="display:grid;gap:1em;align-content:start"><ul class="s-list"><li>Cash today ₹${fmt(C.open)}; lowest ₹${fmt(C.lo)} in week ${C.loW + 1}; week 13 ₹${fmt(C.close[12])}.</li><li>31 March forecast ₹${fmt(D.CM.rows.length ? D.CM.rows[D.CM.rows.length - 1].close : null)} after tax, capex and loan repayment.</li></ul>${cov ? `<table class="s-table"><thead><tr><th>Covenant</th><th style="text-align:right">Now</th><th style="text-align:right">Limit</th><th></th></tr></thead><tbody>${cov}</tbody></table>` : ''}</div></div></div>${foot('6')}</div>` });
  out.push({ t: 'Outlook', h: `<div class="slide"><div><div class="s-eye">${OL.closed.length} months actual + ${OL.fut.length} forecast</div><div class="s-title">Full-year outlook and scenarios</div></div><div class="s-body"><div class="s-two"><table class="s-table"><thead><tr><th></th><th style="text-align:right">Budget</th><th style="text-align:right">Downside</th><th style="text-align:right">Outlook</th><th style="text-align:right">Upside</th></tr></thead><tbody>${[['Revenue', 'rev'], ['EBITDA', 'ebitda'], ['Profit after tax', 'pat']].map(([t, k]) => `<tr><td>${t}</td><td style="text-align:right">${fmt(BF[k])}</td><td style="text-align:right">${fmt(D.SC.down.fy[k])}</td><td style="text-align:right"><b>${fmt(OL.fy[k])}</b></td><td style="text-align:right">${fmt(D.SC.up.fy[k])}</td></tr>`).join('')}<tr><td>EBITDA margin</td><td style="text-align:right">${pct(BF.em)}</td><td style="text-align:right">${pct(D.SC.down.fy.em)}</td><td style="text-align:right"><b>${pct(OL.fy.em)}</b></td><td style="text-align:right">${pct(D.SC.up.fy.em)}</td></tr></tbody></table>
    <ul class="s-list"><li>Outlook EBITDA ₹${fmt(OL.fy.ebitda)}, ${OL.fy.ebitda >= BF.ebitda ? 'ahead of' : 'short of'} budget by ₹${fmt(Math.abs(OL.fy.ebitda - BF.ebitda))}.</li><li>Range ₹${fmt(D.SC.down.fy.ebitda)} to ₹${fmt(D.SC.up.fy.ebitda)} on price, volume and cost levers.</li>${co.buds.some(b => b.status === 'Submitted') ? `<li>Revised budget submitted for approval.</li>` : ''}</ul></div></div>${foot('7')}</div>` });
  const asks = (co.deals || []).filter(d => d.status === 'For board').map(d => ({ d, A: appraise(d) }));
  const pend = co.buds.filter(b => b.status === 'Submitted');
  out.push({ t: 'Decisions', h: `<div class="slide"><div><div class="s-eye">For the Board's approval</div><div class="s-title">Decisions we are asking for</div></div><div class="s-body">
    ${asks.length || pend.length ? `<table class="s-table"><thead><tr><th>Proposal</th><th style="text-align:right">Investment</th><th style="text-align:right">NPV</th><th style="text-align:right">IRR</th><th style="text-align:right">Payback</th><th>Recommendation</th></tr></thead><tbody>${asks.map(({ d, A }) => `<tr><td><b>${esc(d.name)}</b><br><span style="color:var(--muted)">${esc(d.note || '')}</span></td><td style="text-align:right">${fmt(+d.capex)}</td><td style="text-align:right" class="${A.npv >= 0 ? 'pos' : 'neg'}">${fmt(A.npv)}</td><td style="text-align:right">${A.irr == null ? '–' : pct(A.irr)}</td><td style="text-align:right">${A.pb == null ? '–' : A.pb.toFixed(1) + ' yrs'}</td><td>${esc(A.rec)}</td></tr>`).join('')}${pend.map(b => `<tr><td><b>Approve ${esc(b.name)}</b><br><span style="color:var(--muted)">Submitted by ${esc(b.by)} on ${fdate(b.on)}</span></td><td colspan="4" style="text-align:right">EBITDA ₹${fmt(addPl(co, months(s.Y).map(m => monthPl(co, b.d[m]))).ebitda)}</td><td>Approve</td></tr>`).join('')}</tbody></table>` : '<ul class="s-list"><li>No decisions are pending.</li></ul>'}</div>${foot('8')}</div>` });
  out.push({ t: 'Data model', h: `<div class="slide"><div><div class="s-eye">Where every number comes from</div><div class="s-title">The data model behind this pack</div></div><div class="s-body">${dataModelSvg()}</div>${foot('9')}</div>` });
  return out;
}
function dataModelSvg() {

  dlg.addEventListener('click', e => { const b = e.target.closest('[data-lk]'); if (!b) { if (e.target === dlg) dlg.close(); return; } const a = b.dataset.lk;
    if (a === 'close') { dlg.close(); return; }
    if (a === 'preset') L.preset = b.dataset.v;
    if (a === 'set') L[b.dataset.k] = b.dataset.v;
    if (a === 'reset') { const keep = L.saved; L = { ...JSON.parse(JSON.stringify(DEF)), saved: keep }; }
    if (a === 'savec') { const nm = (dlg.querySelector('#lk-name').value || '').trim(); if (!nm) { dlg.querySelector('#lk-name').focus(); return; } L.saved = [...L.saved.filter(x => x.name !== nm), { name: nm, ...L.custom }].slice(-8); }
    if (a === 'use') { const x = L.saved[+b.dataset.v]; L.custom = { accent: x.accent, accent2: x.accent2, tint: x.tint }; L.preset = 'custom'; }
    if (a === 'del') L.saved.splice(+b.dataset.v, 1);
    if (a === 'copy') { const el = dlg.querySelector('#lk-code'); try { navigator.clipboard.writeText(el.value).then(() => { b.textContent = 'Copied'; }, () => { el.select(); b.textContent = 'Press Ctrl+C'; }); } catch { el.select(); } return; }
    if (a === 'paste') { try { const v = JSON.parse(decodeURIComponent(escape(atob(dlg.querySelector('#lk-paste').value.trim())))); L = { ...L, preset: v.p === 'own' ? 'own' : v.p, custom: v.c || L.custom, mode: v.m || L.mode, density: v.d || L.density, font: v.f || L.font, skin: v.s || L.skin }; }
      catch { dlg.querySelector('#lk-paste').value = ''; dlg.querySelector('#lk-paste').placeholder = 'That is not a look code — copy it again'; return; } }
    save(); apply(); draw(); });
  dlg.addEventListener('input', e => { const k = e.target.dataset.lkc; if (!k) return; L.custom[k] = e.target.value.toUpperCase(); L.preset = 'custom'; apply(); clearTimeout(tmr); tmr = setTimeout(save, 300); });
  dlg.addEventListener('change', e => { if (e.target.dataset.lkc) { save(); draw(); } if (e.target.dataset.lkf) { L.font = e.target.value; save(); apply(); draw(); } });
  function open() { draw(); if (!dlg.open) dlg.showModal(); }
  function addButton() {
    if (document.getElementById('lk-open')) return;
    const host = document.querySelector(CFG.host);
    const b = document.createElement('button'); b.type = 'button'; b.id = 'lk-open'; b.textContent = 'Look & feel'; if (CFG.btnClass) b.className = CFG.btnClass;
    b.addEventListener('click', open);
    if (host) host.appendChild(b); else { b.style.cssText = 'position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20'; document.body.appendChild(b); }
  }
  apply(); addButton();
  window.lookFeel = { open, apply };
})();
</script>
