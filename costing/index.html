<style>
/* Layout: the cost office — a petrol-blue header band with copper instrument accents; a left rail that groups methods by job (cost what you make, find the true cost, decide, report); ledger-ruled tables with double-ruled totals. */
:root {
  --bg: #F2F4F8; --surface: #FFFFFF; --sunk: #E9EDF3; --line: #D3DAE4; --rule: #E3E8EF; --fg: #131B2B; --muted: #5A6577;
  --ink: #0D2350; --ink-2: #16336E; --sel: #0D2350; --band-fg: #EEF3FB; --band-muted: #A9B8D3; --band-field: rgb(255 255 255 / .1); --band-line: rgb(255 255 255 / .22);
  --brass: #2F62B3; --brass-hi: #7FB3F5; --brass-bg: #E6EFFB; --focus: #2F6FED;
  --good: #1F7547; --good-bg: #DCF0E3; --warn: #9A5A00; --warn-bg: #FBEBCB; --bad: #B42318; --bad-bg: #FBE0DC;
  --chart-a: #0D2350; --chart-b: #8A97AB; --chart-c: #4C93E6;
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif; --f-body: "Libre Franklin", "Segoe UI", Arial, sans-serif; --f-num: "Spline Sans Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B111C; --surface: #121A28; --sunk: #182234; --line: #27344A; --rule: #1E2A3C; --fg: #E4EAF3; --muted: #94A1B5;
  --ink: #0A1A3A; --ink-2: #12285A; --sel: #2A4C96; --band-fg: #E9F0FA; --band-muted: #9DB0CF; --band-field: rgb(255 255 255 / .07); --band-line: rgb(255 255 255 / .16);
  --brass: #8DBBF5; --brass-hi: #A9CDFA; --brass-bg: #15233B; --focus: #7AA2FF;
  --good: #5BD49A; --good-bg: #10301F; --warn: #F2B457; --warn-bg: #33250C; --bad: #FF8A80; --bad-bg: #3A1512;
  --chart-a: #A9C4EE; --chart-b: #8C99AD; --chart-c: #5FA8F0; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0B111C; --surface: #121A28; --sunk: #182234; --line: #27344A; --rule: #1E2A3C; --fg: #E4EAF3; --muted: #94A1B5;
  --ink: #0A1A3A; --ink-2: #12285A; --sel: #2A4C96; --band-fg: #E9F0FA; --band-muted: #9DB0CF; --band-field: rgb(255 255 255 / .07); --band-line: rgb(255 255 255 / .16);
  --brass: #8DBBF5; --brass-hi: #A9CDFA; --brass-bg: #15233B; --focus: #7AA2FF;
  --good: #5BD49A; --good-bg: #10301F; --warn: #F2B457; --warn-bg: #33250C; --bad: #FF8A80; --bad-bg: #3A1512;
  --chart-a: #A9C4EE; --chart-b: #8C99AD; --chart-c: #5FA8F0; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.45; margin: 0; padding-block: 0 48px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: .01em; }
h2 { font-size: 1.45rem; line-height: 1.1; }
h3 { font-size: 1.15rem; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; font-size: 12.5px; }
.mono { font-family: var(--f-num); font-size: 12px; white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; font-weight: 500; }
button:hover { border-color: var(--ink-2); }
button.primary { background: var(--sel); color: var(--band-fg); border-color: var(--sel); font-weight: 600; }
button.primary:hover { background: var(--ink-2); }
button.danger { color: var(--bad); border-color: var(--bad); }
button.link { border: 0; background: none; padding: 0; color: var(--fg); text-decoration: underline; text-decoration-color: var(--brass); text-decoration-thickness: 2px; text-underline-offset: 3px; text-align: left; font-weight: 500; }
button.sm { padding: 4px 10px; font-size: 12px; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .tab:focus-visible, tr[tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 7px 9px; width: 100%; min-width: 0; }
input[type="checkbox"] { width: auto; accent-color: var(--ink-2); }
label { display: grid; gap: 4px; font-size: 11.5px; color: var(--muted); font-weight: 600; }
label.check { display: flex; align-items: center; gap: 8px; color: var(--fg); font-size: 13px; font-weight: 500; }

/* ---- header band */
.band { background: var(--ink); color: var(--band-fg); position: relative; overflow: hidden; }
.band::after { content: ""; position: absolute; inset: auto 0 0 0; height: 4px; background: repeating-linear-gradient(90deg, var(--brass-hi) 0 1px, transparent 1px 12px); opacity: .55; }
.band-in { max-width: 1440px; margin: 0 auto; padding-block: 22px 26px; display: grid; gap: 18px; }
.brand { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: flex-end; justify-content: space-between; }
.mark { display: flex; gap: 14px; align-items: center; min-width: 0; }
.mark svg { flex: none; width: 46px; height: 46px; }
.mark .eyebrow { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--brass-hi); font-weight: 600; }
.mark h1 { font-size: clamp(2rem, 4.6vw, 3rem); line-height: .92; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; color: var(--band-fg); }
.band .sub { color: var(--band-muted); font-size: 13px; max-width: 64ch; }
.company { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.company label { min-width: min(240px, 100%); }
.band label { color: var(--band-muted); }
.band input, .band select { background: var(--band-field); border-color: var(--band-line); color: var(--band-fg); }
.band select option, .band select optgroup { color: #142229; background: #FCFDFD; }
.band button { background: transparent; color: var(--band-fg); border-color: var(--band-line); }
.band button:hover { border-color: var(--brass-hi); }
.band button.danger { color: #FFB3AA; border-color: rgb(255 179 170 / .5); }
.save-state { font-size: 12px; color: var(--band-muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--band-muted); }
.dot.ok { background: #5BD486; } .dot.warn { background: var(--brass-hi); }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; align-items: end; padding-top: 16px; border-top: 1px solid var(--band-line); }

/* ---- shell: rail + work area */
.shell { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 24px; padding-top: 22px; align-items: start; }
.rail { position: sticky; top: calc(14px + env(safe-area-inset-top, 0px)); display: grid; gap: 16px; }
.rail .grp { display: grid; gap: 2px; }
.rail .gl { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass); font-weight: 700; padding: 0 10px 4px; }
.tab { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; background: none; border: 0; border-radius: 4px; padding: 8px 10px; color: var(--fg); font-weight: 500; }
.tab:hover { background: var(--sunk); }
.tab[aria-selected="true"] { background: var(--sel); color: var(--band-fg); font-weight: 600; }
.tab .cnt { font-family: var(--f-num); font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 3px; background: var(--bad); color: var(--surface); }
.rail .xfer { display: grid; gap: 6px; padding-top: 14px; border-top: 1px solid var(--line); }
.work { display: grid; gap: 18px; min-width: 0; }
.work > *, .grid-2 > *, #view > * { min-width: 0; }
#view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .rail { position: static; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
  .rail .grp { display: flex; gap: 4px; }
  .rail .gl { display: none; }
  .tab { white-space: nowrap; width: auto; border: 1px solid var(--line); }
  .rail .xfer { display: flex; padding: 0 0 0 6px; border: 0; border-left: 1px solid var(--line); }
  .rail .xfer button { white-space: nowrap; }
}

.banner { background: var(--brass-bg); border: 1px solid var(--brass); border-radius: 4px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.banner strong { color: var(--brass); }

/* ---- headline gauges */
.totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.tot { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--ink); border-radius: 4px; padding: 12px 14px 14px; display: grid; gap: 4px; align-content: start; }
.tot .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.tot .v { font-family: var(--f-display); font-size: 2.3rem; line-height: 1; font-weight: 700; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.tot .n { font-size: 12px; color: var(--muted); }
.tot.bad { border-top-color: var(--bad); } .tot.bad .v { color: var(--bad); }
.tot.warn { border-top-color: var(--warn); } .tot.warn .v { color: var(--warn); }
.tot.good { border-top-color: var(--good); } .tot.good .v { color: var(--good); }
.meter { position: relative; height: 6px; background: var(--sunk); border-radius: 1px; margin-top: 4px; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--sel); border-radius: 1px; }
.meter b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--brass-hi); }
.tot.bad .meter i { background: var(--bad); } .tot.warn .meter i { background: var(--warn); } .tot.good .meter i { background: var(--good); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 3px; padding: 2px 8px; font-size: 11.5px; font-weight: 600; border: 1px solid transparent; white-space: nowrap; letter-spacing: .01em; }
.pill.ok { background: var(--good-bg); color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.pill.bad { background: var(--bad-bg); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.pill.warn { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.pill.idle { background: var(--sunk); color: var(--muted); border-color: var(--line); }
.chip { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 3px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.fa { font-family: var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 500; font-size: 12.5px; }
.fa b { display: inline-block; margin-left: 5px; font-size: 10px; font-weight: 700; line-height: 1; padding: 2px 3px; border: 1.5px solid currentColor; border-radius: 2px; transform: rotate(-4deg); }
.fa.F { color: var(--good); } .fa.A { color: var(--bad); }
.neg { color: var(--bad); }

/* ---- panels and ledger tables */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; min-width: 0; }
.panel-head { padding: 14px 16px 10px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-end; justify-content: space-between; }
.panel-head .sub { color: var(--muted); font-size: 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; padding: 0 16px 12px; align-items: end; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 12px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; background: transparent; border-top: 1px solid var(--line); border-bottom: 2px solid var(--ink); white-space: nowrap; }
th.num { text-align: right; font-family: var(--f-body); }
td .ref { display: block; font-size: 11px; color: var(--muted); }
tbody tr[tabindex] { cursor: pointer; }
tbody tr[tabindex]:hover td { background: var(--sunk); }
tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--sunk) 35%, transparent); }
tfoot td { font-weight: 700; border-top: 1px solid var(--fg); border-bottom: 3px double var(--fg); }
tr.grp td { background: var(--sunk) !important; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
tr.sub td { font-weight: 700; border-top: 1px solid var(--fg); }
tr.memo td { color: var(--muted); font-style: italic; }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.note { padding: 12px 16px 14px; color: var(--muted); font-size: 12px; max-width: 104ch; border-top: 1px dashed var(--line); }
.note p { margin: 0 0 6px; }
.note strong { color: var(--fg); }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 18px; }
.todo { list-style: none; margin: 0; padding: 0 16px 14px; display: grid; }
.todo li { display: grid; grid-template-columns: 120px 1fr auto; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--rule); align-items: center; }
.todo li:last-child { border-bottom: 0; }
.todo .d { font-size: 10.5px; color: var(--brass); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
@media (max-width: 520px) { .todo li { grid-template-columns: 1fr auto; } .todo .d { grid-column: 1 / -1; } }
.kv { display: grid; grid-template-columns: 1fr auto; }
.kv div { padding: 7px 16px; border-bottom: 1px solid var(--rule); }
.kv .strong { font-weight: 700; }
.kv .num { text-align: right; }
.kv > div { min-width: 0; }
.form-inline { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 12px; padding: 0 16px 14px; align-items: end; }

/* ---- process pipeline */
.flow { display: flex; flex-wrap: wrap; gap: 0; align-items: stretch; padding: 4px 16px 16px; }
.flow .st { border: 1px solid var(--line); border-top: 3px solid var(--ink-2); border-radius: 4px; padding: 10px 12px; display: grid; gap: 3px; background: var(--surface); min-width: 170px; flex: 1 1 170px; }
.flow .st .nm { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; }
.flow .st .cu { font-family: var(--f-num); font-size: 15px; font-weight: 600; color: var(--ink-2); }
.flow .st .ls { font-size: 11.5px; color: var(--muted); }
.flow .st .ls.bad { color: var(--bad); } .flow .st .ls.good { color: var(--good); }
.flow .arrow { display: grid; place-items: center; color: var(--brass); padding: 0 6px; font-size: 18px; }

/* ---- bars and charts */
.bar { position: relative; height: 10px; min-width: 120px; background: var(--sunk); border-radius: 1px; }
.bar i { position: absolute; top: 0; bottom: 0; border-radius: 1px; }
.bar i.pos { background: var(--chart-b); left: 50%; }
.bar i.neg { background: var(--bad); right: 50%; }
.bar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.vchart { padding: 2px 16px 14px; display: grid; gap: 6px; }
.vrow { display: grid; grid-template-columns: minmax(120px, 210px) 1fr 110px; gap: 10px; align-items: center; font-size: 12.5px; }
.vrow .track { position: relative; height: 14px; }
.vrow .track::before { content: ""; position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--muted); }
.vrow .track i { position: absolute; top: 0; bottom: 0; border-radius: 1px; }
.vrow .track i.F { left: 50%; background: var(--good); } .vrow .track i.A { right: 50%; background: var(--bad); }
.vaxis { display: grid; grid-template-columns: minmax(120px, 210px) 1fr 110px; gap: 10px; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }
.vaxis span:nth-child(2) { display: flex; justify-content: space-between; }
@media (max-width: 520px) { .vrow, .vaxis { grid-template-columns: 96px 1fr 88px; } }
.chart { padding: 0 16px 12px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .ax { stroke: var(--rule); }
.chart .lbl { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.chart .s1 { stroke: var(--chart-a); } .chart .s2 { stroke: var(--chart-b); } .chart .s3 { stroke: var(--chart-c); }
.chart .pt { fill: var(--bad); }
.chart .loss { fill: color-mix(in srgb, var(--bad) 10%, transparent); }
.chart .prof { fill: color-mix(in srgb, var(--good) 12%, transparent); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; padding: 0 16px 12px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 3px; margin-right: 6px; vertical-align: middle; background: currentColor; }
.legend .nl::before { display: none; }
.legend .l1 { color: var(--chart-a); } .legend .l2 { color: var(--chart-b); } .legend .l3 { color: var(--chart-c); }

dialog { border: 1px solid var(--line); border-top: 4px solid var(--ink); border-radius: 4px; padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 40px); background: var(--surface); color: var(--fg); }
dialog::backdrop { background: rgb(6 18 24 / .55); }
.form { padding: 18px; display: grid; gap: 14px; }
.form h2 { font-size: 1.5rem; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.grid2 .full { grid-column: 1 / -1; }
.form-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.err { color: var(--bad); font-size: 12px; min-height: 1em; }
.hint { font-size: 11px; color: var(--muted); font-weight: 400; }
pre.sheet { background: var(--sunk); border: 1px solid var(--line); border-radius: 4px; padding: 12px; font-family: var(--f-num); font-size: 12px; white-space: pre; margin: 0; max-height: 52vh; overflow: auto; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); background: var(--ink); color: var(--band-fg); border-left: 4px solid var(--brass-hi); padding: 10px 14px; border-radius: 4px; font-size: 13px; max-width: min(440px, calc(100vw - 32px)); z-index: 10; }
@media (prefers-reduced-motion: no-preference) {
  .tab, button { transition: border-color .15s, background .15s; }
  #view > * { animation: rise .28s ease-out both; }
  @keyframes rise { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

<header class="band">
  <div class="band-in gutter">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="2" y="2" width="44" height="44" rx="3" fill="none" stroke="var(--brass-hi)" stroke-width="2"/><path d="M8 34h32" stroke="var(--band-fg)" stroke-width="2"/><path d="M10 34v-6M16 34v-3M22 34v-9M28 34v-3M34 34v-6M40 34v-3" stroke="var(--band-fg)" stroke-width="1.6"/><path d="M8 20l9-6 8 4 15-8" fill="none" stroke="var(--brass-hi)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="40" cy="10" r="2.6" fill="var(--brass-hi)"/></svg>
        <div><div class="eyebrow">Cost office · ₹</div><h1>Costing Workbench</h1></div>
      </div>
      <div class="company">
        <label for="company">Company<select id="company"></select></label>
        <button id="new-company" type="button">New company</button>
        <button id="del-co" type="button" class="danger" data-act="del-company" hidden>Delete company</button>
        <div class="save-state" id="save-state"><span class="dot"></span><span>Loading…</span></div>
      </div>
    </div>

  proj: { name: 'Project', sheet: 'Projects', f: [['code', 'Project code'], ['name', 'Project'], ['client', 'Client'], ['billing', 'Billing', 's', ['Fixed fee', 'Time and material', 'Internal']], ['fee', 'Contract fee for fixed-fee projects (₹)', 'n'],
    ['budgetHrs', 'Budgeted hours', 'n'], ['otherCost', 'Other direct costs to date — travel, software, sub-consultants (₹)', 'n'], ['status', 'Status', 's', ['Active', 'Completed', 'On hold']]] },
  time: { name: 'Timesheet entry', sheet: 'Timesheet', f: [['month', 'Month', 'm'], ['project', 'Project', 's', co => co.proj.map(p => [p.code, `${p.code} — ${p.name}`])], ['staff', 'Staff', 's', co => co.staff.map(s => [s.code, `${s.code} — ${s.name}`])],
    ['hours', 'Hours', 'n'], ['billable', 'Billable to the client', 'c']] },
  ship: { name: 'Import shipment', sheet: 'Shipments', f: [['ref', 'Shipment / bill of entry ref'], ['supplier', 'Supplier'], ['boeDate', 'Bill of entry date'], ['currency', 'Invoice currency'], ['rate', 'Customs exchange rate (₹ per unit of currency)', 'n'],
    ['terms', 'Invoice terms', 's', ['FOB', 'CIF']], ['freight', 'Ocean / air freight in invoice currency (blank: 20% of FOB)', 'n'], ['insurance', 'Insurance in invoice currency (blank: 1.125% of FOB)', 'n'], ['swsPct', 'Social welfare surcharge, % of duty', 'n'],
    ['cha', 'Clearing agent charges (₹)', 'n'], ['port', 'Port, terminal and shipping line charges (₹)', 'n'], ['inland', 'Inland freight to factory (₹)', 'n'], ['other', 'Other charges — testing, demurrage (₹)', 'n'],
    ['basis', 'Share local charges by', 's', [['value', 'Assessable value'], ['weight', 'Weight'], ['qty', 'Quantity']]], ['igstCredit', 'IGST credit available (leave IGST out of cost)', 'c']] },

    ['weight', 'Gross weight (kg)', 'n'], ['bcdPct', 'Basic customs duty %', 'n'], ['igstPct', 'IGST %', 'n']] },

  sales: { name: 'Sales invoice', sheet: 'Sales', f: [['inv', 'Invoice no.'], ['date', 'Date'], ['customer', 'Customer'], ['channel', 'Channel', 's', ['Direct', 'Distributor', 'Export', 'Online']], ['product', 'Product', 's', co => co.cvp.map(p => [p.code, `${p.code} — ${p.name}`])],
    ['qty', 'Quantity', 'n'], ['rate', 'Rate per unit (₹)', 'n'], ['discount', 'Discount and rebates (₹)', 'n'], ['freight', 'Outward freight (₹)', 'n'], ['commPct', 'Commission or channel fee %', 'n']] },
  mob: { name: 'Make-or-buy decision', sheet: 'Make or buy', f: [['name', 'Component or service'], ['unit', 'Unit'], ['qty', 'Quantity needed', 'n'], ['dm', 'Make: material per unit (₹)', 'n'], ['dl', 'Make: labour per unit (₹)', 'n'], ['voh', 'Make: variable overhead per unit (₹)', 'n'],
    ['avoidFixed', 'Fixed cost saved if bought — supervisor, dies, rent (₹)', 'n'], ['oppCost', 'Contribution lost because capacity is used for this (₹)', 'n'], ['buyPrice', 'Buy: supplier price per unit (₹)', 'n'], ['buyFreight', 'Buy: freight and handling per unit (₹)', 'n']] },
  special: { name: 'Special order', sheet: 'Special orders', f: [['customer', 'Customer'], ['product', 'Product', 's', co => co.cvp.map(p => [p.code, `${p.code} — ${p.name}`])], ['qty', 'Quantity', 'n'], ['price', 'Price offered per unit (₹)', 'n'], ['extraCost', 'Extra one-off costs — packing, tooling, documents (₹)', 'n']] },
  csheet: { name: 'Cost sheet', sheet: 'Cost sheets', f: [['product', 'Product'], ['unit', 'Unit'], ['installedCap', 'Installed capacity in the month (units)', 'n'], ['normalCap', 'Normal capacity in the month (units)', 'n'], ['actualProd', 'Actual production (units)', 'n'], ['salesQty', 'Quantity sold (units)', 'n'],
    ['matOpen', 'Materials: opening stock (₹)', 'n'], ['matPurch', 'Materials: purchases incl. freight and duty, net of credits (₹)', 'n'], ['matClose', 'Materials: closing stock (₹)', 'n'], ['utilities', 'Power, fuel and water (₹)', 'n'], ['empCost', 'Direct employee cost (₹)', 'n'],
    ['directExp', 'Direct expenses — job work, royalty on production (₹)', 'n'], ['stores', 'Consumable stores and spares (₹)', 'n'], ['repairs', 'Repairs and maintenance (₹)', 'n'], ['qc', 'Quality control (₹)', 'n'], ['rnd', 'Research and development (₹)', 'n'],
    ['royalty', 'Technical know-how fee and royalty (₹)', 'n'], ['depn', 'Depreciation of production assets (₹)', 'n'], ['fohVar', 'Other production overheads — variable (₹)', 'n'], ['fohFixed', 'Other production overheads — fixed (₹)', 'n'],
    ['wipOpen', 'Opening work in progress (₹)', 'n'], ['wipClose', 'Closing work in progress (₹)', 'n'], ['scrapCredit', 'Credit for scrap, by-products and recoveries (₹)', 'n'], ['packing', 'Primary packing (₹)', 'n'], ['adminProd', 'Administrative overheads relating to production (₹)', 'n'],
    ['fgOpen', 'Finished goods: opening stock (₹)', 'n'], ['fgClose', 'Finished goods: closing stock (₹)', 'n'], ['adminOther', 'Other administrative overheads (₹)', 'n'], ['selling', 'Selling and distribution (₹)', 'n'], ['interest', 'Interest and finance charges (₹)', 'n'],
    ['abnormal', 'Abnormal costs kept out of cost — fire, strike, penalties (₹, memo)', 'n'], ['netSales', 'Net sales realisation (₹)', 'n']] },
};
const REGS = Object.keys(SCHEMA);
const KEYF = { stdProd: 'code', staff: 'code', proj: 'code', ship: 'ref', cvp: 'code', abcAct: 'name' };
const REFS = { stdProd: [['stdMat', 'prod'], ['stdLab', 'prod']], staff: [['time', 'staff']], proj: [['time', 'project']], ship: [['shipLine', 'ship']], cvp: [['sales', 'product'], ['special', 'product']] };
const CFG_DEF = { ohRate: 0, adminPct: 0, sellPct: 0, abcBase: 'labHrs', svcOhPct: 0, fixedCost: 0, targetProfit: 0, markupPct: 20, targetMarginPct: 20, ebqDemand: 0, ebqSetup: 0, ebqCarry: 0 };

// ================================================================ engines
function computeStd(co) {
  const rows = co.stdProd.map(p => {
    const Q = num(p.actualOutput);
    const mats = co.stdMat.filter(m => m.prod === p.code).map(m => { const SQ = num(m.sq) * Q, aq = num(m.aq);
      return { m, SQ, std: SQ * num(m.sp), act: aq * num(m.ap), price: (num(m.sp) - num(m.ap)) * aq, usage: (SQ - aq) * num(m.sp), unit: num(m.sq) * num(m.sp) }; });
    const labs = co.stdLab.filter(l => l.prod === p.code).map(l => { const SH = num(l.sh) * Q, ah = num(l.ah), AHw = ah - num(l.idle);
      return { l, SH, AHw, std: SH * num(l.sr), act: ah * num(l.ar), rate: (num(l.sr) - num(l.ar)) * ah, idle: -num(l.idle) * num(l.sr), eff: (SH - AHw) * num(l.sr), unit: num(l.sh) * num(l.sr) }; });
    const SHt = sum(labs, 'SH'), AHw = sum(labs, 'AHw'), r = num(p.vohRate), shU = sum(labs, x => num(x.l.sh));
    const voh = { std: SHt * r, act: num(p.vohActual), exp: AHw * r - num(p.vohActual), eff: (SHt - AHw) * r, unit: shU * r };
    const absRate = div(num(p.fohBudget), num(p.budgetOutput));
    const foh = { std: Q * absRate, act: num(p.fohActual), exp: num(p.fohBudget) - num(p.fohActual), vol: Q * absRate - num(p.fohBudget), unit: absRate };
    const V = { mat: sum(mats, x => x.price + x.usage), lab: sum(labs, x => x.rate + x.idle + x.eff), voh: voh.exp + voh.eff, foh: foh.exp + foh.vol };
    const std = sum(mats, 'std') + sum(labs, 'std') + voh.std + foh.std, act = sum(mats, 'act') + sum(labs, 'act') + voh.act + foh.act;
    const lines = [];
    mats.forEach(x => { lines.push({ kind: 'Material price', what: x.m.item, v: x.price }); lines.push({ kind: 'Material usage', what: x.m.item, v: x.usage }); });
    labs.forEach(x => { lines.push({ kind: 'Labour rate', what: x.l.grade, v: x.rate }); if (num(x.l.idle)) lines.push({ kind: 'Idle time', what: x.l.grade, v: x.idle }); lines.push({ kind: 'Labour efficiency', what: x.l.grade, v: x.eff }); });
    lines.push({ kind: 'Variable overhead expenditure', what: '', v: voh.exp }, { kind: 'Variable overhead efficiency', what: '', v: voh.eff }, { kind: 'Fixed overhead expenditure', what: '', v: foh.exp }, { kind: 'Fixed overhead volume', what: '', v: foh.vol });
    return { p, Q, mats, labs, voh, foh, unit: sum(mats, 'unit') + sum(labs, 'unit') + voh.unit + foh.unit, std, act, V, total: std - act, lines, check: Math.abs((std - act) - (V.mat + V.lab + V.voh + V.foh)) < 1 };
  });
  return { rows, total: sum(rows, 'total'), mat: sum(rows, r => r.V.mat), lab: sum(rows, r => r.V.lab), oh: sum(rows, r => r.V.voh + r.V.foh), std: sum(rows, 'std'), act: sum(rows, 'act') };
}

function computeProc(co) {
  const lines = {};
  co.proc.slice().sort((a, b) => num(a.seq) - num(b.seq)).forEach(p => (lines[p.line || 'Process line'] = lines[p.line || 'Process line'] || []).push(p));
  return Object.entries(lines).map(([line, steps]) => {
    let prev = null;
    const out = steps.map((p, i) => {
      const first = i === 0, I = first ? num(p.inputUnits) : prev.O, TI = first ? 0 : prev.outVal, mat = num(p.material), lab = num(p.labour), oh = num(p.overhead);
      const N = I * num(p.nlPct) / 100, O = num(p.output), W = num(p.wip), c = num(p.wipConv) / 100, sc = num(p.scrap);
      const ab = I - N - O - W, AbL = ab > 1e-9 ? ab : 0, AbG = ab < -1e-9 ? -ab : 0;
      const EUm = O + W + AbL - AbG, EUc = O + W * c + AbL - AbG;
      const poolM = TI + mat - N * sc, poolC = lab + oh;
      const cm = div(poolM, EUm), cc = div(poolC, EUc), cu = cm + cc;
      const r = { p, line, I, TI, mat, lab, oh, N, O, W, c, sc, AbL, AbG, EUm, EUc, poolM, poolC, cm, cc, cu,
        nlVal: N * sc, outVal: O * cu, wipVal: W * cm + W * c * cc, ablVal: AbL * cu, abgVal: AbG * cu, ablNet: AbL * cu - AbL * sc, abgNet: AbG * cu - AbG * sc };
      r.dr = TI + mat + lab + oh + r.abgVal; r.cr = r.nlVal + r.ablVal + r.outVal + r.wipVal; r.ok = Math.abs(r.dr - r.cr) < 1 && EUm > 0;
      prev = r; return r;
    });
    const last = out[out.length - 1];
    return { line, steps: out, finishedUnits: last ? last.O : 0, finishedVal: last ? last.outVal : 0, unitCost: last ? last.cu : 0, abnLoss: sum(out, 'ablNet'), abnGain: sum(out, 'abgNet') };
  });
}

function computeJobs(co) {
  const c = co.cfg;
  const rows = co.jobs.map(j => {
    const labour = num(j.labHrs) * num(j.labRate), prime = num(j.material) + labour + num(j.directExp), worksOH = num(j.machHrs) * num(c.ohRate);
    const works = prime + worksOH, admin = works * num(c.adminPct) / 100, cop = works + admin, sell = cop * num(c.sellPct) / 100, total = cop + sell, price = num(j.price);
    return { j, labour, prime, worksOH, works, admin, cop, sell, total, price, profit: price - total, margin: div(price - total, price), perUnit: div(total, num(j.units)) };
  });
  return { rows, profit: sum(rows, 'profit'), price: sum(rows, 'price'), losers: rows.filter(r => r.price && r.profit < 0) };
}

function computeABC(co) {
  const acts = co.abcAct.map(a => ({ a, rate: div(num(a.pool), num(a.total)), used: sum(co.abcObj, o => num((o.drv || {})[a.name])) }));
  acts.forEach(x => { x.unusedCost = (num(x.a.total) - x.used) * x.rate; });

      <div class="note"><p><strong>Cost what you make.</strong> Standard costing sets the expected cost of each product and explains the gap to actual cost. Process costing follows units and cost through each stage, separating normal loss (built into cost) from abnormal loss (charged to profit and loss). Jobs and batches collect cost per order; services and projects do the same with hours.</p>
      <p><strong>Find the true cost.</strong> Activity-based costing charges support overheads by what causes them, so small, complex orders carry their share. Landed cost adds freight, insurance, customs duty and clearing to what you pay a foreign supplier.</p>
      <p><strong>Decide.</strong> Break-even shows how much you must sell to cover fixed costs. Profitability shows which products, customers and channels make money after discounts, freight and commission. Make-or-buy and special orders compare only the costs that change with the decision. The cost sheet presents cost of production and cost of sales in the Cost Accounting Standards layout used for cost records and cost audit.</p></div></section>`;
}

          <tfoot><tr><td colspan="2">Standard cost per ${esc(r.p.unit)}</td><td class="num">${fmt2(r.unit)}</td></tr></tfoot></table></div></div>
        <div><div class="panel-head" style="padding-top:0"><h3>Variances for the month</h3></div><div class="scroll"><table><thead><tr><th>Variance</th><th>On</th><th class="num">₹</th></tr></thead><tbody>${r.lines.map(x => `<tr><td>${esc(x.kind)}</td><td class="small muted">${esc(x.what)}</td><td class="num">${fa(x.v)}</td></tr>`).join('')}</tbody>
          <tfoot><tr><td colspan="2">Standard cost ₹${fmt(r.std)} less actual ₹${fmt(r.act)}</td><td class="num">${fa(r.total)}</td></tr></tfoot></table></div></div>
      </div></section>`;
  }).join('');
  return `<section class="panel"><div class="panel-head"><h2>Standard cost against actual · ${fmonthL(cur.settings.period)}</h2><span class="sub">F favourable (actual below standard), A adverse</span></div>
    ${S.rows.length ? `<div class="scroll"><table><thead><tr><th>Product</th><th class="num">Actual output</th><th class="num">Standard / unit</th><th class="num">Standard cost of output</th><th class="num">Actual cost</th><th class="num">Material</th><th class="num">Labour</th><th class="num">Overhead</th><th class="num">Total variance</th><th></th></tr></thead><tbody>${sumRows}</tbody>
      <tfoot><tr><td colspan="3">Total</td><td class="num">${fmt(S.std)}</td><td class="num">${fmt(S.act)}</td><td class="num">${fa(S.mat)}</td><td class="num">${fa(S.lab)}</td><td class="num">${fa(S.oh)}</td><td class="num">${fa(S.total)}</td><td></td></tr></tfoot></table></div>`
      : '<div class="empty">Add a product, then its standard materials and labour.</div>'}
    ${S.rows.length ? `<div class="panel-head" style="padding-top:18px"><h3>Where the month's variance came from</h3><span class="sub">All products together</span></div>${varChart([
      { label: 'Material price', v: sum(S.rows, r => sum(r.mats, 'price')) }, { label: 'Material usage', v: sum(S.rows, r => sum(r.mats, 'usage')) },
      { label: 'Labour rate', v: sum(S.rows, r => sum(r.labs, 'rate')) }, { label: 'Idle time', v: sum(S.rows, r => sum(r.labs, 'idle')) }, { label: 'Labour efficiency', v: sum(S.rows, r => sum(r.labs, 'eff')) },
      { label: 'Variable overhead', v: sum(S.rows, r => r.voh.exp + r.voh.eff) }, { label: 'Fixed overhead spending', v: sum(S.rows, r => r.foh.exp) }, { label: 'Fixed overhead volume', v: sum(S.rows, r => r.foh.vol) }])}` : ''}
    <div class="note"><p><strong>Formulas.</strong> Material price = (standard price − actual price) × actual quantity. Material usage = (standard quantity for actual output − actual quantity) × standard price. Labour rate = (standard rate − actual rate) × hours paid. Idle time = idle hours × standard rate (always adverse). Labour efficiency = (standard hours for actual output − hours worked) × standard rate. Variable overhead expenditure = hours worked × standard rate − actual; efficiency = (standard hours − hours worked) × standard rate. Fixed overhead expenditure = budget − actual; volume = absorbed on actual output − budget.</p>

}

function vProc() {
  const P = R.P;
  if (!P.length) return `${regPanel('proc', 'Process steps', '', ['line', 'seq', 'name', 'inputUnits', 'material', 'labour', 'overhead', 'nlPct', 'output'])}`;
  const all = P.flatMap(l => l.steps), sel = all.find(s => cur.proc.indexOf(s.p) === +ui.procStep) || all[0];
  const lines = P.map(l => `<section class="panel"><div class="panel-head"><h2>${esc(l.line)}</h2><span class="sub">${qty(l.finishedUnits)} units finished at ₹${fmt2(l.unitCost)} each · value ₹${fmt(l.finishedVal)}</span></div>
    <div class="flow">${l.steps.map((s, i) => `${i ? '<span class="arrow" aria-hidden="true">▶</span>' : ''}<div class="st"><span class="ls">Step ${esc(s.p.seq)} · ${qty(s.I)} in</span><span class="nm">${esc(s.p.name)}</span><span class="cu">₹${fmt2(s.cu)}</span><span class="ls">per unit · ${qty(s.O)} out${s.W ? ` · ${qty(s.W)} in WIP` : ''}</span><span class="ls">Normal loss ${qty(s.N)}</span>${s.AbL ? `<span class="ls bad">Abnormal loss ${qty(s.AbL)} · ₹${fmt(s.ablNet)}</span>` : s.AbG ? `<span class="ls good">Abnormal gain ${qty(s.AbG)} · ₹${fmt(s.abgNet)}</span>` : '<span class="ls">No abnormal loss</span>'}</div>`).join('')}</div>
    <div class="scroll"><table><thead><tr><th>Step</th><th class="num">Units in</th><th class="num">Normal loss</th><th class="num">Abnormal loss / (gain)</th><th class="num">Units out</th><th class="num">Closing WIP</th><th class="num">Equivalent units: material / conversion</th><th class="num">Cost per equivalent unit: material / conversion</th><th class="num">Cost per unit</th><th class="num">Transferred out ₹</th><th></th></tr></thead>
      <tbody>${l.steps.map(s => `<tr tabindex="0" data-act="proc-sel" data-i="${cur.proc.indexOf(s.p)}"><td><strong>${esc(s.p.name)}</strong><span class="ref">Step ${esc(s.p.seq)}</span></td><td class="num">${qty(s.I)}</td><td class="num">${qty(s.N)}</td>
        <td class="num">${s.AbL ? `<span class="neg">${qty(s.AbL)}</span>` : s.AbG ? `(${qty(s.AbG)})` : '–'}</td><td class="num">${qty(s.O)}</td><td class="num">${s.W ? `${qty(s.W)} at ${pct(s.c, 0)}` : '–'}</td><td class="num">${qty(s.EUm)} / ${qty(s.EUc)}</td><td class="num">${fmt2(s.cm)} / ${fmt2(s.cc)}</td><td class="num"><strong>${fmt2(s.cu)}</strong></td><td class="num">${fmt(s.outVal)}</td><td>${s.ok ? '' : pill('bad', 'Check inputs')}</td></tr>`).join('')}</tbody></table></div></section>`).join('');
  const s = sel, row = (side, t, u, v) => `<tr><td>${side}</td><td>${esc(t)}</td><td class="num">${qty(u)}</td><td class="num">${fmt(v)}</td></tr>`;
  const acct = `<section class="panel"><div class="panel-head"><h2>Process account · ${esc(s.p.name)}</h2><span class="sub">Select a step above to see its account</span></div>
    <div class="scroll"><table><thead><tr><th></th><th>Particulars</th><th class="num">Units</th><th class="num">₹</th></tr></thead><tbody>
      <tr class="grp"><td colspan="4">Debit</td></tr>
      ${s.TI ? row('Dr', 'Transferred in from previous step', s.I, s.TI) : row('Dr', 'Units put in', s.I, 0)}
      ${row('Dr', 'Material added', 0, s.mat)}${row('Dr', 'Labour', 0, s.lab)}${row('Dr', 'Overhead', 0, s.oh)}${s.AbG ? row('Dr', 'Abnormal gain', s.AbG, s.abgVal) : ''}
      <tr class="sub"><td></td><td>Total debit</td><td class="num">${qty(s.I + s.AbG)}</td><td class="num">${fmt(s.dr)}</td></tr>
      <tr class="grp"><td colspan="4">Credit</td></tr>
      ${row('Cr', `Normal loss (scrap at ₹${fmt(s.sc)})`, s.N, s.nlVal)}${s.AbL ? row('Cr', 'Abnormal loss', s.AbL, s.ablVal) : ''}${row('Cr', 'Transferred to next step / finished stock', s.O, s.outVal)}${s.W ? row('Cr', 'Closing work in progress', s.W, s.wipVal) : ''}
      <tr class="sub"><td></td><td>Total credit</td><td class="num">${qty(s.N + s.AbL + s.O + s.W)}</td><td class="num">${fmt(s.cr)}</td></tr></tbody></table></div>
    <div class="note">${s.AbL ? `<p>Abnormal loss account: ₹${fmt(s.ablVal)} debited, less scrap sold ₹${fmt(s.AbL * s.sc)}, leaves ₹${fmt(s.ablNet)} for the costing profit and loss.</p>` : ''}${s.AbG ? `<p>Abnormal gain account: ₹${fmt(s.abgVal)} credited, less scrap value given up on those units ₹${fmt(s.AbG * s.sc)}, leaves ₹${fmt(s.abgNet)} for the costing profit and loss.</p>` : ''}
      <p>Losses are taken at the end of the step, so lost units carry full cost. Normal loss is spread over good output (its scrap value reduces cost); abnormal loss and gain are valued at the same cost per unit as good output and kept out of product cost. Work in progress is valued by equivalent units: material 100% complete, labour and overhead at the % entered (weighted average, no opening WIP).</p></div></section>`;
  return `${lines}${acct}${regPanel('proc', 'Process steps', 'Steps run in order of step number within each line', ['line', 'seq', 'name', 'inputUnits', 'material', 'labour', 'overhead', 'nlPct', 'scrap', 'output', 'wip', 'wipConv'])}`;
}

function cvpChart(C) {
  if (C.be == null || !C.S) return '';
  const W = 640, H = 270, l = 70, r = 20, t = 14, b = 36, xm = Math.max(C.S, C.be, C.target || 0) * 1.15, ym = xm;
  const X = v => l + v / xm * (W - l - r), Y = v => H - b - v / ym * (H - t - b);
  const tc = x => C.F + (1 - C.pv) * x;
  const ticks = [0, .25, .5, .75, 1].map(f => f * xm);
  const lab = v => !v ? '0' : v >= 1e7 ? (v / 1e7).toFixed(1) + ' cr' : v >= 1e5 ? (v / 1e5).toFixed(0) + ' L' : fmt(v);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Break-even chart: sales and total cost lines cross at ₹${fmt(C.be)}">
    ${ticks.map(v => `<line class="ax" x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="lbl" x="${l - 6}" y="${Y(v) + 4}" text-anchor="end">${lab(v)}</text><text class="lbl" x="${X(v)}" y="${H - b + 16}" text-anchor="middle">${lab(v)}</text>`).join('')}
    <text class="lbl" x="${(l + W - r) / 2}" y="${H - 4}" text-anchor="middle">Sales value (₹)</text>
    <polygon class="loss" points="${X(0)},${Y(0)} ${X(0)},${Y(tc(0))} ${X(C.be)},${Y(C.be)}"/><polygon class="prof" points="${X(C.be)},${Y(C.be)} ${X(xm)},${Y(ym)} ${X(xm)},${Y(Math.min(ym, tc(xm)))}"/>
    <line class="s3" x1="${X(0)}" y1="${Y(C.F)}" x2="${X(xm)}" y2="${Y(C.F)}" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
    <line class="s2" x1="${X(0)}" y1="${Y(tc(0))}" x2="${X(xm)}" y2="${Y(Math.min(ym, tc(xm)))}" stroke-width="2.5" fill="none"/>
    <line class="s1" x1="${X(0)}" y1="${Y(0)}" x2="${X(xm)}" y2="${Y(ym)}" stroke-width="2.5" fill="none"/>
    <line class="ax" x1="${X(C.S)}" x2="${X(C.S)}" y1="${t}" y2="${H - b}" stroke-dasharray="2 3"/><text class="lbl" x="${X(C.S) + 4}" y="${t + 10}">Budget</text>
    <circle class="pt" cx="${X(C.be)}" cy="${Y(C.be)}" r="5"/><text class="lbl" x="${X(C.be) + 8}" y="${Y(C.be) + 16}">Break-even ₹${lab(C.be)}</text></svg></div>
    <div class="legend"><span class="l1">Sales</span><span class="l2">Total cost</span><span class="l3">Fixed cost</span><span class="nl">Red area: loss · green area: profit</span></div>`;
}

        <div class="strong">Break-even sales = fixed costs ÷ P/V ratio</div><div class="num strong">${C.be != null ? fmt(C.be) : '–'}</div><div>Margin of safety (budget − break-even)</div><div class="num">${C.be != null ? `${fmt(C.S - C.be)} · ${pct(C.mos)}` : '–'}</div>
        <div>Sales needed for target profit ₹${fmt(C.T)}</div><div class="num">${C.target != null ? fmt(C.target) : '–'}</div><div>Operating leverage (contribution ÷ profit)</div><div class="num">${C.dol ? C.dol.toFixed(2) + '×' : '–'}</div></div>

      <div class="note"><p>Contribution = sales − variable costs. P/V ratio = contribution ÷ sales. Break-even assumes the budgeted sales mix holds; a shift toward low-P/V products raises it. Operating leverage shows how much profit moves for a 1% change in sales.</p></div></section></div>` : ''}`;
}

function vProf() {
  const PR = R.PR, dim = ui.profDim, g = PR.by(dim), mx = Math.max(1, ...g.map(e => Math.abs(e.contrib)));
  const seg = `<div class="actions" role="group" aria-label="View by">${[['customer', 'Customer'], ['product', 'Product'], ['channel', 'Channel']].map(([k, l]) => `<button type="button" class="sm${dim === k ? ' primary' : ''}" data-act="prof-dim" data-v="${k}">${l}</button>`).join('')}</div>`;
  const body = g.map(e => `<tr><td><strong>${esc(e.k)}</strong><span class="ref">${e.n} invoice${e.n > 1 ? 's' : ''}</span></td><td class="num">${qty(e.qty)}</td><td class="num">${fmt(e.net)}${e.disc ? `<span class="ref">after ₹${fmt(e.disc)} discount</span>` : ''}</td><td class="num">${fmt(e.vc)}</td><td class="num">${fmt(e.cts)}</td>
    <td class="num"><strong>${money(e.contrib)}</strong></td><td>${e.contrib < 0 ? pill('bad', pct(e.cm)) : e.cm < .1 ? pill('warn', pct(e.cm)) : pill('ok', pct(e.cm))}</td><td>${bar(e.contrib, mx)}</td></tr>`).join('');
  let cum = 0; const tot = Math.max(1, PR.contrib);
  const whale = dim === 'customer' && g.length > 2 ? `<p>Cumulative contribution by customer: ${g.map(e => { cum += e.contrib; return `${esc(e.k)} ${pct(cum / tot, 0)}`; }).join(' → ')}. Customers that take the line back down cost more to serve than they bring in.</p>` : '';
  return `<section class="panel"><div class="panel-head"><h2>Profitability by ${dim} · ${fmonthL(cur.settings.period)}</h2>${seg}</div>
    ${body ? `<div class="scroll"><table><thead><tr><th>${dim[0].toUpperCase() + dim.slice(1)}</th><th class="num">Quantity</th><th class="num">Net sales</th><th class="num">Variable product cost</th><th class="num">Cost to serve</th><th class="num">Contribution</th><th>Margin</th><th>Contribution</th></tr></thead><tbody>${body}</tbody>
      <tfoot><tr><td>Total</td><td></td><td class="num">${fmt(PR.net)}</td><td class="num">${fmt(sum(g, 'vc'))}</td><td class="num">${fmt(sum(g, 'cts'))}</td><td class="num">${money(PR.contrib)}</td><td>${pct(div(PR.contrib, PR.net))}</td><td></td></tr></tfoot></table></div>` : '<div class="empty">Add sales invoices with product, customer and channel. Product variable costs come from the Break-even tab.</div>'}
    <div class="note"><p>Net sales = quantity × rate − discounts. Variable product cost = quantity × variable cost per unit from the Break-even tab. Cost to serve = outward freight + commission or channel fee. Contribution is what is left to pay fixed costs; a customer or channel below zero loses money on every sale.</p>${whale}${PR.unknown ? `<p class="neg">${PR.unknown} invoice${PR.unknown > 1 ? 's use' : ' uses'} a product code that is not on the Break-even tab, so product cost is zero there.</p>` : ''}</div></section>
    ${regPanel('sales', 'Sales invoices', '', ['inv', 'date', 'customer', 'channel', 'product', 'qty', 'rate', 'discount', 'freight', 'commPct'])}`;
}

function vDec() {
  const D = R.D, c = cur.cfg;
  const mob = D.mob.map(m => `<tr tabindex="0" data-act="edit" data-reg="mob" data-i="${cur.mob.indexOf(m.d)}"><td><strong>${esc(m.d.name)}</strong><span class="ref">${qty(m.q)} ${esc(m.d.unit || 'units')}</span></td><td class="num">${fmt2(m.varU)}</td><td class="num">${fmt(num(m.d.avoidFixed))}</td><td class="num">${fmt(num(m.d.oppCost))}</td>
    <td class="num">${fmt(m.make)}</td><td class="num">${fmt2(m.buyU)}</td><td class="num">${fmt(m.buy)}</td><td>${pill(m.rec === 'Make' ? 'ok' : m.rec === 'Buy' ? 'warn' : 'idle', m.rec === 'Either' ? 'No difference' : `${m.rec} · saves ₹${fmt(Math.abs(m.diff))}`)}</td><td class="num">${m.ind != null ? qty(Math.round(m.ind)) : '–'}</td></tr>`).join('');
  const pr = D.pricing.map(x => `<tr><td><strong>${esc(x.r.p.code)}</strong><span class="ref">${esc(x.r.p.name)}</span></td><td class="num">${fmt(x.min)}</td><td class="num">${fmt(x.full)}</td><td class="num">${fmt(x.costPlus)}</td><td class="num">${x.marginPrice != null ? fmt(x.marginPrice) : '–'}</td><td class="num">${fmt(x.price)}</td>
    <td>${x.price < x.full ? pill('bad', `${pct(x.actualMarkup)} on cost`) : x.price < x.costPlus ? pill('warn', `${pct(x.actualMarkup)} on cost`) : pill('ok', `${pct(x.actualMarkup)} on cost`)}</td></tr>`).join('');
  const sp = D.special.map(o => `<tr tabindex="0" data-act="edit" data-reg="special" data-i="${cur.special.indexOf(o.o)}"><td><strong>${esc(o.o.customer)}</strong><span class="ref">${qty(o.q)} × ${esc(o.r ? o.r.p.code : o.o.product)} at ₹${fmt(num(o.o.price))}</span></td><td class="num">${fmt(o.vc)}</td><td class="num">${qty(o.spare)}</td>
    <td class="num">${money(o.extraContrib)}</td><td class="num">${o.displaced ? `(${fmt(o.displaced)})<span class="ref">${qty(o.short)} units of regular sales lost</span>` : '–'}</td><td class="num"><strong>${money(o.net)}</strong></td><td class="num">${fmt(o.minPrice)}</td><td>${pill(o.rec === 'Accept' ? 'ok' : 'bad', o.rec)}</td></tr>`).join('');
  return `<section class="panel"><div class="panel-head"><h2>Make or buy</h2><button type="button" class="sm primary" data-act="add" data-reg="mob">Add decision</button></div>
    ${mob ? `<div class="scroll"><table><thead><tr><th>Component</th><th class="num">Make: variable / unit</th><th class="num">Fixed cost saved if bought</th><th class="num">Contribution given up</th><th class="num">Cost to make</th><th class="num">Buy: price / unit</th><th class="num">Cost to buy</th><th>Cheaper option</th><th class="num">Quantity where equal</th></tr></thead><tbody>${mob}</tbody></table></div>` : '<div class="empty">Add a component you could make or buy.</div>'}
    <div class="note"><p>Only costs that change with the decision count. Cost to make = quantity × variable cost + fixed costs that stop if you buy + contribution lost on work the capacity could otherwise do. Allocated overheads that continue either way are left out. Below the "quantity where equal", buying is cheaper; above it, making is cheaper. Also weigh quality, supplier reliability and lead time.</p></div></section>
    <section class="panel"><div class="panel-head"><h2>Pricing support</h2><span class="sub">Products and fixed costs from the Break-even tab</span></div>

function editRow(reg, i, init) {

      const o = {}; Object.entries(v).forEach(([k, x]) => { if (!k.startsWith('drv:')) o[k] = x; });
      if (reg === 'abcObj') { o.drv = {}; Object.entries(v).forEach(([k, x]) => { if (k.startsWith('drv:') && x !== '') o.drv[k.slice(4)] = x; }); }
      if (!isNew && kf && row[kf] !== o[kf]) { (REFS[reg] || []).forEach(([r2, f2]) => cur[r2].forEach(x => { if (x[f2] === row[kf]) x[f2] = o[kf]; })); if (reg === 'abcAct') cur.abcObj.forEach(x => { if (x.drv && row.name in x.drv) { x.drv[o.name] = x.drv[row.name]; delete x.drv[row.name]; } }); }

.lk-sw { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(170px, 100%), 1fr)); gap: 8px; }
.lk-sw button { text-align: left; display: grid; gap: 6px; padding: 10px; }
.lk-sw button[aria-pressed="true"] { border-color: var(--lk-accent); box-shadow: 0 0 0 2px var(--lk-accent); }
.lk-bar { display: flex; height: 22px; border-radius: 5px; overflow: hidden; border: 1px solid var(--lk-line); } .lk-bar span { flex: 1; }
.lk-nm { font-weight: 600; } .lk-ds { font-size: 12px; color: var(--lk-muted); }
.lk-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 12px; align-items: end; }
.lk label { display: grid; gap: 4px; font-size: 12px; color: var(--lk-muted); font-weight: 500; }
.lk input, .lk select { font: inherit; color: var(--lk-fg); background: var(--lk-surface); border: 1px solid var(--lk-line); border-radius: 7px; padding: 6px 8px; width: 100%; min-width: 0; }
.lk input[type="color"] { height: 36px; padding: 3px; cursor: pointer; }
.lk-seg { display: flex; flex-wrap: wrap; gap: 6px; } .lk-seg button[aria-pressed="true"] { background: var(--lk-accent); color: var(--lk-ink); border-color: var(--lk-accent); font-weight: 600; }
.lk-chips { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; } .lk-chip { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--lk-line); }
.lk-chip.ok { color: #15803D; border-color: #15803D; } .lk-chip.no { color: #B91C1C; border-color: #B91C1C; }
.lk-saved { display: flex; flex-wrap: wrap; gap: 6px; } .lk-saved span { display: inline-flex; gap: 4px; align-items: center; border: 1px solid var(--lk-line); border-radius: 999px; padding: 2px 3px 2px 9px; font-size: 12px; }
.lk-saved i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; border: 1px solid var(--lk-line); }
.lk-note { font-size: 12px; color: var(--lk-muted); margin: 0; max-width: 90ch; }
.lk-sec { border-top: 1px solid var(--lk-line); padding-top: 14px; display: grid; gap: 10px; }
@media (max-width: 560px) { .lk-in { padding: 14px; } }

  document.head.appendChild(css);
  const dlg = document.createElement('dialog'); dlg.className = 'lk'; dlg.setAttribute('aria-label', 'Look and feel'); document.body.appendChild(dlg);
  function dlgVars() {
    const P = base(comboOf() || CFG.own, isDark());
    Object.entries({ bg: P.surface, surface: P.dark ? P.sunk : P.bg, fg: P.fg, muted: P.muted, line: P.line, accent: P.accent, ink: P.accentInk }).forEach(([k, v]) => dlg.style.setProperty('--lk-' + k, v));
  }
  const code = () => btoa(unescape(encodeURIComponent(JSON.stringify({ p: L.preset === 'own' ? 'own' : L.preset, c: L.custom, m: L.mode, d: L.density, f: L.font, s: L.skin }))));
  function draw() {
    dlgVars();
    const card = (k, n, d, c) => { const cc = c || CFG.own, a = base(cc, false), b = base(cc, true), bar = [a.accent, a.accent2, a.sunk, b.accent, b.surface];
      return `<button type="button" data-lk="preset" data-v="${k}" aria-pressed="${L.preset === k}"><span class="lk-bar">${bar.map(x => `<span style="background:${x}"></span>`).join('')}</span><span class="lk-nm">${esc(n)}</span><span class="lk-ds">${esc(d)}</span></button>`; };
    const seg = (key, opts) => `<div class="lk-seg">${opts.map(([v, l]) => `<button type="button" data-lk="set" data-k="${key}" data-v="${v}" aria-pressed="${L[key] === v}">${esc(l)}</button>`).join('')}</div>`;
    const c = comboOf() || CFG.own, A = base(c, false), B = base(c, true);
    const ck = (x, y, lbl) => { const r = contrast(x, y); return `<span class="lk-chip ${r >= 4.5 ? 'ok' : 'no'}">${esc(lbl)} ${r.toFixed(1)}:1</span>`; };
    dlg.innerHTML = `<div class="lk-in">
      <div class="lk-head"><h2>Look &amp; feel · ${esc(CFG.name)}</h2><div class="lk-seg"><button type="button" data-lk="reset">Back to the tool's own look</button><button type="button" class="lk-p" data-lk="close">Done</button></div></div>
      ${CFG.colours === false ? `<p class="lk-note">${esc(CFG.colourNote || '')}</p>` : `<div class="lk-sec" style="border:0;padding:0"><h3>Colour combination</h3>
        <div class="lk-sw">${card('own', CFG.ownName, CFG.ownDesc, null)}${PRESETS.map(p => card(p.k, p.n, p.d, p)).join('')}${card('custom', 'My colours', 'Your own three colours, set below.', L.custom)}</div></div>
      <div class="lk-sec"><h3>Custom combination</h3>
        <div class="lk-row"><label>Main colour (buttons, headings, tabs)<input type="color" data-lkc="accent" value="${L.custom.accent.toLowerCase()}"></label>
          <label>Highlight colour (chips, labels)<input type="color" data-lkc="accent2" value="${L.custom.accent2.toLowerCase()}"></label>
          <label>Page tint (backgrounds, lines)<input type="color" data-lkc="tint" value="${L.custom.tint.toLowerCase()}"></label></div>
        <div class="lk-chips">${ck(A.accent, A.surface, 'Main on light')}${ck(A.accentInk, A.accent, 'Button text')}${ck(B.accent, B.surface, 'Main on dark')}${ck(A.accent2, A.surface, 'Highlight on light')}</div>
        <div class="lk-row"><label>Name this combination<input type="text" id="lk-name" maxlength="30" placeholder="e.g. Firm colours"></label><button type="button" class="lk-p" data-lk="savec">Save combination</button></div>
        ${L.saved.length ? `<div class="lk-saved">${L.saved.map((x, i) => `<span><i style="background:${x.accent}"></i><i style="background:${x.accent2}"></i><button type="button" data-lk="use" data-v="${i}" style="border:0;padding:2px 4px;text-decoration:underline">${esc(x.name)}</button><button type="button" data-lk="del" data-v="${i}" aria-label="Remove ${esc(x.name)}" style="padding:1px 6px">✕</button></span>`).join('')}</div>` : ''}
        <p class="lk-note">Any colours work: they are darkened or lightened just enough to stay readable, and a matching dark version is built. Status colours (green, amber, red) never change.</p></div>`}
      <div class="lk-sec"><h3>Display</h3><div class="lk-row">
        <label>Light or dark${seg('mode', [['system', 'Follow device'], ['light', 'Light'], ['dark', 'Dark']])}</label>
        <label>Shapes${seg('skin', [['society', 'Society Desk style'], ['own', "Tool's own style"]])}</label>
        <label>Table spacing${seg('density', [['comfortable', 'Comfortable'], ['compact', 'Compact']])}</label>
        <label>Type<select data-lkf="1">${Object.entries(FONTS).map(([k, f]) => `<option value="${k}"${L.font === k ? ' selected' : ''}>${esc(f.n)}</option>`).join('')}</select></label></div></div>
      <div class="lk-sec"><h3>Use the same look in your other tools</h3>
        <div class="lk-row"><label>Look code of this tool<input type="text" readonly id="lk-code" value="${esc(code())}"></label><button type="button" data-lk="copy">Copy look code</button></div>
        <div class="lk-row"><label>Paste a look code from another tool<input type="text" id="lk-paste" placeholder="Paste here"></label><button type="button" data-lk="paste">Apply code</button></div>
        <p class="lk-note">Each tool remembers its look in this browser. Copy the code here and paste it in the Look &amp; feel panel of any other Finance Model tool to match them.</p></div></div>`;
  }
  let tmr;
  dlg.addEventListener('click', e => { const b = e.target.closest('[data-lk]'); if (!b) { if (e.target === dlg) dlg.close(); return; } const a = b.dataset.lk;
    if (a === 'close') { dlg.close(); return; }
    if (a === 'preset') L.preset = b.dataset.v;
    if (a === 'set') L[b.dataset.k] = b.dataset.v;
    if (a === 'reset') { const keep = L.saved; L = { ...JSON.parse(JSON.stringify(DEF)), saved: keep }; }
    if (a === 'savec') { const nm = (dlg.querySelector('#lk-name').value || '').trim(); if (!nm) { dlg.querySelector('#lk-name').focus(); return; } L.saved = [...L.saved.filter(x => x.name !== nm), { name: nm, ...L.custom }].slice(-8); }
    if (a === 'use') { const x = L.saved[+b.dataset.v]; L.custom = { accent: x.accent, accent2: x.accent2, tint: x.tint }; L.preset = 'custom'; }
    if (a === 'del') L.saved.splice(+b.dataset.v, 1);
    if (a === 'copy') { const el = dlg.querySelector('#lk-code'); try { navigator.clipboard.writeText(el.value).then(() => { b.textContent = 'Copied'; }, () => { el.select(); b.textContent = 'Press Ctrl+C'; }); } catch { el.select(); } return; }
    if (a === 'paste') { try { const v = JSON.parse(decodeURIComponent(escape(atob(dlg.querySelector('#lk-paste').value.trim())))); L = { ...L, preset: v.p === 'own' ? 'own' : v.p, custom: v.c || L.custom, mode: v.m || L.mode, density: v.d || L.density, font: v.f || L.font, skin: v.s || L.skin }; }
      catch { dlg.querySelector('#lk-paste').value = ''; dlg.querySelector('#lk-paste').placeholder = 'That is not a look code — copy it again'; return; } }
    save(); apply(); draw(); });
  dlg.addEventListener('input', e => { const k = e.target.dataset.lkc; if (!k) return; L.custom[k] = e.target.value.toUpperCase(); L.preset = 'custom'; apply(); clearTimeout(tmr); tmr = setTimeout(save, 300); });
  dlg.addEventListener('change', e => { if (e.target.dataset.lkc) { save(); draw(); } if (e.target.dataset.lkf) { L.font = e.target.value; save(); apply(); draw(); } });
  function open() { draw(); if (!dlg.open) dlg.showModal(); }
  function addButton() {
    if (document.getElementById('lk-open')) return;
    const host = document.querySelector(CFG.host);
    const b = document.createElement('button'); b.type = 'button'; b.id = 'lk-open'; b.textContent = 'Look & feel'; if (CFG.btnClass) b.className = CFG.btnClass;
    b.addEventListener('click', open);
    if (host) host.appendChild(b); else { b.style.cssText = 'position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20'; document.body.appendChild(b); }
  }
  apply(); addButton();
  window.lookFeel = { open, apply };
})();
