<style>
/* Layout: compliance desk — the same ledger family as the Depreciation Workbench: settings strip, four status totals, tabbed registers over one engine. */
:root {
  --bg: #F6F7FA; --surface: #FFFFFF; --sunk: #EEF1F6; --line: #D9DEE8; --fg: #1A2233; --muted: #5B6578;
  --navy: #1F3864; --navy-ink: #FFFFFF; --teal: #0F766E; --focus: #2F6FED;
  --good: #15803D; --good-bg: #DCFCE7; --warn: #B45309; --warn-bg: #FEF3C7; --bad: #B91C1C; --bad-bg: #FEE2E2;
  --f-display: "IBM Plex Serif", Georgia, serif; --f-body: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; --f-num: "IBM Plex Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1420; --surface: #161E2E; --sunk: #1C2638; --line: #2B3750; --fg: #E5E9F1; --muted: #9AA5BA;
  --navy: #8EA9DB; --navy-ink: #0E1420; --teal: #3CC2B2; --focus: #7AA2FF;
  --good: #4ADE80; --good-bg: #12301F; --warn: #F5B451; --warn-bg: #3A2A10; --bad: #F87171; --bad-bg: #3B1717; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1420; --surface: #161E2E; --sunk: #1C2638; --line: #2B3750; --fg: #E5E9F1; --muted: #9AA5BA;
  --navy: #8EA9DB; --navy-ink: #0E1420; --teal: #3CC2B2; --focus: #7AA2FF;
  --good: #4ADE80; --good-bg: #12301F; --warn: #F5B451; --warn-bg: #3A2A10; --bad: #F87171; --bad-bg: #3B1717; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.45; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
.wrap { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.wrap > *, .grid-2 > * { min-width: 0; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; }
h1 { font-size: 1.6rem; color: var(--navy); }
h2 { font-size: 1.1rem; }
h3 { font-size: .98rem; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.mono { font-family: var(--f-num); font-size: 12.5px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; }
button:hover { border-color: var(--navy); }
button.primary { background: var(--navy); color: var(--navy-ink); border-color: var(--navy); font-weight: 600; }
button.danger { color: var(--bad); border-color: var(--bad); }
button.link { border: 0; background: none; padding: 0; color: var(--navy); text-decoration: underline; text-underline-offset: 2px; }
button.sm { padding: 4px 9px; font-size: 12px; }
button:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .tab:focus-visible, tr[tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; min-width: 0; }
input[type="checkbox"] { width: auto; }
label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; }
label.check { display: flex; align-items: center; gap: 8px; color: var(--fg); font-size: 13px; }

header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
.title-block { display: grid; gap: 4px; }
.title-block .sub { color: var(--muted); font-size: 13px; max-width: 70ch; }
.company { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.company label { min-width: min(200px, 100%); }
.save-state { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--good); } .dot.warn { background: var(--warn); }

.banner { background: var(--warn-bg); color: var(--fg); border: 1px solid var(--warn); border-radius: 8px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.banner strong { color: var(--warn); }
.lawbar { background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.lawbar .muted { font-size: 12px; }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree { padding: 4px 16px 16px; }
.tree ul { padding-left: 20px; margin-left: 14px; border-left: 1px dashed var(--line); }
.tree li { padding-top: 8px; }
.node { display: inline-flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--surface); max-width: 100%; }
.node.here { border-color: var(--navy); box-shadow: 0 0 0 1px var(--navy); }
.node .nm { font-weight: 600; }
a.btn { display: inline-flex; align-items: center; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); padding: 4px 9px; font-size: 12px; color: var(--fg); text-decoration: none; }
a.btn:hover { border-color: var(--navy); }
textarea { font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; resize: vertical; }
.bulk { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 16px 12px; }
.chg-old { color: var(--muted); text-decoration: line-through; }
td.mono { white-space: nowrap; }

.settings { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; align-items: end; }

.totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tot { background: var(--surface); padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.tot .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.tot .v { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 1.35rem; font-weight: 500; }
.tot .n { font-size: 12px; color: var(--muted); }
.tot.lead .v { color: var(--navy); }
.tot.bad .v { color: var(--bad); } .tot.warn .v { color: var(--warn); } .tot.good .v { color: var(--good); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 9px 12px; color: var(--muted); font-weight: 500; }
.tab[aria-selected="true"] { color: var(--navy); border-bottom-color: var(--navy); font-weight: 600; }
.tab .cnt { font-size: 11px; font-weight: 600; margin-left: 5px; padding: 1px 6px; border-radius: 999px; background: var(--bad-bg); color: var(--bad); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; border: 1px solid transparent; white-space: nowrap; }
.pill.ok { background: var(--good-bg); color: var(--good); border-color: var(--good); }
.pill.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.pill.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.pill.idle { background: var(--sunk); color: var(--muted); border-color: var(--line); }
.chip { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 4px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.teal { color: var(--teal); background: color-mix(in srgb, var(--teal) 14%, transparent); }
.chip.warn { color: var(--warn); background: var(--warn-bg); }
.chip.bad { color: var(--bad); background: var(--bad-bg); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.panel-head { padding: 14px 16px 8px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.panel-head .sub { color: var(--muted); font-size: 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 12px; align-items: end; }
.filters label { min-width: 150px; flex: 0 1 200px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: var(--sunk); white-space: nowrap; }
th.num { text-align: right; }
td .sec { font-weight: 600; } td .ref { display: block; font-size: 11px; color: var(--muted); }
tbody tr[tabindex] { cursor: pointer; }
tbody tr[tabindex]:hover td { background: var(--sunk); }
tfoot td { font-weight: 600; border-top: 2px solid var(--fg); border-bottom: 0; }
tr.grp td { background: var(--sunk); font-weight: 600; font-size: 12px; }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.note { padding: 10px 16px 14px; color: var(--muted); font-size: 12px; max-width: 95ch; }
.note p { margin: 0 0 6px; }
.issues { margin: 0; padding: 0 16px 12px 32px; color: var(--bad); font-size: 13px; }

.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 18px; }
.runbox { padding: 4px 16px 16px; display: grid; gap: 12px; }
.runbox .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.runbox .row label { min-width: 170px; }
.steps { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; display: grid; gap: 4px; }
.todo { list-style: none; margin: 0; padding: 0 16px 14px; display: grid; gap: 0; }
.todo li { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: center; }
.todo li:last-child { border-bottom: 0; }
.todo .d { font-family: var(--f-num); font-size: 12px; color: var(--muted); }
.kv { display: grid; grid-template-columns: 1fr auto; max-width: 640px; }
.kv div { padding: 8px 16px; border-bottom: 1px solid var(--line); }
.kv .strong { font-weight: 600; }
.kv .num { text-align: right; }
.form-inline { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 12px; padding: 4px 16px 16px; align-items: end; }

dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 40px); background: var(--surface); color: var(--fg); }
dialog::backdrop { background: rgb(10 15 25 / .45); }
.form { padding: 18px; display: grid; gap: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.grid2 .full { grid-column: 1 / -1; }
.form-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.err { color: var(--bad); font-size: 12px; min-height: 1em; }
.hint { font-size: 11px; color: var(--muted); font-weight: 400; }
pre.sheet { background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-family: var(--f-num); font-size: 12px; white-space: pre-wrap; margin: 0; max-height: 46vh; overflow: auto; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 13px; max-width: min(420px, calc(100vw - 32px)); z-index: 10; }
@media (prefers-reduced-motion: no-preference) { .tab, button { transition: border-color .15s, background .15s; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="title-block">
      <h1>TDS &amp; TCS Compliance Desk</h1>
      <div class="sub">Deduction, deposit, returns, Form 168 (26AS) reconciliation and advance tax under the Income-tax Act, 1961 (up to March 2026) and the Income-tax Act, 2025 (from April 2026). Amounts in ₹.</div>
    </div>
    <div class="company">
      <label for="company">Company<select id="company"></select></label>
      <button id="edit-company" type="button">Company details</button>
      <button id="new-company" type="button">New company</button>
      <div class="save-state" id="save-state"><span class="dot"></span><span>Loading…</span></div>
    </div>
  </header>

  <div class="banner" id="sample-banner" hidden></div>
  <div class="lawbar" id="law-bar"></div>

  <section class="settings" aria-label="Deductor details">
    <label for="s-name">Deductor name<input id="s-name" type="text"></label>
    <label for="s-tan">TAN<input id="s-tan" type="text" maxlength="10" autocomplete="off"></label>
    <label for="s-pan">PAN<input id="s-pan" type="text" maxlength="10" autocomplete="off"></label>
    <label for="s-fy">Year and law<select id="s-fy"></select></label>
    <label for="s-tol">Reco tolerance (₹)<input id="s-tol" type="number" min="0" step="1"></label>
    <label class="check" for="s-10cr"><input id="s-10cr" type="checkbox"> Turnover above ₹10 crore last year (194Q applies)</label>
  </section>

  <section class="totals" id="totals" aria-label="Year status"></section>

  <div class="toolbar">
    <div class="tabs" role="tablist" aria-label="Registers">
      <button class="tab" role="tab" data-tab="desk">Desk</button>
      <button class="tab" role="tab" data-tab="group">Group</button>
      <button class="tab" role="tab" data-tab="tx">Transactions</button>
      <button class="tab" role="tab" data-tab="parties">Parties</button>
      <button class="tab" role="tab" data-tab="rates">Rate master</button>
      <button class="tab" role="tab" data-tab="challans">Challans</button>
      <button class="tab" role="tab" data-tab="returns">Returns</button>
      <button class="tab" role="tab" data-tab="certs">Certificates</button>
      <button class="tab" role="tab" data-tab="corr">Corrections</button>
      <button class="tab" role="tab" data-tab="reco">Reconciliation</button>
      <button class="tab" role="tab" data-tab="audit">Audit</button>
      <button class="tab" role="tab" data-tab="adv">Advance tax</button>
      <button class="tab" role="tab" data-tab="cal">Calendar</button>
      <button class="tab" role="tab" data-tab="filing">Portal &amp; filing</button>
    </div>
    <div class="actions">
      <span id="check-pill"></span>
      <button id="import-btn" type="button">Import Excel / CSV</button>
      <input id="import-file" type="file" accept=".xlsx,.xls,.csv" hidden>
      <input id="cert-file" type="file" accept=".pdf,.zip" multiple hidden>
      <button id="export" type="button">Download Excel</button>
    </div>
  </div>

  <main id="view"></main>
</div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <form class="form" id="dlg-form" novalidate>
    <h2 id="dlg-title">Edit</h2>
    <div id="dlg-top"></div>
    <div class="grid2" id="dlg-body"></div>
    <div id="dlg-extra"></div>
    <div class="err" id="dlg-err" role="alert"></div>
    <div class="form-foot">
      <div class="actions"><button type="button" id="dlg-del" class="danger" hidden>Delete</button><button type="button" id="dlg-del2" class="danger" hidden>Confirm delete</button></div>
      <div class="actions"><button type="button" id="dlg-cancel">Cancel</button><button type="submit" class="primary" id="dlg-save">Save</button></div>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" hidden></div>

  }).sort((a, b) => (a.c.month + a.c.sec < b.c.month + b.c.sec ? -1 : 1));
  const notRun = {};
  own.filter(o => !o.ch).forEach(o => { const g = notRun[o.chKey] || (notRun[o.chKey] = { key: o.chKey, month: o.month, kind: o.r.kind, sec: o.r.k, head: o.head, form: o.form, due: o.due, amount: 0, rows: 0 }); g.amount += o.booked; g.rows++; });

  // ---- quarterly returns
  const returns = [];
  for (let q = 1; q <= 4; q++) for (const form of ['138', '140', '144', '143']) {
    const rs = rows.filter(o => OWN(o.role) && o.form === form && o.q === q && o.inFY && (o.booked > 0 || ['A', 'B', 'T', 'C'].includes(o.reason)));
    const rec = (co.returns || {})[`${fy.Y}|${q}|${form}`] || {};
    const tax = form === '138' ? (+rec.salaryTds || 0) : rs.reduce((a, o) => a + o.booked, 0);
    const due = retDue(fy.Y, q, form), filed = rec.filedOn || '';
    const late = filed ? Math.max(0, day(filed) - day(due)) : Math.max(0, day(TODAY) - day(due));
    const fee = Math.min(late * 200, tax);
    const deposited = rs.filter(o => o.paidOn).reduce((a, o) => a + Math.round(o.booked * (o.depRatio ?? 1)), 0);
    const st = filed ? (filed > due ? 'late' : 'ontime') : TODAY > due ? 'overdue' : (daysTo(due) <= 45 ? 'due' : 'future');
    if (rs.length || rec.filedOn || form === '140' || (form === '138' && s.employees !== false)) returns.push({ q, form, rows: rs, rec, tax, due, filed, late, fee, deposited, st, gross: rs.reduce((a, o) => a + o.amt, 0) });
  }

  // ---- reconciliation: our deductions (books → challan → return)
  const recoOwn = {};
  own.forEach(o => {
    const k = `${o.p.code}|${o.q}|${o.r.k}`;
    const g = recoOwn[k] || (recoOwn[k] = { p: o.p, q: o.q, r: o.r, form: o.form, gross: 0, tax: 0, dep: 0, rows: [] });
    g.gross += o.amt; g.tax += o.booked; g.dep += o.paidOn ? Math.round(o.booked * (o.depRatio ?? 1)) : 0; g.rows.push(o);
  });
  const recoOwnRows = Object.values(recoOwn).map(g => {
    const ret = returns.find(x => x.q === g.q && x.form === g.form);
    g.filed = ret && ret.filed ? g.tax : 0; g.retDue = retDue(fy.Y, g.q, g.form);
    g.st = g.dep < g.tax - TOL ? (g.rows.some(o => o.shortDep || o.depStatus === 'overdue' || o.depStatus === 'notrun-over') ? 'notdep' : 'pending') : !g.filed ? (TODAY > g.retDue ? 'notfiled' : 'retdue') : 'ok';
    return g;
  }).sort((a, b) => a.q - b.q || a.p.name.localeCompare(b.p.name));

  // ---- reconciliation: tax deducted / collected from us vs Form 168 (26AS)
  const tol = +s.tol || 0, ais = (co.ais || []).filter(a => !a.date || (a.date >= fy.start && a.date <= fy.end));
  const byTan = {}; co.parties.forEach(p => { if (p.tan) byTan[p.tan.toUpperCase()] = p; });
  const inRows = rows.filter(o => (o.role === 'byCustomer' || o.role === 'bySeller') && o.inFY);
  const grp = {};
  const gkey = (code, q, kind) => `${code}|${q}|${kind}`;
  inRows.forEach(o => {
    const k = gkey(o.p.code, o.q, o.r.kind);
    const g = grp[k] || (grp[k] = { p: o.p, tan: o.p.tan || '', q: o.q, kind: o.r.kind, side: o.role, gross: 0, books: 0, aisGross: 0, ais: 0, aisRows: [], rows: [] });
    g.gross += o.amt; g.books += o.booked; g.rows.push(o);
  });
  const orphan = [];
  ais.forEach(a => {
    const p = byTan[(a.tan || '').toUpperCase()], q = a.date ? qOf(a.date) : 0, kind = a.type === 'TCS' ? 'TCS' : 'TDS';
    if (!p) { orphan.push(a); return; }
    const k = gkey(p.code, q, kind);
    const g = grp[k] || (grp[k] = { p, tan: p.tan, q, kind, side: kind === 'TDS' ? 'byCustomer' : 'bySeller', gross: 0, books: 0, aisGross: 0, ais: 0, aisRows: [], rows: [] });
    g.aisGross += +a.amount || 0; g.ais += +a.deposited || +a.tds || 0; g.aisRows.push(a);
  });
  const recoIn = Object.values(grp).map(g => {
    g.diff = g.ais - g.books; g.retDue = retDue(fy.Y, g.q, g.kind === 'TCS' ? '143' : '140');
    g.unbooked = g.aisRows.some(a => a.status && a.status !== 'F');
    g.st = !g.rows.length ? 'onlyais' : Math.abs(g.diff) <= tol ? 'matched' : g.ais === 0 ? (TODAY <= g.retDue ? 'awaiting' : 'missing') : g.diff < 0 ? 'short' : 'excess';
    if (!g.p.tan && g.rows.length && g.st !== 'awaiting') g.noTan = true;
    return g;
  }).sort((a, b) => a.q - b.q || a.p.name.localeCompare(b.p.name));

  // ---- internal audit: what the law required vs what the books show, then deposit and return
  const audit = [], rev = co.auditRev || {};
  let tested = 0;
  rows.forEach(o => {
    const t = o.t;
    if (o.role === 'byCustomer' || o.role === 'bySeller') return;
    if (o.noTds && !(o.recorded && o.booked > TOL)) { tested++; return; }
    if (!o.unmapped && !o.noTds && (!o.r || !o.p || !OWN(o.role))) return;
    tested++;
    const iss = [], req = o.tax || 0, ded = o.booked || 0;
    if (o.unmapped) iss.push(['NM', 'warn']);
    else if (o.noTds) iss.push(['XD', 'warn', 'Deducted although no TDS applies']);
    else {
      const word = o.r.kind === 'TDS' ? 'deducted' : 'collected';
      if (req > TOL && ded <= TOL) iss.push(['ND', 'bad', `Not ${word}`]);
      else if (ded < req - TOL) iss.push(['SD', 'bad', `Short ${word}`]);
      else if (ded > req + TOL) {
        const rt = o.rate || ((o.p.type === 'Individual' || o.p.type === 'HUF') ? o.r.rI : o.r.rO) || 0;
        const onGst = +t.gst > 0 && Math.abs(ded - Math.round((o.amt + +t.gst) * rt)) <= Math.max(TOL, 1);
        iss.push(onGst ? ['GST', 'warn'] : ['XD', 'warn', req ? `Excess ${word}` : `${word[0].toUpperCase() + word.slice(1)} below threshold`]);
      }
      if (t.secBooks && !secMatch(t.secBooks, o.r)) iss.push(['WS', 'warn', `Books use ${t.secBooks}`]);
      if (o.p.ldcNo && o.p.ldcTo && t.date > o.p.ldcTo && ded < req - TOL) iss.push(['LDC', 'warn']);
      if (o.lateDedInt) iss.push(['LTD', 'warn']);
      if (ded > 0) {
        if (o.depStatus === 'late') iss.push(['LDP', 'warn']);
        else if (o.depStatus === 'overdue' || o.depStatus === 'notrun-over') iss.push(['NDP', 'bad']);
        if (o.shortDep) iss.push(['SDP', 'bad']);
        const ret = returns.find(x => x.q === o.q && x.form === o.form);
        if (ret && ret.st === 'overdue') iss.push(['NR', 'bad']);
        else if (ret && ret.st === 'late') iss.push(['LR', 'warn']);
      }
    }
    if (!iss.length) return;
    const short = Math.max(0, req - ded);
    const intShort = short ? Math.round(short * .01 * monthsPart(t.date, TODAY)) : 0;
    const disallow = iss.some(i => i[0] === 'ND') && o.r && o.r.kind === 'TDS' ? Math.round(o.amt * (o.r.nr ? 1 : .3)) : 0;
    const r0 = rev[t.id] || null;
    audit.push({ o, iss, sev: iss.some(i => i[1] === 'bad') ? 'bad' : 'warn', req, ded, short, excess: Math.max(0, ded - req), intShort, intDep: (o.depInt || 0) + (o.lateDedInt || 0), disallow, review: r0, open: !r0 || r0.status === 'Open' || r0.status === 'To rectify' });
  });

  // ---- advance tax
  const adv = advCompute(co, rows, fy);

  // ---- calendar
  const notRunList = Object.values(notRun).sort((a, b) => a.month < b.month ? -1 : 1);
  const cal = buildCalendar(co, fy, rows, challans, notRunList, returns, adv);

  const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
  const fyOwn = own.filter(o => o.inFY);
  const T = {
    tds: sum(fyOwn.filter(o => o.r.kind === 'TDS'), o => o.booked), tcs: sum(fyOwn.filter(o => o.r.kind === 'TCS'), o => o.booked),
    deposited: sum(fyOwn.filter(o => o.paidOn), o => Math.round(o.booked * (o.depRatio ?? 1))),
    pending: sum(fyOwn, o => o.paidOn ? Math.round(o.booked * (1 - (o.depRatio ?? 1))) : o.booked),
    overdueCount: fyOwn.filter(o => o.depStatus === 'overdue' || o.depStatus === 'notrun-over').length,
    interest: sum(fyOwn, o => o.depInt + o.lateDedInt), fees: sum(returns, r => r.fee),
    recoGap: sum(recoIn.filter(g => ['missing', 'short'].includes(g.st)), g => -Math.min(0, g.diff)),
    recoCount: recoIn.filter(g => ['missing', 'short', 'excess', 'onlyais'].includes(g.st)).length,
  };
  return { fy, law, other, audit, tested, rows, own, challans, notRun: notRunList, returns, recoOwnRows, recoIn, orphan, adv, cal, T, issues, RL, RM, PM };
}

function advCompute(co, rows, fy) {
  const a = advOf(co, fy.Y), I = +a.income || 0;
  const base = a.regime === 'n25' ? .25 : a.regime === 'n30' || a.regime === 'firm' ? .30 : .22;
  const sc = a.regime === 's200' || !a.regime ? .10 : a.regime === 'firm' ? (I > 1e7 ? .12 : 0) : I > 1e8 ? .12 : I > 1e7 ? .07 : 0;
  const taxBase = I * base, surcharge = taxBase * sc, other = +a.otherTax || 0;
  const cess = (taxBase + surcharge + other) * .04, gross = taxBase + surcharge + other + cess;
  const booksCredit = rows.filter(o => (o.role === 'byCustomer' || o.role === 'bySeller') && o.inFY).reduce((s, o) => s + o.booked, 0);
  const aisCredit = (co.ais || []).filter(x => x.date >= fy.start && x.date <= fy.end).reduce((s, x) => s + (+x.deposited || +x.tds || 0), 0);
  const credit = a.creditMode === 'ais' ? aisCredit : a.creditMode === 'manual' ? (+a.credit || 0) : booksCredit;
  const net = Math.max(0, Math.round(gross - credit)), liable = net >= 10000;
  const pays = (a.payments || []).slice().sort((x, y) => x.date < y.date ? -1 : 1);
  const r100 = n => Math.floor(Math.max(0, n) / 100) * 100;
  const inst = ADV.map(([q, md, cum, safe], i) => {
    const due = (i === 3 ? fy.Y + 1 : fy.Y) + '-' + md, req = Math.round(net * cum);
    const paid = pays.filter(p => p.date <= due).reduce((s, p) => s + (+p.amount || 0), 0);
    const short = liable ? Math.max(0, req - paid) : 0, exempt = liable && paid >= net * safe;
    const calc = !liable || (i < 2 && exempt) ? 0 : Math.round(r100(req - paid) * .01 * (i === 3 ? 1 : 3));
    const past = TODAY > due, int234c = past ? calc : 0;
    const st = paid >= req - 0.5 ? 'ok' : past ? 'short' : daysTo(due) <= 30 ? 'due' : 'future';
    return { q, due, cum, req, paid, short, int234c, proj: past ? 0 : calc, st, toPay: Math.max(0, req - paid) };
  });
  const paidTotal = pays.filter(p => p.date <= `${fy.Y + 1}-03-31`).reduce((s, p) => s + (+p.amount || 0), 0);
  const upto = a.b234Date || `${fy.Y + 1}-10-31`;
  const b234 = liable && paidTotal < .9 * net ? Math.round(r100(net - paidTotal) * .01 * monthsPart(`${fy.Y + 1}-04-01`, upto)) : 0;
  const next = inst.find(x => x.due >= TODAY);
  return { I, base, sc, taxBase, surcharge, other, cess, gross, credit, booksCredit, aisCredit, net, liable, inst, pays, paidTotal, b234, upto, next, int234c: inst.reduce((s, x) => s + x.int234c, 0) };
}

function buildCalendar(co, fy, rows, challans, notRun, returns, adv) {
  const out = [], done = co.calDone || {}, L = LAW[fy.law], Y = fy.Y;
  const add = (id, date, what, detail, auto, tab) => out.push({ id: `${Y}-${id}`, date, what, detail, auto, tab, manual: done[`${Y}-${id}`] || '' });
  months(Y).forEach(mk => {
    const tdsDue = depositDue(mk, 'TDS', '140'), tcsDue = depositDue(mk, 'TCS', '143');
    const has = (k) => challans.filter(c => c.c.month === mk && c.c.kind === k), nr = (k) => notRun.filter(n => n.month === mk && n.kind === k);
    const auto = (k) => { const cs = has(k), n = nr(k); if (!cs.length && !n.length) return null; if (n.length) return 'open'; return cs.every(c => c.c.paidOn) ? (cs.some(c => c.st === 'late') ? 'late' : 'done') : 'open'; };
    const aT = auto('TDS'), aC = auto('TCS');   // a past month with nothing deducted needs no deposit
    if (aT !== null || TODAY <= tdsDue) add(`dep-tds-${mk}`, tdsDue, `Deposit TDS for ${fmonth(mk)}`, 'Challan ITNS 281, minor head 200', aT, 'challans');
    if (aC !== null || TODAY <= tcsDue) add(`dep-tcs-${mk}`, tcsDue, `Deposit TCS for ${fmonth(mk)}`, 'Challan ITNS 281, minor head 200', aC, 'challans');
  });
  for (let q = 1; q <= 4; q++) {
    const byDue = {};
    returns.filter(r => r.q === q).forEach(r => (byDue[r.due] = byDue[r.due] || []).push(r));
    Object.entries(byDue).forEach(([due, rs]) => {
      const allFiled = rs.every(r => r.filed);
      add(`ret-${q}-${due}`, due, `Q${q} return${rs.length > 1 ? 's' : ''}: ${rs.map(r => fname(fy.law, r.form)).join(', ')}`, rs.map(r => FDESC[r.form]).join(' · '), allFiled ? (rs.some(r => r.st === 'late') ? 'late' : 'done') : 'open', 'returns');
    });
    const ct = certDue(Y, q, 'TDS'), cc = certDue(Y, q, 'TCS');
    if (ct === cc) add(`cert-${q}`, ct, `Q${q} certificates to deductees`, `${L.certTds} (TDS) and ${L.certTcs} (TCS) from TRACES`, null, 'certs');
    else { add(`cert-${q}`, ct, `Q${q} ${L.certTds} to deductees`, 'TDS certificates from TRACES', null, 'certs'); add(`certc-${q}`, cc, `Q${q} ${L.certTcs} to collectees`, 'TCS certificates from TRACES', null, 'certs'); }
  }
  add('form130', `${Y + 1}-06-15`, `${L.certSal} to employees`, 'Salary TDS certificate', null, 'certs');
  adv.inst.forEach((x, i) => add(`adv-${i}`, x.due, `Advance tax ${x.q} — ${Math.round(x.cum * 100)}% cumulative`, `Required ₹${fmt(x.req)}, paid ₹${fmt(x.paid)}`, !adv.liable ? 'done' : x.st === 'ok' ? 'done' : 'open', 'adv'));
  rows.filter(o => o.form === '141' && o.tax > 0 && OWN(o.role)).forEach(o => add(`141-${o.t.id}`, o.due, `${fname(fy.law, '141')} — ${o.p.name}`, `${o.r.old}, TDS ₹${fmt(o.tax)}`, o.paidOn ? 'done' : 'open', 'challans'));
  return out.map(x => {
    const state = x.manual ? 'done' : x.auto === 'done' ? 'done' : x.auto === 'late' ? 'late' : TODAY > x.date ? (x.auto === null ? 'check' : 'overdue') : daysTo(x.date) <= 15 ? 'soon' : 'future';
    return { ...x, state };
  }).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
}

function runMonth(co, mk) {
  const R = compute(co, fyYOf(mk + '-01'));
  const groups = {};
  R.own.filter(o => o.month === mk).forEach(o => { const g = groups[o.chKey] || (groups[o.chKey] = { key: o.chKey, kind: o.r.kind, month: mk, sec: o.r.k, head: o.head, form: o.form, due: o.due, amount: 0, rows: 0, party: o.form === '141' ? o.p.code : '' }); g.amount += o.booked; g.rows++; });
  let created = 0, updated = 0, total = 0;
  Object.values(groups).forEach(g => {
    total += g.amount;
    const ex = co.challans.find(c => c.key === g.key);
    if (!ex) { co.challans.push({ id: uid('ch_'), key: g.key, kind: g.kind, month: g.month, sec: g.sec, head: g.head, form: g.form, due: g.due, party: g.party, amount: g.amount, createdOn: TODAY, paidOn: '', bsr: '', serial: '', interestPaid: 0 }); created++; }
    else if (!ex.paidOn && ex.amount !== g.amount) { ex.amount = g.amount; updated++; }
  });
  return { created, updated, total, groups: Object.keys(groups).length };
}

      { k: 'employees', l: 'Has employees (salary TDS return 24Q / 138)', t: 'check', full: true },

async function outlookDrafts(msgs, onEach) {
  let mcp = null;
  try { mcp = window.claude && window.claude.use ? await window.claude.use('mcp') : null; } catch {}
  if (!mcp) return { ok: 0, err: 'Outlook drafts work when the desk is open in Claude with Microsoft 365 connected. In this copy, use Gmail or copy the text.' };
  let ok = 0;
  for (const m of msgs) {
    try {
      await mcp.callTool('Microsoft 365', 'outlook_create_draft', { to: m.to, ...(m.cc.length ? { cc: m.cc } : {}), subject: m.subject.slice(0, 255), body: toHtml(m.body), bodyType: 'html' });
      ok++; if (onEach) onEach(m);

    await new Promise(r => setTimeout(r, 350));
  }
  return { ok };
}

function certRows() {
  const { kind, q, pre } = certCtx(), store = cur.certs || {}, rows = [];

  }

let dlgSave = null, dlgDelete = null;
function openDlg({ title, fields = [], values = {}, onSave, onDelete, top = '', extra = '', saveLabel = 'Save', noSave = false }) {
  $('dlg-title').textContent = title; $('dlg-top').innerHTML = top; $('dlg-extra').innerHTML = extra; $('dlg-err').textContent = '';
  $('dlg-body').innerHTML = fields.map(f => {
    const id = 'd-' + f.k, v = values[f.k] ?? '', cls = f.full ? ' class="full"' : '';
    const hint = f.hint ? ` <span class="hint">${esc(f.hint)}</span>` : '';
    if (f.t === 'check') return `<label class="check${f.full ? ' full' : ''}" for="${id}"><input id="${id}" type="checkbox"${v ? ' checked' : ''}> ${esc(f.l)}${hint}</label>`;
    if (f.t === 'textarea') return `<label for="${id}" class="full">${esc(f.l)}${hint}<textarea id="${id}" rows="${f.rows || 6}">${esc(v)}</textarea></label>`;
    if (f.t === 'select') return `<label for="${id}"${cls}>${esc(f.l)}${hint}<select id="${id}">${f.o.map(o => { const [ov, ol, og] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}"${String(ov) === String(v) ? ' selected' : ''}>${esc(ol)}</option>`; }).join('')}</select></label>`;
    return `<label for="${id}"${cls}>${esc(f.l)}${hint}<input id="${id}" type="${f.t || 'text'}"${f.step ? ` step="${f.step}"` : ''}${f.t === 'number' ? ' min="0"' : ''} value="${esc(v)}"${f.max ? ` maxlength="${f.max}"` : ''}></label>`;
  }).join('');
  dlgSave = onSave; dlgDelete = onDelete;
  $('dlg-save').hidden = noSave; $('dlg-save').textContent = saveLabel; $('dlg-cancel').textContent = noSave ? 'Close' : 'Cancel';
  $('dlg-del').hidden = !onDelete; $('dlg-del2').hidden = true;
  $('dlg').showModal();
  const first = $('dlg-body').querySelector('input:not([type=checkbox]), select'); if (first) first.focus();
  $('dlg')._fields = fields;
}
function dlgValues() { const o = {}; ($('dlg')._fields || []).forEach(f => { const el = $('d-' + f.k); o[f.k] = f.t === 'check' ? el.checked : f.t === 'number' ? (el.value === '' ? '' : +el.value) : el.value.trim(); }); return o; }
$('dlg-form').addEventListener('submit', e => { e.preventDefault(); if (!dlgSave) return; const err = dlgSave(dlgValues()); if (err) { $('dlg-err').textContent = err; return; } $('dlg').close(); changed(); });

      { k: 'ldcLimit', l: 'Certificate amount limit (₹)', t: 'number' }, { k: 'ldcFrom', l: 'Valid from', t: 'date' }, { k: 'ldcTo', l: 'Valid to', t: 'date' }],
    onSave: v => {
      v.pan = v.pan.toUpperCase(); v.tan = v.tan.toUpperCase(); v.code = v.code.toUpperCase();

      if (cur.parties.some((x, j) => x.code === v.code && j !== i)) return 'That party code is already used.';

const norm = s => String(s ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
function findSec(v) { const n = norm(v); if (!n) return null; const RL = rateRows(cur); return (RL.find(r => norm(r.k) === n) || RL.find(r => norm(r.old) === n) || RL.find(r => norm(r.old).startsWith(n)) || {}).k || null; }
function isoDate(v) { if (!v && v !== 0) return ''; if (v instanceof Date) return new Date(v.getTime() - v.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  if (typeof v === 'number') return new Date(Date.UTC(1899, 11, 30) + v * 864e5).toISOString().slice(0, 10);
  const s = String(v).trim(); let m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/); if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  m = s.match(/^(\d{1,2})[-\s]([A-Za-z]{3})[-\s](\d{2,4})$/); if (m) { const mi = MON.findIndex(x => x.toLowerCase() === m[2].toLowerCase()); const y = m[3].length === 2 ? '20' + m[3] : m[3]; if (mi >= 0) return `${y}-${pad(mi + 1)}-${m[1].padStart(2, '0')}`; }
  return s.slice(0, 10); }
function monthOf(v) { if (v instanceof Date || typeof v === 'number') return isoDate(v).slice(0, 7); const s = String(v ?? '').trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})/))) return `${m[1]}-${pad(+m[2])}`; if ((m = s.match(/^([A-Za-z]{3})[a-z]*[-\s']*(\d{2,4})$/))) { const i = MON.findIndex(x => x.toLowerCase() === m[1].toLowerCase()); if (i >= 0) return `${m[2].length === 2 ? '20' + m[2] : m[2]}-${pad(i + 1)}`; }
  if ((m = s.match(/^(\d{1,2})[-/](\d{4})$/))) return `${m[2]}-${pad(+m[1])}`; const d = isoDate(v); return /^\d{4}-\d{2}-\d{2}$/.test(d) ? d.slice(0, 7) : ''; }
const yes = v => /^(y|yes|true|1)$/i.test(String(v ?? '').trim());
function table(ws, mustHave) {
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
  const h = aoa.findIndex(r => mustHave.every(k => r.some(c => norm(c).startsWith(k))));
  if (h < 0) return null;
  const head = aoa[h].map(norm);
  const col = (...ks) => { for (const k of ks) { const i = head.indexOf(k); if (i >= 0) return i; } return head.findIndex(c => ks.some(k => c.startsWith(k))); };
  return { rows: aoa.slice(h + 1).filter(r => r.some(c => String(c).trim() !== '')), col };
}

// ================================================================ export
async function saveFile(name, data, type) {
  const dl = window.__downloads;
  if (dl) { try { await dl.save({ filename: name, data }); toast('File saved'); } catch (e) { if (e && e.code !== 'declined') toast('The download could not start here.'); } return; }
  try { const url = URL.createObjectURL(new Blob([data], { type })); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); toast('File downloaded'); }
  catch { toast('Downloading is not available in this view.'); }
}
async function saveBook(wb, name) {
  const dl = window.__downloads;
  if (!window.XLSX) { toast('The spreadsheet library did not load. Reload and try again.'); return; }
  const data = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  if (!dl) {   // opened as a local file: an ordinary browser download works there
    try { const url = URL.createObjectURL(new Blob([data], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Excel file downloaded'); }
    catch { toast('Downloading is not available in this view.'); }
    return;
  }
  try { await dl.save({ filename: name, data: new Uint8Array(data) }); toast('Excel file saved'); } catch (e) { if (e && e.code !== 'declined') toast('The download could not start here.'); }
}

      ${CFG.colours === false ? `<p class="lk-note">${esc(CFG.colourNote || '')}</p>` : `<div class="lk-sec" style="border:0;padding:0"><h3>Colour combination</h3>
        <div class="lk-sw">${card('own', CFG.ownName, CFG.ownDesc, null)}${PRESETS.map(p => card(p.k, p.n, p.d, p)).join('')}${card('custom', 'My colours', 'Your own three colours, set below.', L.custom)}</div></div>
      <div class="lk-sec"><h3>Custom combination</h3>
        <div class="lk-row"><label>Main colour (buttons, headings, tabs)<input type="color" data-lkc="accent" value="${L.custom.accent.toLowerCase()}"></label>
          <label>Highlight colour (chips, labels)<input type="color" data-lkc="accent2" value="${L.custom.accent2.toLowerCase()}"></label>
          <label>Page tint (backgrounds, lines)<input type="color" data-lkc="tint" value="${L.custom.tint.toLowerCase()}"></label></div>
        <div class="lk-chips">${ck(A.accent, A.surface, 'Main on light')}${ck(A.accentInk, A.accent, 'Button text')}${ck(B.accent, B.surface, 'Main on dark')}${ck(A.accent2, A.surface, 'Highlight on light')}</div>
        <div class="lk-row"><label>Name this combination<input type="text" id="lk-name" maxlength="30" placeholder="e.g. Firm colours"></label><button type="button" class="lk-p" data-lk="savec">Save combination</button></div>
        ${L.saved.length ? `<div class="lk-saved">${L.saved.map((x, i) => `<span><i style="background:${x.accent}"></i><i style="background:${x.accent2}"></i><button type="button" data-lk="use" data-v="${i}" style="border:0;padding:2px 4px;text-decoration:underline">${esc(x.name)}</button><button type="button" data-lk="del" data-v="${i}" aria-label="Remove ${esc(x.name)}" style="padding:1px 6px">✕</button></span>`).join('')}</div>` : ''}
        <p class="lk-note">Any colours work: they are darkened or lightened just enough to stay readable, and a matching dark version is built. Status colours (green, amber, red) never change.</p></div>`}
      <div class="lk-sec"><h3>Display</h3><div class="lk-row">
        <label>Light or dark${seg('mode', [['system', 'Follow device'], ['light', 'Light'], ['dark', 'Dark']])}</label>
        <label>Shapes${seg('skin', [['society', 'Society Desk style'], ['own', "Tool's own style"]])}</label>
        <label>Table spacing${seg('density', [['comfortable', 'Comfortable'], ['compact', 'Compact']])}</label>
        <label>Type<select data-lkf="1">${Object.entries(FONTS).map(([k, f]) => `<option value="${k}"${L.font === k ? ' selected' : ''}>${esc(f.n)}</option>`).join('')}</select></label></div></div>
      <div class="lk-sec"><h3>Use the same look in your other tools</h3>
        <div class="lk-row"><label>Look code of this tool<input type="text" readonly id="lk-code" value="${esc(code())}"></label><button type="button" data-lk="copy">Copy look code</button></div>
        <div class="lk-row"><label>Paste a look code from another tool<input type="text" id="lk-paste" placeholder="Paste here"></label><button type="button" data-lk="paste">Apply code</button></div>
        <p class="lk-note">Each tool remembers its look in this browser. Copy the code here and paste it in the Look &amp; feel panel of any other Finance Model tool to match them.</p></div></div>`;
  }
  let tmr;
  dlg.addEventListener('click', e => { const b = e.target.closest('[data-lk]'); if (!b) { if (e.target === dlg) dlg.close(); return; } const a = b.dataset.lk;
    if (a === 'close') { dlg.close(); return; }
    if (a === 'preset') L.preset = b.dataset.v;
    if (a === 'set') L[b.dataset.k] = b.dataset.v;
    if (a === 'reset') { const keep = L.saved; L = { ...JSON.parse(JSON.stringify(DEF)), saved: keep }; }
    if (a === 'savec') { const nm = (dlg.querySelector('#lk-name').value || '').trim(); if (!nm) { dlg.querySelector('#lk-name').focus(); return; } L.saved = [...L.saved.filter(x => x.name !== nm), { name: nm, ...L.custom }].slice(-8); }
    if (a === 'use') { const x = L.saved[+b.dataset.v]; L.custom = { accent: x.accent, accent2: x.accent2, tint: x.tint }; L.preset = 'custom'; }
    if (a === 'del') L.saved.splice(+b.dataset.v, 1);
    if (a === 'copy') { const el = dlg.querySelector('#lk-code'); try { navigator.clipboard.writeText(el.value).then(() => { b.textContent = 'Copied'; }, () => { el.select(); b.textContent = 'Press Ctrl+C'; }); } catch { el.select(); } return; }
    if (a === 'paste') { try { const v = JSON.parse(decodeURIComponent(escape(atob(dlg.querySelector('#lk-paste').value.trim())))); L = { ...L, preset: v.p === 'own' ? 'own' : v.p, custom: v.c || L.custom, mode: v.m || L.mode, density: v.d || L.density, font: v.f || L.font, skin: v.s || L.skin }; }
      catch { dlg.querySelector('#lk-paste').value = ''; dlg.querySelector('#lk-paste').placeholder = 'That is not a look code — copy it again'; return; } }
    save(); apply(); draw(); });
  dlg.addEventListener('input', e => { const k = e.target.dataset.lkc; if (!k) return; L.custom[k] = e.target.value.toUpperCase(); L.preset = 'custom'; apply(); clearTimeout(tmr); tmr = setTimeout(save, 300); });
  dlg.addEventListener('change', e => { if (e.target.dataset.lkc) { save(); draw(); } if (e.target.dataset.lkf) { L.font = e.target.value; save(); apply(); draw(); } });
  function open() { draw(); if (!dlg.open) dlg.showModal(); }
  function addButton() {
    if (document.getElementById('lk-open')) return;
    const host = document.querySelector(CFG.host);
    const b = document.createElement('button'); b.type = 'button'; b.id = 'lk-open'; b.textContent = 'Look & feel'; if (CFG.btnClass) b.className = CFG.btnClass;
    b.addEventListener('click', open);
    if (host) host.appendChild(b); else { b.style.cssText = 'position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20'; document.body.appendChild(b); }
  }
  apply(); addButton();
  window.lookFeel = { open, apply };
})();
</script>

</body></html>
