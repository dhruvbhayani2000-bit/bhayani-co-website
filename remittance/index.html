<title>Foreign Remittance Desk</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: Society Desk design family — white top bar with logo tile, left rail menu with icons, dark ocean hero, separate rounded tiles and cards; slate neutrals, sky primary, amber highlight. */
:root {
  --bg: #F8FAFC; --surface: #FFFFFF; --sunk: #F1F5F9; --line: #E2E8F0; --fg: #0F172A; --muted: #64748B;
  --navy: #0274B0; --navy-ink: #FFFFFF; --teal: #B45309; --focus: #0284C7;
  --hero-a: #0F172A; --hero-b: #0C4A6E; --hero-eyebrow: #38BDF8;
  --good: #047857; --good-bg: #ECFDF5; --warn: #B45309; --warn-bg: #FFFBEB; --bad: #DC2626; --bad-bg: #FEF2F2;
  --shadow: 0 1px 2px rgb(15 23 42 / .05); --shadow-lg: 0 10px 30px -12px rgb(15 23 42 / .35);
  --r-sm: 10px; --r-md: 12px; --r-lg: 16px; --cell-y: 9px; --accent-soft: color-mix(in srgb, var(--navy) 10%, transparent);
  --f-display: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif; --f-body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif; --f-num: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --rail-w: 252px; --top-h: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B1120; --surface: #111A2E; --sunk: #0F172A; --line: #1E293B; --fg: #E2E8F0; --muted: #94A3B8;
  --navy: #38BDF8; --navy-ink: #082F49; --teal: #FBBF24; --focus: #7DD3FC; --hero-a: #0B1222; --hero-b: #0C3A57; --hero-eyebrow: #7DD3FC;
  --good: #34D399; --good-bg: #062E22; --warn: #FBBF24; --warn-bg: #2A1F0A; --bad: #F87171; --bad-bg: #3B1212; --shadow: 0 1px 2px rgb(0 0 0 / .4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0B1120; --surface: #111A2E; --sunk: #0F172A; --line: #1E293B; --fg: #E2E8F0; --muted: #94A3B8;
  --navy: #38BDF8; --navy-ink: #082F49; --teal: #FBBF24; --focus: #7DD3FC; --hero-a: #0B1222; --hero-b: #0C3A57; --hero-eyebrow: #7DD3FC;
  --good: #34D399; --good-bg: #062E22; --warn: #FBBF24; --warn-bg: #2A1F0A; --bad: #F87171; --bad-bg: #3B1212; --shadow: 0 1px 2px rgb(0 0 0 / .4); color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14.5px; line-height: 1.5; margin: 0; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 41; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: -.01em; line-height: 1.2; }
h1 { font-size: 1.6rem; font-weight: 800; } h2 { font-size: 1.05rem; } h3 { font-size: .96rem; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; font-size: 13px; }
.mono { font-family: var(--f-num); font-size: 12.5px; }
td.mono { white-space: nowrap; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; font-weight: 600; font-size: 13.5px; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--navy); color: var(--navy-ink); border-color: var(--navy); box-shadow: 0 4px 10px -4px color-mix(in srgb, var(--navy) 55%, transparent); }
button.danger { color: var(--bad); border-color: var(--bad); }
button.link { border: 0; background: none; padding: 0; color: var(--navy); text-decoration: underline; text-underline-offset: 2px; text-align: left; font-weight: 600; box-shadow: none; }
button.sm { padding: 5px 11px; font-size: 12.5px; border-radius: var(--r-sm); }
button:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; width: 100%; min-width: 0; }
input[type="checkbox"], input[type="radio"] { width: auto; accent-color: var(--navy); }
textarea { resize: vertical; }
label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); font-weight: 600; }
label.check { display: flex; align-items: center; gap: 8px; color: var(--fg); font-size: 13px; font-weight: 500; }
a.btn { display: inline-flex; align-items: center; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); padding: 5px 11px; font-size: 12.5px; font-weight: 600; color: var(--fg); text-decoration: none; }
a.btn:hover { border-color: var(--muted); }

/* ---------- app shell */
.app { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); grid-template-rows: auto 1fr; min-height: 100vh; }
.topbar { grid-column: 1 / -1; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px;
  min-height: var(--top-h); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; gap: 12px; align-items: center; min-width: 0; flex: 1 1 auto; }
.logo-tile { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, var(--hero-a), var(--hero-b)); display: grid; place-items: center; flex: none; }
.logo-tile svg { width: 26px; height: 26px; }
.brand-name { font-weight: 700; font-size: 1rem; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand > div { min-width: 0; }
.company { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
.company select { width: auto; max-width: 240px; font-weight: 600; border-radius: var(--r-md); }
.save-state { font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 12px; border: 1px solid var(--line); color: var(--muted); background: var(--sunk); white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--good); } .dot.warn { background: var(--warn); }
.menu-btn { display: none; padding: 7px 9px; }
.rail { background: var(--surface); border-right: 1px solid var(--line); position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--top-h) - env(safe-area-inset-top, 0px)); overflow: auto; display: flex; flex-direction: column; }
.rail-label { padding: 18px 22px 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.tabs { display: flex; flex-direction: column; padding: 4px 12px 8px; gap: 2px; }
.tab { all: unset; box-sizing: border-box; cursor: pointer; padding: 9px 12px; border-radius: 12px; color: var(--muted); font-weight: 500; font-size: 13.5px; display: flex; align-items: center; gap: 12px; }
.tab svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.tab .l { flex: 1; min-width: 0; }
.tab:hover { background: var(--sunk); color: var(--fg); }
.tab[aria-selected="true"] { background: var(--navy); color: var(--navy-ink); font-weight: 600; box-shadow: 0 4px 10px -4px color-mix(in srgb, var(--navy) 60%, transparent); }
.tab[aria-selected="true"] svg { opacity: 1; }
.tab:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.tab .cnt { font-family: var(--f-num); font-size: 11px; background: var(--teal); color: var(--surface); border-radius: 999px; padding: 0 7px; line-height: 1.6; font-weight: 600; }
.tab[aria-selected="true"] .cnt { background: var(--navy-ink); color: var(--navy); }
.rail-foot { margin-top: auto; padding: 14px 16px 18px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.scrim { display: none; }
main.main { min-width: 0; padding-block: 24px 60px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; align-content: start; max-width: 1320px; width: 100%; }
main.main > *, #view > * { min-width: 0; }
#view { display: grid; gap: 18px; align-content: start; min-width: 0; }
@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: inline-flex; }
  .rail { position: fixed; z-index: 45; top: 0; bottom: 0; left: 0; height: 100%; width: min(290px, 86vw); transform: translateX(-102%); transition: transform .2s ease; padding-top: env(safe-area-inset-top, 0px); padding-left: env(safe-area-inset-left, 0px); box-shadow: var(--shadow-lg); }
  .rail.open { transform: none; }
  .scrim.open { display: block; position: fixed; inset: 0; z-index: 44; background: rgb(10 15 25 / .45); }
  main.main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 16px; }
  .company .save-state, .company #edit-company { display: none; }
  .brand-sub { display: none; }
}
@media (max-width: 560px) { .company #new-company { display: none; } .company select { max-width: 150px; } }

/* ---------- hero, banners */
.hero { border-radius: 24px; padding: 26px 28px; background: linear-gradient(120deg, var(--hero-a) 0%, var(--hero-a) 35%, var(--hero-b) 100%); color: #F8FAFC; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between; box-shadow: var(--shadow-lg); }
.hero .eyebrow { color: var(--hero-eyebrow); }
.hero h1 { color: #FFFFFF; margin-top: 6px; font-size: clamp(1.4rem, 3vw, 1.9rem); }
.hero p { color: #CBD5E1; max-width: 64ch; margin: 6px 0 0; font-size: 14px; }
.hero p b { color: #FFFFFF; }
.hero .acts { display: flex; gap: 10px; flex-wrap: wrap; }
.hero button { border-radius: 12px; padding: 10px 16px; }
.hero .hero-primary { background: #0EA5E9; border-color: #0EA5E9; color: #FFFFFF; }
.hero .hero-ghost { background: rgb(255 255 255 / .1); border-color: rgb(255 255 255 / .2); color: #FFFFFF; }
.hero .hero-ghost:hover { background: rgb(255 255 255 / .16); }
.banner { background: var(--warn-bg); color: var(--fg); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); border-radius: var(--r-lg); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.banner strong { color: var(--warn); }
.lawbar { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 10px 16px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; box-shadow: var(--shadow); }
.lawbar .muted { font-size: 12px; }

/* ---------- tiles */
.totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 14px; }
@media (max-width: 560px) { .totals { grid-template-columns: 1fr 1fr; gap: 10px; } .tot { padding: 14px; } .tot .ic { display: none; } .tot .k { padding-right: 0; } }
.tot { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px; display: grid; gap: 4px; align-content: start; box-shadow: var(--shadow); min-width: 0; }
.tot .k { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; padding-right: 30px; }
.tot .v { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: clamp(1.25rem, 2vw, 1.55rem); font-weight: 600; letter-spacing: -.02em; overflow-wrap: anywhere; }
.tot .n { font-size: 12px; color: var(--muted); }
.tot .ic { position: absolute; top: 15px; right: 16px; width: 20px; height: 20px; color: var(--navy); }
.tot.lead .v { color: var(--fg); }
.tot.bad .v, .tot.bad .ic { color: var(--bad); } .tot.warn .v, .tot.warn .ic { color: var(--warn); } .tot.good .v, .tot.good .ic { color: var(--good); }

/* ---------- toolbar, pills, chips */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; border: 1px solid transparent; white-space: nowrap; }
.pill.ok { background: var(--good-bg); color: var(--good); border-color: color-mix(in srgb, var(--good) 30%, transparent); }
.pill.bad { background: var(--bad-bg); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.pill.warn { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.pill.idle { background: var(--sunk); color: var(--muted); border-color: var(--line); }
.chip { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; display: inline-block; margin: 0 4px 3px 0; }
.chip.teal { color: var(--navy); background: var(--accent-soft); }
.chip.warn { color: var(--warn); background: var(--warn-bg); }
.chip.bad { color: var(--bad); background: var(--bad-bg); }
.chip.navy { color: var(--navy-ink); background: var(--navy); }

/* ---------- panels and tables */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0; box-shadow: var(--shadow); overflow: hidden; }
.panel-head { padding: 16px 20px 10px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.panel-head .sub { color: var(--muted); font-size: 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 20px 14px; align-items: end; }
.filters label { min-width: 150px; flex: 0 1 220px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: var(--cell-y) 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th:first-child, td:first-child { padding-left: 20px; } th:last-child, td:last-child { padding-right: 20px; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; background: var(--sunk); white-space: nowrap; }
th.num { text-align: right; }
td .ref { display: block; font-size: 11px; color: var(--muted); }
tbody tr[tabindex] { cursor: pointer; }
tbody tr[tabindex]:hover td { background: color-mix(in srgb, var(--navy) 5%, var(--surface)); }
tr[tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
tbody tr:last-child td { border-bottom: 0; }
tfoot td { font-weight: 700; border-top: 2px solid var(--line); border-bottom: 0; background: var(--sunk); }
tr.grp td { background: var(--sunk); font-weight: 700; font-size: 12px; }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.note { padding: 12px 20px 16px; color: var(--muted); font-size: 12.5px; max-width: 100ch; }
.note p { margin: 0 0 6px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 18px; }
.todo { list-style: none; margin: 0; padding: 0 20px 14px; display: grid; }
.todo li { display: grid; grid-template-columns: 84px 1fr auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; }
.todo li:last-child { border-bottom: 0; }
.todo .d { font-family: var(--f-num); font-size: 12px; color: var(--muted); }
.kv { display: grid; grid-template-columns: 1fr auto; }
.kv div { padding: 8px 20px; border-bottom: 1px solid var(--line); }
.kv .strong { font-weight: 700; }

/* ---------- decision wizard */
.wiz { padding: 4px 20px 20px; display: grid; gap: 10px; }
.q { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; display: grid; gap: 8px; background: var(--surface); }
.q.off { opacity: .45; }
.q .qt { font-weight: 700; font-size: 13.5px; }
.q .qh { font-size: 12.5px; color: var(--muted); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--navy-ink); border-color: var(--navy); }
.result { border-radius: var(--r-lg); padding: 16px 18px; border: 1px solid color-mix(in srgb, var(--navy) 35%, transparent); background: var(--accent-soft); display: grid; gap: 6px; }
.result .big { font-family: var(--f-display); font-size: 1.2rem; color: var(--navy); font-weight: 800; }
.result ul { margin: 0; padding-left: 18px; font-size: 13px; }
.trace { list-style: none; margin: 0; padding: 0; display: grid; }
.trace li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.trace li:last-child { border-bottom: 0; }
.trace .n { width: 24px; height: 24px; border-radius: 50%; background: var(--sunk); color: var(--muted); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.trace .stop .n { background: var(--navy); color: var(--navy-ink); }
.trace .a { color: var(--muted); font-size: 12.5px; display: block; }
.pipeline { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; padding: 4px 20px 18px; }
.stage { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; display: grid; gap: 2px; background: var(--sunk); }
.stage .v { font-family: var(--f-num); font-size: 1.3rem; font-weight: 600; }
.stage .k { font-size: 12px; color: var(--muted); }
.docgrid { display: grid; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.docrow { display: grid; grid-template-columns: minmax(150px, 1.2fr) auto minmax(120px, 1fr) auto; gap: 8px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.docrow:last-child { border-bottom: 0; }
.docrow .dn { font-size: 13px; font-weight: 600; }
.docrow .dn .ref { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
@media (max-width: 640px) { .docrow { grid-template-columns: 1fr auto; } .docrow input { grid-column: 1 / -1; } }

/* ---------- look & feel */
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr)); gap: 10px; padding: 4px 20px 20px; }
.sw { text-align: left; display: grid; gap: 8px; padding: 12px; border-radius: var(--r-md); background: var(--surface); font-weight: 400; }
.sw[aria-pressed="true"] { border-color: var(--navy); box-shadow: 0 0 0 2px var(--navy); }
.sw .bar { display: flex; height: 26px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.sw .bar span { flex: 1; }
.sw .nm { font-weight: 700; font-size: 13px; }
.sw .ds { font-size: 12px; color: var(--muted); }
.lookrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(170px, 100%), 1fr)); gap: 12px; padding: 4px 20px 16px; align-items: end; }
.lookrow input[type="color"] { height: 40px; padding: 3px; cursor: pointer; }
.contrast { font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px; padding: 0 20px 14px; }
.previews { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 14px; padding: 4px 20px 20px; }
.pv { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; display: grid; gap: 10px; font-family: var(--f-body); }
.pv .pvh { font-family: var(--f-display); color: var(--fg); font-weight: 800; font-size: 1.05rem; }
.pv .pvt { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pv .pvt div { background: var(--surface); padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-md); font-family: var(--f-num); }

  { cc: 'CN', c: 'China', div: 10, divQ: 10, int: 10, roy: 10, fts: 10, ma: false, note: '' },
  { cc: 'HK', c: 'Hong Kong', div: 5, divQ: 5, int: 10, roy: 10, fts: 10, ma: false, note: '' },
  { cc: 'CH', c: 'Switzerland', div: 10, divQ: 10, int: 10, roy: 10, fts: 10, ma: false, note: '' },
  { cc: 'IE', c: 'Ireland', div: 10, divQ: 10, int: 10, roy: 10, fts: 10, ma: false, note: '' },
  { cc: 'SE', c: 'Sweden', div: 10, divQ: 10, int: 10, roy: 10, fts: 10, ma: false, note: '' },
  { cc: 'IT', c: 'Italy', div: 25, divQ: 15, int: 15, roy: 20, fts: 20, ma: false, note: '' },
  { cc: 'KR', c: 'South Korea', div: 15, divQ: 15, int: 10, roy: 10, fts: 10, ma: false, note: '' },

  ['ch', 'TDS challan'], ['a2', 'Bank Form A2'], ['swift', 'SWIFT / MT103 copy'],
];
const DOCN = Object.fromEntries(DOCS);
const UDIN_RE = /^\d{8}[A-Z0-9]{10}$/, PAN_RE = /^[A-Z]{5}[0-9]{4}[A-Z]$/, TAN_RE = /^[A-Z]{4}[0-9]{5}[A-Z]$/;

// ================================================================ dates and formatting
const pad = n => String(n).padStart(2, '0');
const day = s => s ? Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5 : null;
const isoOf = dn => new Date(dn * 864e5).toISOString().slice(0, 10);
const TODAY = (() => { const t = new Date(); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`; })();
const daysTo = s => day(s) - day(TODAY);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fdate = s => s ? `${s.slice(8, 10)}-${MON[+s.slice(5, 7) - 1]}-${s.slice(2, 4)}` : '';
const nf = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 2 });
const fmt = n => { if (!n || Math.abs(n) < 0.5) return '–'; const s = nf.format(Math.round(Math.abs(n))); return n < 0 ? `(${s})` : s; };
const pct = r => r == null ? '–' : (+(r * 100).toFixed(3)) + '%';
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const $ = id => document.getElementById(id);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const qOf = s => { const m = +s.slice(5, 7); return m >= 4 && m <= 6 ? 1 : m >= 7 && m <= 9 ? 2 : m >= 10 ? 3 : 4; };
const fyYOf = d => +d.slice(5, 7) >= 4 ? +d.slice(0, 4) : +d.slice(0, 4) - 1;
const yearLabel = Y => Y >= 2026 ? `Tax year ${Y}-${String(Y + 1).slice(2)}` : `FY ${Y}-${String(Y + 1).slice(2)}`;
const retDue = (Y, q) => [`${Y}-07-31`, `${Y}-10-31`, `${Y + 1}-01-31`, `${Y + 1}-05-31`][q - 1];
function depDue(d) { const y = +d.slice(0, 4), m = +d.slice(5, 7); if (m === 3) return `${y}-04-30`; return m === 12 ? `${y + 1}-01-07` : `${y}-${pad(m + 1)}-07`; }
const monthsPart = (a, b) => (+b.slice(0, 4) * 12 + +b.slice(5, 7)) - (+a.slice(0, 4) * 12 + +a.slice(5, 7)) + 1;
const pill = (cls, txt, title) => `<span class="pill ${cls}"${title ? ` title="${esc(title)}"` : ''}>${esc(txt)}</span>`;

// ================================================================ engine
function treatyOf(co, cc) { const t = TREATY.find(x => x.cc === cc); if (!t && !(co.treatyOv || {})[cc]) return null; return { ...(t || { cc, c: cc, note: '' }), ...((co.treatyOv || {})[cc] || {}) }; }
const COUNTRIES = () => [...TREATY.map(t => [t.cc, t.c])];
function payeeDocs(p, d) {
  const out = { trc: !!(p.trcFrom && p.trcTo && d >= p.trcFrom && d <= p.trcTo), f41: !!p.f41On, npe: !!p.npeOn, tin: !!p.tin };

  return out;
}
function compute(co, Yo) {

      step(`Is the payment on the list that needs no ${L.f145}?`, `Yes — ${N.l.toLowerCase()} (${L.rule}).`, true);
      o.part = 'none'; o.partLabel = `No ${L.f145}`; o.basis = 'Specified list';
    } else {
    step(`Is the payment on the list that needs no ${L.f145}?`, 'No.');
    // 2 chargeability
    let charge = N.charge; why = N.charge ? `${N.l} is income chargeable in India under the Act.` : N.why;
    if (charge && N.art === 'fts' && T && pd.ok) {

      step('Is the payment chargeable to tax in India?', 'No — ' + why, true);

    } else {
      step('Is the payment chargeable to tax in India?', 'Yes — ' + why);
      // 3 rate

      let tRate = null;

function nextStep(o) {

  if (!o.r.swiftRef) return 'Give the bank Form A2 and the acknowledgement';
  if (o.tax > 0 && !o.r.chDate) return `Deposit TDS by ${fdate(o.due)}`;
  return 'Done';

async function zipFolder(id) {

    lines.push([DOCN[k], o.has[k] ? 'On file' : 'Missing', d.ref || '', name]); }
  const sum = [`Remittance folder`, `Remitter: ${cur.settings.name} (PAN ${cur.settings.pan})`, `Payee: ${o.p.name}, ${o.p.country}, TIN ${o.p.tin || '-'}`, `Invoice: ${r.inv}  Date: ${r.date}`, `Amount: ${r.ccy} ${r.fx} @ ${r.xr} = INR ${o.inr}`,

const norm = s => String(s ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
function isoDate(v) { if (!v && v !== 0) return ''; if (v instanceof Date) return new Date(v.getTime() - v.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  if (typeof v === 'number') return new Date(Date.UTC(1899, 11, 30) + v * 864e5).toISOString().slice(0, 10);
  const s = String(v).trim(); let m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/); if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  m = s.match(/^(\d{1,2})[-\s]([A-Za-z]{3})[-\s](\d{2,4})$/); if (m) { const mi = MON.findIndex(x => x.toLowerCase() === m[2].toLowerCase()); const y = m[3].length === 2 ? '20' + m[3] : m[3]; if (mi >= 0) return `${y}-${pad(mi + 1)}-${m[1].padStart(2, '0')}`; }
  return s.slice(0, 10); }

async function importFile(file) {
  if (!window.XLSX) { toast('The spreadsheet library did not load.'); return; }
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { cellDates: true }); let np = 0, nr = 0, skip = 0;
    for (const name of wb.SheetNames) {
      const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: '' }); if (!aoa.length) continue;
      const h = aoa[0].map(norm), c = (...ks) => { for (const k of ks) { const i = h.indexOf(k); if (i >= 0) return i; } return h.findIndex(x => ks.some(k => x.startsWith(k))); }, g = (r, i) => i >= 0 ? String(r[i] ?? '').trim() : '';
      const body = aoa.slice(1).filter(r => r.some(x => String(x).trim() !== ''));
      if (h.includes('countrycode')) body.forEach(r => { const code = g(r, c('code')).toUpperCase(); if (!code) { skip++; return; }
        const p = { code, name: g(r, c('name')), country: g(r, c('countrycode')).toUpperCase(), status: g(r, c('status')) || 'Company', address: g(r, c('address')), email: g(r, c('email')), tin: g(r, c('tin')), pan: g(r, c('pan')).toUpperCase(), trcNo: g(r, c('trcreference')),
          trcFrom: isoDate(r[c('trcvalidfrom')]), trcTo: isoDate(r[c('trcvalidto')]), f41On: isoDate(r[c('form41')]), npeOn: isoDate(r[c('nope')]), pe: 'No PE in India', qual: false, sc: 0, notes: '' };
        const ix = cur.payees.findIndex(x => x.code === code); if (ix >= 0) cur.payees[ix] = { ...cur.payees[ix], ...p }; else cur.payees.push(p); np++; });
      else if (h.includes('payeecode')) body.forEach(r => { const payee = g(r, c('payeecode')).toUpperCase(), nature = g(r, c('naturecode')).toLowerCase(), date = isoDate(r[c('date')]);
