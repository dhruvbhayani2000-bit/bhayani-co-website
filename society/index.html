<style>
/* Layout: ERP shell — sticky top bar across, icon sidebar of modules on the left, content on slate; phones get a bottom tab bar and a slide-in menu. */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#f59e0b; --accent-ink:#fbbf24; --accent-soft:#2a1f0a; --action:#f97316;
  --good:#34d399; --good-soft:#062e22; --warn:#fbbf24; --warn-soft:#2a1f0a; --bad:#f87171; --bad-soft:#3b1212;
  --sky:#38bdf8; --sky-soft:#0c2a40; --sky-fg:#082f49;
  --hero-a:#0b1222; --hero-b:#0c3a57; --hero-eyebrow:#7dd3fc;

:root[data-theme="dark"]{
  --bg:#0b1120; --surface:#111a2e; --sunk:#0f172a; --line:#1e293b;

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}

:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

.alert-strip{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-soft);border-radius:var(--r);padding:12px 16px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:14px}

.tile{min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);display:grid;gap:12px;min-width:0;align-content:start}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

input[type=text],input[type=search],input[type=number],input[type=date],input[type=month],input[type=email],input[type=tel],input[type=time],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}

.toolbar input,.toolbar select{width:auto}
.toolbar .grow input{width:100%}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 16px;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}

.icon{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}

.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

  const t=[...ids]; if(t.length%2) t.push(null); const n=t.length, out=[];
  for(let r=0;r<n-1;r++){ for(let i=0;i<n/2;i++){ const a=t[i], b=t[n-1-i]; if(a&&b) out.push({a,b}); } t.splice(1,0,t.pop()); }

function sigPadHTML(id){ return `<div class="form"><canvas class="sigpad" id="${id}" width="840" height="260" aria-label="Signature pad: draw your signature"></canvas><div class="toolbar"><button type="button" class="btn sm" data-act="sig-clear" data-id="${id}">Clear signature</button><span class="muted small">Sign with finger or mouse</span></div></div>`; }
function initSigPads(){
  document.querySelectorAll('canvas.sigpad').forEach(c=>{
    if(c.dataset.init) return; c.dataset.init='1'; const x=c.getContext('2d'); x.lineWidth=4; x.lineCap='round'; x.strokeStyle='#14204f'; let down=false;
    const p=e=>{const r=c.getBoundingClientRect(); return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
    c.addEventListener('pointerdown',e=>{down=true; c.setPointerCapture(e.pointerId); const [a,b]=p(e); x.beginPath(); x.moveTo(a,b); c.dataset.signed='1';});
    c.addEventListener('pointermove',e=>{ if(!down) return; const [a,b]=p(e); x.lineTo(a,b); x.stroke(); });
    c.addEventListener('pointerup',()=>down=false); c.addEventListener('pointercancel',()=>down=false);
  });
}

function allHouses(){ const m=new Map(S.d.houses.map(h=>[h.no,h])); const out=houseNos().map(no=>m.get(no)||{id:no,no,block:no.split('-')[0],type:no.startsWith('SHOP')?'shop':'flat',floor:unitFloor(no),occupancy:'owner',owner:{},docs:[],members:0,stub:true}); S.d.houses.forEach(h=>{ if(!houseNos().includes(h.no)) out.push(h); }); return out; }
const houseNos = () => (S.cfg && S.cfg.houseNos) || [];
const billFor = m => S.d.bills.find(b=>b.id===m);
const dueOf = (b,no) => (b.dues && b.dues[no]!=null) ? Number(b.dues[no]) : Number(b.amount||0);
const isPaid = (b,no) => !!(b.entries&&b.entries[no]&&b.entries[no].paid);
function billStats(b){ const nos=houseNos(); const total=nos.length; const e=Object.entries(b.entries||{}).filter(([,v])=>v&&v.paid); const unpaid=nos.filter(no=>!isPaid(b,no)); const part=no=>{ const x=b.entries&&b.entries[no]; return x&&!x.paid?Number(x.amt||0):0; };
  return {total, paid:e.length, pending:unpaid.length, pendingAmt:sum(unpaid,no=>Math.max(0,dueOf(b,no)-part(no))), collected:sum(Object.values(b.entries||{}),v=>v&&(v.paid||v.amt>0)?v.amt:0), due:sum(nos,no=>dueOf(b,no))}; }
function eventMoney(id){ const L=S.d.ledger.filter(l=>l.eventId===id && l.status==='approved'); return {spent:sum(L.filter(l=>l.kind==='expense'),l=>l.amount), collected:sum(L.filter(l=>l.kind==='income'),l=>l.amount), entries:S.d.ledger.filter(l=>l.eventId===id)}; }
function finance(fy){
  const inFY=d=>d && fyOf(d)===fy;
  const maint=[]; S.d.bills.forEach(b=>Object.entries(b.entries||{}).forEach(([no,v])=>{ if(v&&(v.paid||v.amt>0)&&v.date&&inFY(v.date)) maint.push({date:v.date,amount:v.amt}); }));
  const ap=S.d.ledger.filter(l=>l.status==='approved'&&inFY(l.date));
  const inc=ap.filter(l=>l.kind==='income'), exp=ap.filter(l=>l.kind==='expense');
  const months=Array.from({length:12},(_,i)=>{const m=(i+3)%12+1, y=m>=4?fy:fy+1; return `${y}-${String(m).padStart(2,'0')}`});
  const monthly=months.map(k=>({k, inc:sum(maint.filter(x=>x.date.startsWith(k)),x=>x.amount)+sum(inc.filter(x=>x.date.startsWith(k)),x=>x.amount), exp:sum(exp.filter(x=>x.date.startsWith(k)),x=>x.amount)}));
  const maintTotal=sum(maint,x=>x.amount), otherInc=sum(inc,x=>x.amount), expTotal=sum(exp,x=>x.amount);
  let opening=0; const ofy=S.cfg.openingFY||fy;
  if(fy===ofy) opening=Number(S.cfg.openingBalance)||0; else if(fy>ofy){ const p=finance(fy-1); opening=p.closing; }
  const byCat={}; exp.forEach(l=>byCat[l.category]=(byCat[l.category]||0)+l.amount);
  const incCat={'Maintenance':maintTotal}; inc.forEach(l=>incCat[l.category]=(incCat[l.category]||0)+l.amount);
  const outstanding=sum(S.d.bills.filter(b=>inFY(b.month+'-01')),b=>billStats(b).pendingAmt);
  return {fy,opening,maintTotal,otherInc,expTotal,closing:opening+maintTotal+otherInc-expTotal,monthly,byCat,incCat,outstanding,pending:S.d.ledger.filter(l=>l.status==='pending'&&inFY(l.date))};
}

function render(){
  if(!S.ready) return;
  renderShell();
  const a=document.activeElement, main=$('#main');
  const fid = a && a.id && main.contains(a) ? a.id : null; let ss=null; try{ ss=(a&&main.contains(a))?a.selectionStart:null }catch{}
  const views={home:vHome,houses:vHouses,dues:vDues,ledger:vLedger,events:vEvents,gallery:vGallery,complaints:vComplaints,meetings:vMeetings,notices:vNotices,gate:vGate,reports:vReports,setup:vSetup,data:vData,mygate:vMyGate,polls:vPolls,amenities:vAmenities,sports:vSports,team:vTeam};
  let banner='';
  if(S.view==='local'){
    banner = `<div class="banner"><p><strong>Saved on this computer only.</strong> ${LOCAL.savedAt?`Last saved ${fmtDate(LOCAL.savedAt)} ${fmtTime(LOCAL.savedAt)}.`:'Nothing changed yet.'} Download a backup regularly from Import & export. Residents, guards and other committee members can’t see these records; for shared use, open the online app.</p><button class="btn" data-tab="data">Import & export</button></div>`;
  } else if(!S.live && LOCAL){
    banner = `<div class="banner"><p><strong>Sample Society, a demo.</strong> The people and figures are invented and nothing you change here is saved.</p><button class="btn primary" data-act="go-local">Back to ${esc(LOCAL.cfg.name)}</button></div>`;
  } else if(!S.live && S.hasLive && LIVE.cfg){
    banner = `<div class="banner"><p><strong>Sample Society, a demo.</strong> The people and figures are invented and nothing you change here is saved. Use it to show how the app works.</p><button class="btn primary" data-act="go-live">Back to ${esc(LIVE.cfg.name)}</button></div>`;
  } else if(!S.live){
    banner = `<div class="banner"><p><strong>You are looking at sample data.</strong> Nothing here is saved and the names are invented. ${S.dbOK && S.canEdit ? 'Set up your society to start keeping real records.' : S.dbOK ? 'Your committee hasn’t set up the society yet.' : 'Open this page signed in to claude.ai to keep shared records.'}</p>${S.dbOK && S.canEdit ? `<button class="btn primary" data-tab="setup">Set up my society</button>`:''}</div>`;
  }
  // keep what people are typing in on-page forms when live data re-renders the page
  const fkey=el=>{ const f=el.form; return f?`${f.dataset.form}|${f.dataset.id||''}|${el.name}|${el.type==='radio'||el.type==='checkbox'?el.value:''}`:null; };
  const FSEL='form[data-form] input:not([type=file]):not([type=hidden]),form[data-form] select,form[data-form] textarea';
  const keep={}; main.querySelectorAll(FSEL).forEach(el=>{ const k=fkey(el); if(k) keep[k]=(el.type==='checkbox'||el.type==='radio')?el.checked:el.value; });
  const akey = a && main.contains(a) && !a.id ? fkey(a) : null;
  const alerts = residentAlerts() + ((isCom()||role()==='security') && S.tab!=='gate' ? sosBanner() : '');
  main.innerHTML = alerts + banner + views[S.tab]();
  main.querySelectorAll(FSEL).forEach(el=>{ const k=fkey(el); if(k in keep){ if(el.type==='checkbox'||el.type==='radio') el.checked=keep[k]; else el.value=keep[k]; } if(akey&&k===akey){ el.focus(); try{ if(ss!=null) el.setSelectionRange(ss,ss) }catch{} } });
  if(fid){ const el=document.getElementById(fid); if(el){ el.focus(); try{ if(ss!=null) el.setSelectionRange(ss,ss) }catch{} } }
}

  const V=S.d.vehicles.filter(v=>normReg(v.reg).includes(q)||normReg(v.houseNo).includes(q)).slice(0,lim||50);
  if(!V.length) return `<p><span class="pill bad">Not registered</span> No society vehicle matches ${esc(S.ui.gq)}. Treat as a visitor.</p>`;
  return `<div class="list">${V.map(v=>`<div class="item"><div><div class="t mono">${fmtReg(v.reg)}</div><div class="muted small">${esc(v.type)} · ${esc(v.make||'')} · ${esc(v.color||'')}</div></div><div style="text-align:right"><div class="mono t">${esc(v.houseNo)}</div><div class="muted small">Sticker ${esc(v.sticker||'—')}</div></div></div>`).join('')}</div>`;

const GATE_COMPANIES=['','Swiggy','Zomato','Zepto','Blinkit','Amazon','Flipkart','BigBasket','Courier','Other'];
const gateCfg = () => ({nightFrom:'22:30', nightTo:'06:00', regFrom:'00:00', regTo:'06:00', timeout:90, requirePhoto:false, ...((S.cfg&&S.cfg.gate)||{})});
function inWindow(a,b){ const n=toMin(new Date().toTimeString().slice(0,5)), x=toMin(a), y=toMin(b); return x>y ? (n>=x||n<y) : (n>=x&&n<y); }
const isRegHours = () => { const g=gateCfg(); return inWindow(g.regFrom,g.regTo); };
const nowHM = () => new Date().toTimeString().slice(0,5);
function isNight(){ const g=gateCfg(); const n=toMin(nowHM()), a=toMin(g.nightFrom), b=toMin(g.nightTo); return a>b ? (n>=a||n<b) : (n>=a&&n<b); }
function gateContact(no){ if(S.live && !can('houses.view')){ return S.d.gateContacts.find(x=>x.id===no)||{}; } return houseContact(no); }
function prefOf(no){ const p=S.d.housePrefs.find(x=>x.id===no); return (p&&p.delivery)||'ask'; }
function blockedHit(name,veh){ const n=String(name||'').toLowerCase(), v=normReg(veh); return S.d.blocklist.find(b=>(b.name&&n&&n.includes(String(b.name).toLowerCase()))||(b.vehicle&&v&&normReg(b.vehicle)===v)); }
function verifiedFor(uid,no){ if(!S.live) return true; const v=S.d.verifications.find(x=>x.id===uid); return !!(v&&v.houseNo===no); }
async function sha(t){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,40); }
const secsSince = iso => Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/1000));
const reqPill = r => ({waiting:'<span class="pill warn">Waiting for resident</span>',approved:`<span class="pill good">Allowed${r.via==='call'?' on call':''}</span>`,denied:`<span class="pill bad">Denied${r.via==='call'?' on call':''}</span>`,leave:'<span class="pill acc">Leave at gate</span>'}[r.status]||'');

  const staffList=S.d.staff.filter(s=>{const q=(S.ui.sq||'').toLowerCase(); return !q||s.name.toLowerCase().includes(q)||(s.houses||[]).join(' ').toLowerCase().includes(q);}).slice(0,12);

async function logEntry(ent){
  const d=today(), vid=rid(); const full={people:1,gate:'',vehicle:'',out:'',...ent,in:ent.in||nowHM(),by:S.uid||''};
  if(!S.live){ if(S.d.visitors.some(v=>v.id===d)) await store.update('visitors',d,{entries:{[vid]:full}}); else await store.set('visitors',d,{date:d,entries:{[vid]:full}}); return; }
  try{ await db.doc('visitors/'+d).update({entries:{[vid]:full}}); }
  catch(err){ if(err&&err.code==='invalid_argument') await db.doc('visitors/'+d).set({date:d,entries:{[vid]:full}}); else throw err; }
}
function nightEntries(days){ const out=[]; [...S.d.visitors].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,days).forEach(d=>Object.values(d.entries||{}).forEach(v=>{ if(v.reg) out.push({...v,date:d.date}); })); return out.sort((a,b)=>(b.date+b.in).localeCompare(a.date+a.in)); }
function nightRegisterPanel(){

function parseCSV(t){ const rows=[]; let row=[], cur='', q=false; for(let i=0;i<t.length;i++){ const ch=t[i]; if(q){ if(ch==='"'&&t[i+1]==='"'){cur+='"';i++;} else if(ch==='"') q=false; else cur+=ch; } else if(ch==='"') q=true; else if(ch===','){row.push(cur);cur='';} else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&t[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; } else cur+=ch; } if(cur||row.length){row.push(cur); rows.push(row);} return rows; }

const lakh = n => { const a=Math.abs(n), s=n<0?'−':''; return a>=1e7?`${s}₹${(a/1e7).toFixed(2)} Cr`:a>=1e5?`${s}₹${(a/1e5).toFixed(2)} L`:`${s}${inr(a)}`; };
const pct = (a,b) => b?Math.round(a/b*1000)/10:0;
function auditBars(rows, total, cls){

}
function coverageChart(a){
  const dep=(a.liabilities.find(x=>/deposit/i.test(x.head))||{amt:0}).amt;
  const fd=(a.assets.find(x=>/investment/i.test(x.head))||{amt:0}).amt, bank=(a.assets.find(x=>/bank/i.test(x.head))||{amt:0}).amt, cash=(a.assets.find(x=>/cash/i.test(x.head))||{amt:0}).amt, adv=(a.assets.find(x=>/loans/i.test(x.head))||{amt:0}).amt;
  const W=720, L=150, R=120, bw=W-L-R, X=v=>v/dep*bw; const segs=[['Fixed deposits',fd,'var(--c-in)'],['Bank',bank,'var(--primary)'],['Cash',cash,'var(--muted)'],['Loans & advances',adv,'var(--accent)']];
  let x=L; const parts=segs.map(([n,v,c])=>{ const w=X(v); const r=`<rect x="${x}" y="78" width="${Math.max(0,w-2)}" height="26" rx="3" fill="${c}"><title>${n}: ${inr(v)}</title></rect>`; x+=w; return r; }).join('');
  const gap=dep-(fd+bank+cash+adv);
  return `<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} 150" style="width:100%;min-width:560px" role="img" aria-label="Maintenance deposits held compared with all assets">
    <text x="${L-10}" y="44" text-anchor="end" style="font-size:12px;fill:var(--fg)">Deposits held</text><rect x="${L}" y="28" width="${bw}" height="26" rx="3" fill="var(--sunk)" stroke="var(--line)"><title>Maintenance deposits: ${inr(dep)}</title></rect><text x="${L+bw+8}" y="45" style="font-size:12px;fill:var(--fg)">${lakh(dep)}</text>
    <text x="${L-10}" y="95" text-anchor="end" style="font-size:12px;fill:var(--fg)">All assets</text>${parts}<text x="${x+8}" y="95" style="font-size:12px;fill:var(--fg)">${lakh(fd+bank+cash+adv)}</text>
    ${gap>0?`<line x1="${x}" x2="${L+bw}" y1="118" y2="118" stroke="var(--bad)" stroke-width="2"/><text x="${(x+L+bw)/2}" y="136" text-anchor="middle" style="font-size:12px;fill:var(--bad)">Shortfall ${lakh(gap)}</text>`:''}
  </svg></div><div class="legend">${segs.map(([n,v,c])=>`<span><i style="background:${c}"></i>${n} ${lakh(v)}</span>`).join('')}</div>`;
}
function vAudit(a){
  const inc=sum(a.income,x=>x.amt), exp=sum(a.expense,x=>x.amt), units=houseNos().length||1;
  const E=[...a.expense].sort((x,y)=>y.amt-x.amt), I=[...a.income].sort((x,y)=>y.amt-x.amt);
  const maint=(a.income.find(x=>/maintenance/i.test(x.head))||{amt:0}).amt;
  const dep=(a.liabilities.find(x=>/deposit/i.test(x.head))||{amt:0}).amt; const assets=sum(a.assets,x=>x.amt);
  const reserve=(a.liabilities.find(x=>/reserve/i.test(x.head))||{amt:0}).amt;
  const fd=a.assets.find(x=>/investment/i.test(x.head))||{amt:0,items:[]}; const intFD=(a.income.find(x=>/\bFDs?\b|FDR|fixed/i.test(x.head))||{amt:0}).amt;
  const recv=(a.assets.find(x=>/loans/i.test(x.head))||{items:[]}).items.filter(i=>/receivable/i.test(i.n)&&/maint/i.test(i.n));
  const obs=[
    `${esc(E[0].head)} is the biggest cost: ${lakh(E[0].amt)}, ${pct(E[0].amt,exp)}% of all spending. ${esc(E[1].head)} follows at ${pct(E[1].amt,exp)}%.`,
    `Maintenance charges of ${lakh(maint)} cover ${pct(maint,exp)}% of the year’s expenses; FD interest of ${lakh(intFD)} is the next largest income.`,
    `Running the society cost about ${inr(exp/units/12)} per unit per month across ${units} units.`,
    `The year ended with a surplus of ${lakh(a.surplus)}.`,
    reserve<0?`The reserve fund shows a deficit of ${lakh(Math.abs(reserve))}, so all assets (${lakh(assets)}) are ${lakh(dep-assets)} less than the maintenance deposits held (${lakh(dep)}). Worth asking the auditor at the AGM how this arose and the plan to restore it.`:'',
    recv.length?`${recv.map(r=>`${esc(r.n)}: ${inr(r.a)}`).join('; ')} still to be collected.`:''
  ].filter(Boolean);
  const sched=(rows)=>rows.map(r=>`<details class="panel" style="padding:10px 14px"><summary style="cursor:pointer;display:flex;justify-content:space-between;gap:12px"><span>${r.sch?`<span class="muted small">Sch. ${esc(r.sch)}</span> `:''}${esc(r.head)}</span><span class="num">${inr(r.amt)}</span></summary>${(r.items||[]).length?`<div class="tablewrap" style="margin-top:8px"><table><tbody>${r.items.map(i=>`<tr><td>${esc(i.n)}</td><td class="r num">${inr(i.a)}</td></tr>`).join('')}</tbody></table></div>`:''}</details>`).join('');

const UNIT_COLS=['Unit No','Type (Flat/Shop)','Occupancy (Owner/Rented/Vacant)','Owner name','Owner mobile','Owner email','Owner address (if not living here)','Tenant name','Tenant mobile','Tenant email','Agreement from (DD-MM-YYYY)','Agreement to (DD-MM-YYYY)','Police verification done (Yes/No)','Family members','Parking slot','Vehicle 1 number','Vehicle 1 type (Car/Two-wheeler)','Vehicle 2 number','Vehicle 2 type (Car/Two-wheeler)','Notes'];
const MAINT_COLS=['Unit No','Month (YYYY-MM)','Amount due','Amount paid','Paid on (DD-MM-YYYY)','Mode (UPI/NEFT/Cheque/Cash)','Reference (UTR/cheque/receipt no.)'];
const LEDGER_COLS=['Date (DD-MM-YYYY)','Type (Expense/Income)','Category','Paid to / received from','Description','Amount','Mode (UPI/NEFT/Cheque/Cash)','UTR / cheque no.','Status (Approved/Pending)'];
const colKey = h => String(h||'').split('(')[0].trim().toLowerCase().replace(/\s+/g,' ');
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
const pad2 = n => String(n).padStart(2,'0');
function serialYMD(n){ try{ const d=XLSX.SSF.parse_date_code(n); return d&&d.y?[d.y,d.m,d.d]:null; }catch{ return null; } }
function normDate(v){
  if(v==null||v==='') return '';
  if(typeof v==='number'){ const p=serialYMD(v); return p?`${p[0]}-${pad2(p[1])}-${pad2(p[2])}`:null; }
  const t=String(v).trim(); let m;
  if((m=t.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/))) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  if((m=t.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/))){ const y=m[3].length===2?'20'+m[3]:m[3]; if(+m[2]>12) return null; return `${y}-${pad2(m[2])}-${pad2(m[1])}`; }
  if((m=t.match(/^(\d{1,2})[-\s]([A-Za-z]{3,9})[-\s,]*(\d{2,4})$/))&&MON[m[2].slice(0,4).toLowerCase()]||MON[(m&&m[2]||'').slice(0,3).toLowerCase()]){ const mo=MON[m[2].slice(0,3).toLowerCase()]; const y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${pad2(mo)}-${pad2(m[1])}`; }
  return null;
}
function normMonth(v){
  if(v==null||v==='') return null;
  if(typeof v==='number'){ const p=serialYMD(v); return p?`${p[0]}-${pad2(p[1])}`:null; }
  const t=String(v).trim(); let m;
  if((m=t.match(/^(\d{4})[-/.](\d{1,2})(?:[-/.]\d{1,2})?$/))) return +m[2]>=1&&+m[2]<=12?`${m[1]}-${pad2(m[2])}`:null;
  if((m=t.match(/^(\d{1,2})[-/.](\d{4})$/))) return +m[1]>=1&&+m[1]<=12?`${m[2]}-${pad2(m[1])}`:null;
  if((m=t.match(/^([A-Za-z]{3,9})[-\s',]*(\d{2,4})$/))&&MON[m[1].slice(0,3).toLowerCase()]){ const y=m[2].length===2?'20'+m[2]:m[2]; return `${y}-${pad2(MON[m[1].slice(0,3).toLowerCase()])}`; }
  return null;
}
const showDate = d => d ? `${d.slice(8,10)}-${d.slice(5,7)}-${d.slice(0,4)}` : '';
function normMode(v){ const t=String(v||'').toLowerCase(); if(!t) return ''; if(/cash/.test(t)) return 'Cash'; if(/ch(e|)q|check/.test(t)) return 'Cheque'; if(/neft|imps|rtgs|bank|transfer/.test(t)) return 'NEFT/IMPS'; return 'UPI'; }
function normPhone(v){ const d=String(v||'').replace(/\D/g,''); if(!d) return ''; if(d.length===10) return d; if(d.length===12&&d.startsWith('91')) return d.slice(2); if(d.length===11&&d.startsWith('0')) return d.slice(1); return null; }
const num = v => { if(v==null||v==='') return null; const n=Number(String(v).replace(/[₹,\s]/g,'')); return isFinite(n)?n:NaN; };
function needXLSX(){ if(typeof XLSX==='undefined'){ toast('The Excel tools did not load. Check the internet connection and reload the page.'); return false; } return true; }
function sheetFrom(cols, rows, textCols){
  const ws=XLSX.utils.aoa_to_sheet([cols,...rows]);
  ws['!cols']=cols.map(c=>({wch:Math.max(12,Math.min(38,c.length+2))}));
  const range=XLSX.utils.decode_range(ws['!ref']);
  (textCols||[]).forEach(ci=>{ for(let r=range.s.r;r<=Math.max(range.e.r,rows.length+200);r++){ const a=XLSX.utils.encode_cell({r,c:ci}); if(!ws[a]) ws[a]={t:'s',v:''}; ws[a].t='s'; ws[a].v=String(ws[a].v??''); ws[a].z='@'; } });
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(range.e.r,rows.length+200),c:cols.length-1}});
  return ws;
}
function guideSheet(lines){ const ws=XLSX.utils.aoa_to_sheet(lines.map(l=>[l])); ws['!cols']=[{wch:110}]; return ws; }
async function saveWorkbook(wb, name){ const data=XLSX.write(wb,{bookType:'xlsx',type:'array'}); if(!await saveFile(name,data,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')) toast('Downloads are not available in this view.'); }

/* parse an uploaded workbook into row objects keyed by column name */
async function readRows(file){
  const buf=await file.arrayBuffer(); const wb=XLSX.read(buf,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]]; const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:false});
  if(!aoa.length) return {head:[],rows:[]};
  const head=aoa[0].map(colKey);
  const rows=aoa.slice(1).map((r,i)=>({_row:i+2, ...Object.fromEntries(head.map((h,j)=>[h,typeof r[j]==='string'?r[j].trim():r[j]]))})).filter(r=>head.some(h=>r[h]!==''&&r[h]!=null));
  return {head,rows};
}
function validateUnits(rows){
  const ok=[], errors=[], known=new Set(houseNos()); let added=0;
  let blank=0;
  rows.forEach(r=>{ const no=String(r['unit no']||'').toUpperCase().replace(/\s+/g,''); const err=[];
    if(no && Object.entries(r).every(([k,v])=>['_row','unit no','type'].includes(k)||v===''||v==null)){ blank++; return; }
    if(!no) err.push('Unit No is empty'); else if(!known.has(no)){ if(/^[A-Z]+-\d+$|^SHOP-[GF]\d+$/.test(no)) added++; else err.push(`unit ${no} is not on the society list`); }
    const occRaw=String(r['occupancy']||'').toLowerCase(); const occ=!occRaw?'':/rent|tenant/.test(occRaw)?'tenant':/vac|empty/.test(occRaw)?'vacant':/own|self/.test(occRaw)?'owner':null; if(occ===null) err.push('Occupancy must be Owner, Rented or Vacant');
    const op=normPhone(r['owner mobile']), tp=normPhone(r['tenant mobile']); if(op===null) err.push('owner mobile is not 10 digits'); if(tp===null) err.push('tenant mobile is not 10 digits');
    const from=normDate(r['agreement from']), to=normDate(r['agreement to']); if(from===null) err.push('agreement from date not understood'); if(to===null) err.push('agreement to date not understood');
    ['owner email','tenant email'].forEach(k=>{ if(r[k]&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r[k])) err.push(`${k} looks wrong`); });
    const mem=num(r['family members']); if(Number.isNaN(mem)) err.push('Family members must be a number');
    if(err.length) errors.push({row:r._row, unit:no, msg:err.join('; ')});
    else ok.push({no, type:/shop/i.test(r['type']||'')||no.startsWith('SHOP')?'shop':'flat', occ, owner:{name:r['owner name']||'',phone:op||'',email:r['owner email']||'',addr:r['owner address']||''}, tenant:{name:r['tenant name']||'',phone:tp||'',email:r['tenant email']||'',from:from||'',to:to||'',police:String(r['police verification done']||'').toLowerCase().startsWith('y')}, members:mem, parking:r['parking slot']!==''?String(r['parking slot']):'', notes:r['notes']||'',
      vehicles:[[r['vehicle 1 number'],r['vehicle 1 type']],[r['vehicle 2 number'],r['vehicle 2 type']]].filter(([n])=>n).map(([n,t])=>({reg:String(n).toUpperCase().replace(/\s+/g,''),type:/two|2|bike|scoot|activa/i.test(String(t||''))?'Two-wheeler':t?'Car':'Car'}))});
  });
  return {ok, errors, note: [added?`${added} new unit${added>1?'s':''} will be added to the society list.`:'', blank?`${blank} units with no details filled are left unchanged.`:''].filter(Boolean).join(' ')};
}
function validateMaint(rows){
  const ok=[], errors=[], known=new Set(houseNos()); let noDate=0;
  rows.forEach(r=>{ const no=String(r['unit no']||'').toUpperCase().replace(/\s+/g,''); const m=normMonth(r['month']); const due=num(r['amount due']), paid=num(r['amount paid']); let date=normDate(r['paid on']); const err=[];
    if(!known.has(no)) err.push(no?`unit ${no} is not on the society list`:'Unit No is empty');
    if(!m) err.push('Month not understood (use YYYY-MM)');
    if(Number.isNaN(due)||(due!=null&&due<0)) err.push('Amount due must be a number'); if(Number.isNaN(paid)||(paid!=null&&paid<0)) err.push('Amount paid must be a number');
    if(date===null) err.push('Paid on date not understood (use DD-MM-YYYY)');
    if(!err.length && paid>0 && !date){ date=`${m}-01`; noDate++; }
    if(!err.length && due==null && paid==null) return;
    if(err.length) errors.push({row:r._row, unit:no, msg:err.join('; ')});
    else ok.push({no, month:m, due:due!=null?due:(S.cfg.monthlyDue||0), paid:paid||0, date:date||'', mode:normMode(r['mode']), ref:String(r['reference']||'')});
  });
  return {ok, errors, note: noDate?`${noDate} paid rows had no date; the 1st of their month is used.`:''};
}
function validateLedger(rows){
  const ok=[], errors=[]; let dup=0; const seen=new Set(S.d.ledger.map(l=>`${l.date}|${l.amount}|${(l.desc||'').toLowerCase()}`));
  rows.forEach(r=>{ const date=normDate(r['date']); const ty=String(r['type']||'').toLowerCase(); const kind=/inc|recei|credit/.test(ty)?'income':/exp|pay|debit/.test(ty)?'expense':null; const amt=num(r['amount']); const err=[];
    if(!date) err.push('Date not understood (use DD-MM-YYYY)'); if(!kind) err.push('Type must be Expense or Income'); if(!(amt>0)) err.push('Amount must be more than 0');
    const desc=r['description']||r['paid to / received from']||''; if(!desc) err.push('Description is empty');
    if(err.length){ errors.push({row:r._row, unit:'', msg:err.join('; ')}); return; }
    const key=`${date}|${amt}|${String(r['description']||desc).toLowerCase()}`; if(seen.has(key)){ dup++; return; } seen.add(key);
    ok.push({date, kind, amount:amt, category:r['category']||(kind==='income'?'Other income':'Other'), party:r['paid to / received from']||'', desc:r['description']||desc, mode:normMode(r['mode']), txnRef:String(r['utr / cheque no.']||r['utr / cheque no']||''), status:/pend/i.test(r['status']||'')?'pending':'approved'});
  });
  return {ok, errors, note: dup?`${dup} rows already in the app will be skipped.`:''};
}
async function startImport(kind, file){
  if(!needXLSX()) return;
  let parsed; try{ parsed=await readRows(file); }catch(e){ toast('Could not read that file. Save it as .xlsx and try again.'); return; }
  const need={units:'unit no', maint:'month', ledger:'amount'}[kind];
  if(!parsed.head.includes(need)){ toast(`This doesn’t look like the ${kind==='units'?'units and members':kind==='maint'?'maintenance':'expenses and income'} template. Download the template and use its first sheet.`); return; }
  const v=kind==='units'?validateUnits(parsed.rows):kind==='maint'?validateMaint(parsed.rows):validateLedger(parsed.rows);
  S.pendingImport={kind, ...v, file:file.name};
  const label={units:'units and members',maint:'maintenance records',ledger:'expenses and income entries'}[kind];
  const months = kind==='maint' ? [...new Set(v.ok.map(x=>x.month))].sort() : [];

async function inChunks(items, fn, size){ for(let i=0;i<items.length;i+=size){ await Promise.all(items.slice(i,i+size).map(fn)); const p=$('#imp-progress'); if(p) p.textContent=`${Math.min(i+size,items.length)} of ${items.length}…`; } }
async function doImport(){
  const P=S.pendingImport; if(!P) return; S.pendingImport=null;
  openModal('Importing', `<p>Saving <span id="imp-progress">0 of ${P.ok.length}…</span> Keep this page open.</p>`);
  quiet=true;
  const ok=await guard(async()=>{
    if(P.kind==='units'){
      const regs=new Set(S.d.vehicles.map(v=>normReg(v.reg))); const newNos=[];
      await inChunks(P.ok, async r=>{
        const old=allHouses().find(h=>h.no===r.no)||{}; const {id:_i,stub:_s,...base}=old;
        const keep=(a,b)=>b!==''&&b!=null?b:(a||'');
        const owner={...(base.owner||{})}; Object.entries(r.owner).forEach(([k,v])=>owner[k]=keep(owner[k],v));
        const tenant={...(base.tenant||{})}; Object.entries(r.tenant).forEach(([k,v])=>{ if(k==='police'){ if(r.tenant.name) tenant.policeVerified=v; } else tenant[k]=keep(tenant[k],v); });
        const data={...base, no:r.no, block:r.no.split('-')[0], type:r.type, floor:unitFloor(r.no), occupancy:r.occ||base.occupancy||'owner', owner, tenant, members:r.members!=null?r.members:(base.members||0), parking:keep(base.parking,r.parking), notes:keep(base.notes,r.notes), docs:base.docs||[], updatedAt:nowIso()};
        await store.set('houses', r.no, data);
        if(S.live){ const pc=data.occupancy==='tenant'&&tenant.phone?tenant:owner; await db.doc('gateContacts/'+r.no).set({name:pc.name||'',phone:pc.phone||''}); }
        for(const v of r.vehicles){ if(!regs.has(normReg(v.reg))){ regs.add(normReg(v.reg)); await store.add('vehicles',{houseNo:r.no,reg:v.reg,type:v.type,make:'',color:'',sticker:''}); } }
        if(!houseNos().includes(r.no)) newNos.push(r.no);
      }, 20);
      if(newNos.length) await saveCfg({houseNos:[...houseNos(),...newNos].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}))});
    }
    if(P.kind==='maint'){
      const byM={}; P.ok.forEach(r=>(byM[r.month]=byM[r.month]||[]).push(r));
      for(const [m,rs] of Object.entries(byM)){
        const freq={}; rs.forEach(r=>freq[r.due]=(freq[r.due]||0)+1); const existing=billFor(m);
        const amount=existing?existing.amount:Number(Object.entries(freq).sort((a,b)=>b[1]-a[1])[0][0]);
        const entries={}, dues={};
        rs.forEach(r=>{ if(r.due!==amount) dues[r.no]=r.due; if(r.paid>0) entries[r.no]={paid:r.paid>=r.due, amt:r.paid, date:r.date, mode:r.mode, ref:r.ref, imported:true}; else if(existing&&existing.entries&&existing.entries[r.no]) entries[r.no]={paid:false,amt:0,date:'',mode:'',ref:''}; });
        if(existing) await store.update('bills', m, {entries, dues});
        else await store.set('bills', m, {month:m, amount, entries, dues, createdAt:nowIso(), imported:true});
      }
    }
    if(P.kind==='ledger'){
      await inChunks(P.ok, r=>store.add('ledger',{...r, eventId:'', invoice:null, approvals:r.status==='approved'?[{uid:S.uid||'',desig:'Imported from manual records',sig:'',at:today(),decision:'approve'}]:[], imported:true, by:S.uid||'', createdAt:nowIso()}), 20);
    }
  });
  quiet=false; closeModal(); render();
  if(ok) toast(`Imported ${P.ok.length} rows${P.errors.length?`; ${P.errors.length} rows with problems were left out`:''}.`);
}

/* ---------- Unit numbering: G-101 … G-1404, shops SHOP-G01 ---------- */
function genUnits(blocks,floors,per,skip,shopsG,shopsF){
  const sk=new Set(String(skip||'').split(',').map(x=>x.trim().toUpperCase()).filter(Boolean)); const out=[];
  blocks.forEach(b=>{ for(let f=1;f<=floors;f++){ if(sk.has(`${b}-${f}`)) continue; for(let u=1;u<=per;u++) out.push(`${b}-${f}${String(u).padStart(2,'0')}`); } });
  for(let i=1;i<=shopsG;i++) out.push(`SHOP-G${String(i).padStart(2,'0')}`); for(let i=1;i<=shopsF;i++) out.push(`SHOP-F${String(i).padStart(2,'0')}`);
  return out;
}
function unitFloor(no){ const [b,n]=String(no).split('-'); if(b==='SHOP') return n.startsWith('G')?0:1; return Math.floor((+n||0)/100); }

/* ---------- Annual finance ---------- */
function barChart(monthly){
  const W=720,H=240,P={l:64,r:10,t:12,b:28}; const max=Math.max(1,...monthly.flatMap(m=>[m.inc,m.exp]));
  const step=Math.pow(10,Math.floor(Math.log10(max))); const top=Math.ceil(max/step)*step; const ticks=[0,top/4,top/2,top*3/4,top];
  const cw=(W-P.l-P.r)/12, bw=Math.min(18,(cw-8)/2); const y=v=>P.t+(H-P.t-P.b)*(1-v/top);
  const short=v=>v>=1e7?(v/1e7).toFixed(1)+' Cr':v>=1e5?(v/1e5).toFixed(1)+' L':v>=1e3?(v/1e3).toFixed(0)+'k':String(v);
  return `<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;min-width:560px" role="img" aria-label="Monthly income and expense">
   ${ticks.map(t=>`<line class="gridl" x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}"/><text x="${P.l-8}" y="${y(t)+3}" text-anchor="end">₹${short(t)}</text>`).join('')}
   ${monthly.map((m,i)=>{const x=P.l+i*cw+cw/2; return `<rect x="${x-bw-1}" y="${y(m.inc)}" width="${bw}" height="${y(0)-y(m.inc)}" fill="var(--c-in)" rx="2"><title>${monthLabel(m.k)} income ${inr(m.inc)}</title></rect><rect x="${x+1}" y="${y(m.exp)}" width="${bw}" height="${y(0)-y(m.exp)}" fill="var(--c-out)" rx="2"><title>${monthLabel(m.k)} expense ${inr(m.exp)}</title></rect><text x="${x}" y="${H-10}" text-anchor="middle">${MONTHS[+m.k.slice(5)-1]}</text>`}).join('')}
  </svg></div><div class="legend"><span><i style="background:var(--c-in)"></i>Income</span><span><i style="background:var(--c-out)"></i>Expenses</span></div>`;
}
function hbars(obj,color){ const e=Object.entries(obj).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]); const mx=Math.max(1,...e.map(x=>x[1])); return e.map(([k,v])=>`<div class="hbar"><span class="small">${esc(k)}</span><div class="bar ${color}"><span style="width:${v/mx*100}%"></span></div><span class="num small">${inr(v)}</span></div>`).join('')||'<p class="muted">Nothing recorded.</p>'; }

/* ---------- Cricket & sports ---------- */
const teamName = (t,id) => { const x=(t.teams||[]).find(y=>y.id===id); return x?x.name:'TBD'; };
const ballsOf = o => { const [a,b]=String(o||'0').split('.'); return (+a||0)*6+Math.min(5,+b||0); };
function standings(t){
  const st={}; (t.teams||[]).forEach(x=>st[x.id]={id:x.id,name:x.name,p:0,w:0,l:0,nr:0,pts:0,rf:0,bf:0,ra:0,ba:0}); const full=(t.overs||8)*6;
  (t.matches||[]).filter(m=>m.status==='done'&&m.round==='League'&&m.res).forEach(m=>{ const A=st[m.a],B=st[m.b]; if(!A||!B) return; const r=m.res;
    const aB=ballsOf(r.aOv)||full, bB=ballsOf(r.bOv)||full;
    A.p++;B.p++; A.rf+=+r.aRuns||0; A.bf+=aB; A.ra+=+r.bRuns||0; A.ba+=bB; B.rf+=+r.bRuns||0; B.bf+=bB; B.ra+=+r.aRuns||0; B.ba+=aB;
    if(!st[r.winner]){ A.nr++;B.nr++;A.pts++;B.pts++; } else { st[r.winner].w++; st[r.winner].pts+=2; (r.winner===m.a?B:A).l++; } });
  return Object.values(st).map(s=>({...s,nrr:(s.bf?s.rf/(s.bf/6):0)-(s.ba?s.ra/(s.ba/6):0)})).sort((x,y)=>y.pts-x.pts||y.nrr-x.nrr);
}
function leaders(t){ const mom={}, bat={}, bowl={};
  (t.matches||[]).filter(m=>m.res).forEach(m=>{ const r=m.res; if(r.mom) mom[r.mom]=(mom[r.mom]||0)+1; if(r.topBat) bat[r.topBat]=(bat[r.topBat]||0)+(+r.topBatRuns||0); if(r.bestBowl) bowl[r.bestBowl]=(bowl[r.bestBowl]||0)+(+r.bestBowlWk||0); });
  const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,5); return {mom:top(mom),bat:top(bat),bowl:top(bowl)}; }
function matchLine(t,m){
  const r=m.res; const res = m.status==='done'&&r ? (r.winner==='tie'?'Tied':r.winner==='nr'?'No result':`${esc(teamName(t,r.winner))} won`) : m.status==='abandoned'?'Abandoned':'';
  return `<button class="item" style="all:unset;cursor:${can('sports.manage')?'pointer':'default'};display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)" ${can('sports.manage')?`data-act="match" data-t="${esc(t.id)}" data-id="${esc(m.id)}"`:''}>
    <div style="min-width:0"><div class="muted small">${esc(m.round)} · ${fmtDate(m.date)} ${esc(m.time||'')}</div>
    <div class="t">${esc(teamName(t,m.a))} ${r&&m.status==='done'?`<span class="num muted">${r.aRuns}/${r.aWk} (${esc(r.aOv)})</span>`:''}</div>
    <div class="t">${esc(teamName(t,m.b))} ${r&&m.status==='done'?`<span class="num muted">${r.bRuns}/${r.bWk} (${esc(r.bOv)})</span>`:''}</div>
    ${r&&r.mom?`<div class="small muted">Player of the match: ${esc(r.mom)}</div>`:''}</div>
    <div style="text-align:right">${res?`<span class="pill good">${res}</span>`:m.date===today()?'<span class="pill acc">Today</span>':'<span class="pill info">Upcoming</span>'}</div></button>`;

document.addEventListener('click', async e=>{
  const t=e.target.closest('[data-tab],[data-act]'); if(!t) return;
  if(t.dataset.tab){ toggleDrawer(false); S.tab=t.dataset.tab; closeModal(); try{history.replaceState(null,'','#'+S.tab)}catch{}; render(); window.scrollTo(0,0); return; }
  const a=t.dataset.act, id=t.dataset.id;
  if(a==='close' ) return closeModal();
  if(a==='drawer') return toggleDrawer();
  if(a==='drawer-close') return toggleDrawer(false);
  if(a==='house') return houseModal(id);
  if(a==='house-new') return houseModal(null);
  if(a==='house-del'){ if(t.dataset.sure!=='1'){ t.dataset.sure='1'; t.textContent='Tap again to delete'; return; } await guard(async()=>{ await store.del('houses',id); await saveCfg({houseNos:houseNos().filter(n=>n!==id)}); }, 'House deleted'); return closeModal(); }
  if(a==='doc-del'){ const h=S.d.houses.find(x=>x.id===id); const docs=[...(h.docs||[])]; docs.splice(+t.dataset.i,1); await guard(()=>store.update('houses',id,{docs}),'Document removed'); return houseModal(id); }
  if(a==='veh-del'){ await guard(()=>store.del('vehicles',id),'Vehicle removed'); return houseModal(t.dataset.h); }
  if(a==='bill-pick'){ S.ui.bill=id; return render(); }
  if(a==='bill-filter'){ S.ui.billFilter=t.dataset.v; return render(); }
  if(a==='bill-new') return openModal('Raise monthly bill', `<form class="form" data-form="bill"><div class="fgrid"><label class="f"><span>Month</span><input type="month" name="month" value="${curMonth()}" required></label><label class="f"><span>Amount per house (₹)</span><input type="number" name="amount" min="0" value="${esc(S.cfg.monthlyDue||0)}" required></label></div><p class="muted small">Raises the bill for all ${houseNos().length} houses. Post a notice to tell residents.</p><div class="actions"><button class="btn primary">Raise bill</button></div></form>`);
  if(a==='pay'){ if(can('dues.edit')) payModal(id); return; }
  if(a==='unpay'){ const b=billFor(S.ui.bill); await guard(()=>store.update('bills',b.id,{entries:{[id]:{paid:false,amt:0,date:'',mode:'',ref:''}}}),'Marked as unpaid'); return closeModal(); }
  if(a==='lkind'){ S.ui.lkind=t.dataset.v; return render(); }
  if(a==='lstatus'){ S.ui.lstatus=t.dataset.v; return render(); }
  if(a==='ledger-new') return ledgerForm(t.dataset.kind, t.dataset.ev||'');
  if(a==='ledger-open') return ledgerModal(id);
  if(a==='ledger-del'){ if(t.dataset.sure!=='1'){ t.dataset.sure='1'; t.textContent='Tap again to delete'; return; } await guard(()=>store.del('ledger',id),'Entry deleted'); return closeModal(); }
  if(a==='sig-clear'){ const c=document.getElementById(id); c.getContext('2d').clearRect(0,0,c.width,c.height); delete c.dataset.signed; return; }
  if(a==='event') return eventModal(id);
  if(a==='event-new') return eventForm(null);
  if(a==='event-edit') return eventForm(id);
  if(a==='gallery-add') return galleryForm(t.dataset.ev||'');
  if(a==='photo') return photoModal(id);
  if(a==='photo-del'){ await guard(()=>store.del('gallery',id),'Removed'); return closeModal(); }
  if(a==='cstat'){ S.ui.cstat=t.dataset.v; return render(); }
  if(a==='new-complaint') return complaintForm();
  if(a==='complaint') return complaintModal(id);
  if(a==='complaint-del'){ await guard(()=>store.del('complaints',id),'Complaint deleted'); return closeModal(); }
  if(a==='meeting') return meetingModal(id);
  if(a==='meeting-new') return meetingForm(null);
  if(a==='meeting-edit') return meetingForm(id);
  if(a==='meeting-del'){ if(t.dataset.sure!=='1'){ t.dataset.sure='1'; t.textContent='Tap again to delete'; return; } await guard(()=>store.del('meetings',id),'Meeting deleted'); return closeModal(); }
  if(a==='res-del'){ const m=S.d.meetings.find(x=>x.id===id); const r=[...(m.resolutions||[])]; r.splice(+t.dataset.i,1); await guard(()=>store.update('meetings',id,{resolutions:r})); return meetingModal(id); }
  if(a==='appeal'){ const ev=S.d.events.find(x=>x.id===id); const m=eventMoney(id);
    return copyText(`*${S.cfg.name}*\n*${ev.name}* – ${fmtDate(ev.date)}${ev.end&&ev.end!==ev.date?' to '+fmtDate(ev.end):''}\n\n${ev.desc||''}\n\nBudget ${inr(ev.budget)} · collected so far ${inr(m.collected)}.\nPlease contribute${S.cfg.upi?` by UPI to ${S.cfg.upi}`:''} and reply with your house number and transaction number. Every contribution is recorded in the society app with its receipt.\n\n– ${ev.coordinator||'Managing Committee'}`); }
  if(a==='remind') return remindModal();
  if(a==='reminded'){ const b=billFor(S.ui.bill); setTimeout(()=>guard(()=>store.update('bills',b.id,{reminders:{[id]:nowIso()}})).then(()=>setTimeout(remindModal,300)),0); return; }
  if(a==='copy-group'){ const b=billFor(S.ui.bill); const pend=houseNos().filter(inScope).filter(n=>!(b.entries&&b.entries[n]&&b.entries[n].paid)); const by={}; pend.forEach(n=>{const k=n.split('-')[0]; (by[k]=by[k]||[]).push(n.split('-').slice(1).join('-'))});
    return copyText(`*${S.cfg.name}*\n*${monthLabel(b.id)} maintenance: ${pend.length} houses pending*\n\n${Object.entries(by).map(([k,v])=>`Block ${k}: ${v.join(', ')}`).join('\n')}\n\nAmount ${inr(b.amount)} per house.${S.cfg.upi?` UPI: ${S.cfg.upi}.`:''} Please pay and share the transaction number. Thank you.`); }
  if(a==='book') return bookingForm(t.dataset.am||'', t.dataset.date||'');
  if(a==='booking') return bookingModal(id);

  }
  else if(kind==='notice'){
    if(await guard(()=>store.add('notices',{title:g('title'),category:g('category'),body:fd.get('body')||'',pinned:fd.get('pinned')==='on',at:nowIso(),by:S.uid||''}),'Notice posted')) closeModal();
  }
  else if(kind==='dir'){
    const url=g('url'); if(!/^https:\/\/(preview\.)?claude\.ai\//.test(url)){ toast('Paste the society app’s claude.ai link.'); return; }
    const dir=[...((LIVE.cfg&&LIVE.cfg.directory)||[]),{name:g('name'),url,note:g('note'),at:nowIso()}];
    if(await guard(()=>db.doc('config/society').update({directory:dir}),'Society added to the list')) setTimeout(societiesModal,200);
  }
  else if(kind==='audit'){
    await guard(()=>store.update('ledger',id,{audit:{uid:S.uid||'',at:today(),note:g('note')}}),'Marked as audited'); setTimeout(()=>ledgerModal(id),150);
  }
  else if(kind==='visitor'){
    const d=today(), vid=rid(); LS.set('gate',g('gate'));
    const ent={name:g('name'),houseNo:g('houseNo').toUpperCase(),type:g('type'),vehicle:g('vehicle').toUpperCase(),people:+g('people')||1,gate:g('gate'),in:new Date().toTimeString().slice(0,5),out:'',by:S.uid||''};
    const exists=S.d.visitors.some(v=>v.id===d);
    const ok=await guard(async()=>{
      if(!S.live){ if(exists) await store.update('visitors',d,{entries:{[vid]:ent}}); else await store.set('visitors',d,{date:d,entries:{[vid]:ent}}); return; }
      try{ await db.doc('visitors/'+d).update({entries:{[vid]:ent}}); }
      catch(err){ if(err&&err.code==='invalid_argument') await db.doc('visitors/'+d).set({date:d,entries:{[vid]:ent}}); else throw err; }
    },'Entry recorded');
    if(ok){ f.reset(); const gi=f.querySelector('[name=gate]'); if(gi) gi.value=LS.get('gate','Gate 1'); }
  }
  else if(kind==='amenity'){
    const data={name:g('name'),type:g('type'),unit:g('unit'),rate:+g('rate')||0,deposit:+g('deposit')||0,capacity:+g('capacity')||1,open:g('open'),close:g('close'),maxHours:+g('maxHours')||4,approval:fd.get('approval')==='on',rules:g('rules')};
    if(await guard(()=> id? store.update('amenities',id,data) : store.add('amenities',data),'Amenity saved')) closeModal();
  }
  else if(kind==='booking'){
    const am=S.d.amenities.find(x=>x.id===g('amenityId')); const b={amenityId:am.id,date:g('date'),start:g('start'),end:g('end'),houseNo:g('houseNo').toUpperCase(),guests:+g('guests')||0,purpose:g('purpose')};
    if(toMin(b.end)<=toMin(b.start)){ toast('The end time must be after the start time.'); return; }
    if(toMin(b.start)<toMin(am.open)||toMin(b.end)>toMin(am.close)){ toast(`${am.name} is open ${am.open} to ${am.close}.`); return; }
    if(am.unit==='hour' && (toMin(b.end)-toMin(b.start))/60>(am.maxHours||24)){ toast(`Book at most ${am.maxHours} hours at a time.`); return; }
    if(houseNos().length && !houseNos().includes(b.houseNo)){ toast(`House ${b.houseNo} is not on the society list.`); return; }
    const c=clash(b); if(c){ toast(`Already booked ${c.start}–${c.end} by ${c.houseNo}. Pick another time.`); return; }
    const fee=bookingFee(am,b.start,b.end);
    const data={...b,fee,deposit:am.deposit||0,status:am.approval?'requested':'approved',paid:fee===0,depositBack:false,by:S.uid||'',at:nowIso()};
    if(await guard(()=>store.add('bookings',data), am.approval?'Request sent. The committee will approve it.':'Booked')) closeModal();
  }
  else if(kind==='tour'){
    const data={name:g('name'),sport:g('sport'),overs:+g('overs')||8,start:g('start'),venue:g('venue'),entryFee:+g('entryFee')||0,prize:g('prize'),perDay:+g('perDay')||3,gap:+g('gap')||7,status:g('status'),format:g('format'),regOpen:fd.get('regOpen')==='on',season:g('start').slice(0,4)};
    if(await guard(async()=>{ if(id) await store.update('tournaments',id,data); else { const nid=await store.add('tournaments',{...data,teams:[],matches:[],createdAt:nowIso()}); S.ui.tour=nid; S.ui.ttab='teams'; } },'Tournament saved')) closeModal();
  }
  else if(kind==='team'){
    const tr=S.d.tournaments.find(x=>x.id===f.dataset.t); const players=(fd.get('players')||'').toString().split('\n').map(l=>l.split(',').map(x=>x.trim())).filter(x=>x[0]).map(([name,houseNo,role])=>({name,houseNo:(houseNo||'').toUpperCase(),role:role||''}));
    const tm={id:id||rid(),name:g('name'),blocks:g('blocks'),captain:g('captain'),players};
    const teams=id?tr.teams.map(x=>x.id===id?tm:x):[...(tr.teams||[]),tm];
    if(await guard(()=>store.update('tournaments',tr.id,{teams}),'Team saved')) closeModal();
  }
  else if(kind==='reg'){
    if(await guard(()=>store.add('sportsRegs',{tournamentId:f.dataset.t,name:g('name'),houseNo:g('houseNo').toUpperCase(),age:g('age'),role:g('role'),teamId:'',by:S.uid||'',at:nowIso()}),'Registered. The organisers will put you in a team.')) closeModal();
  }
  else if(kind==='assign'){
    const tr=S.d.tournaments.find(x=>x.id===f.dataset.t); const r=S.d.sportsRegs.find(x=>x.id===id); const tid=g('teamId');
    const teams=tr.teams.map(x=>x.id===tid?{...x,players:[...(x.players||[]),{name:r.name,houseNo:r.houseNo,role:r.role}]}:x);
    if(await guard(async()=>{ await store.update('tournaments',tr.id,{teams}); await store.update('sportsRegs',id,{teamId:tid}); },'Added to team')) closeModal();
  }
  else if(kind==='match'){
    const tr=S.d.tournaments.find(x=>x.id===f.dataset.t); const st=g('status');
    if(g('a')===g('b')){ toast('Pick two different teams.'); return; }
    const m={id:id||rid(),round:g('round')||'League',date:g('date'),time:g('time'),a:g('a'),b:g('b'),status:st};
    if(st==='done'){ const ar=+g('aRuns'), br=+g('bRuns'); if(g('aRuns')===''||g('bRuns')===''){ toast('Enter both innings scores.'); return; }
      m.res={aRuns:ar,aWk:+g('aWk')||0,aOv:g('aOv')||String(tr.overs),bRuns:br,bWk:+g('bWk')||0,bOv:g('bOv')||String(tr.overs),winner:br>ar?m.b:br<ar?m.a:'tie',mom:g('mom'),topBat:g('topBat'),topBatRuns:+g('topBatRuns')||0,bestBowl:g('bestBowl'),bestBowlWk:+g('bestBowlWk')||0}; }
    else if(st==='abandoned'){ m.res={winner:'nr',aRuns:0,aWk:0,aOv:'0',bRuns:0,bWk:0,bOv:'0'}; m.status='done'; }
    const matches=id?tr.matches.map(x=>x.id===id?m:x):[...(tr.matches||[]),m];
    if(await guard(()=>store.update('tournaments',tr.id,{matches}),'Match saved')) closeModal();
  }
  else if(kind==='role'){
    const uid=g('uid'); if(!uid){ toast('Pick a person first.'); return; }
    const role=g('role'); const blocks=role==='committee'?fd.getAll('blocks').map(String):[];
    if(await guard(()=>store.set('members',uid,{role,blocks,at:nowIso()}),'Role saved')) closeModal();
  }
  else if(kind==='gatereq'){
    const no=g('houseNo').toUpperCase(); if(houseNos().length&&!houseNos().includes(no)){ toast(`House ${no} is not on the society list. Check the number.`); return; }
    let photo=''; const file=fd.get('photo'); if(file&&file.size){ if(!await guard(async()=>{ photo=(await upload(file)).url; })) return; }
    const type=g('type'), blk=blockedHit(g('name'),g('vehicle')), night=isNight(), pref=prefOf(no);
    const reg=isRegHours(); const regD = reg ? {reg:true,phone:g('phone'),idType:g('idType'),idLast4:g('idLast4').toUpperCase(),purpose:g('purpose')} : {};
    if(reg && (!g('name')||!photo)){ toast('Night register: enter the person’s name and take a photo.'); return; }
    if(type==='Resident returning'){
      if(await guard(()=>logEntry({name:g('name'),type,houseNo:no,vehicle:g('vehicle').toUpperCase(),people:+g('people')||1,gate:g('gate'),photo,via:'resident',...regD}), reg?`Recorded in the night register: ${g('name')}, ${no}`:`Logged: ${g('name')} returning to ${no}`)) f.reset();
      return;
    }
    let status='waiting', via='';
    if(!blk&&!night&&type==='Delivery'&&pref==='leave'){ status='leave'; via='pref'; }
    if(!blk&&!night&&type==='Delivery'&&pref==='allow'){ status='approved'; via='pref'; }
    LS.set('gate',g('gate'));
    const data={houseNo:no,type,company:g('company'),name:g('name'),vehicle:g('vehicle').toUpperCase(),people:+g('people')||1,gate:g('gate'),photo,status,via,night:night||reg,blocked:blk?(blk.reason||'Blocklisted'):'',at:nowIso(),guard:S.uid||'',...regD};
    let nid; if(await guard(async()=>{ nid=await store.add('gateRequests',data); }, status==='waiting'?`Asked ${no}. Waiting for their answer.`:status==='leave'?`${no} wants deliveries left at the gate.`:`${no} lets deliveries up. Let them in.`)){
      f.reset(); const gi=f.querySelector('[name=gate]'); if(gi) gi.value=LS.get('gate','Gate 1');
      if(!S.live && status==='waiting' && no!==S.myHouse) setTimeout(()=>{ const r=S.d.gateRequests.find(x=>x.id===nid); if(r&&r.status==='waiting') store.update('gateRequests',nid,{status:blk?'denied':'approved',via:'app',decidedBy:'demo-res',decidedAt:nowIso()}); },8000);
    }
  }
  else if(kind==='passcheck'){
    const no=g('houseNo').toUpperCase(), code=g('code'); const k='fails:'+no; S[k]=(S[k]||[]).filter(t=>Date.now()-t<600000);
    if(S[k].length>=5){ toast(`Too many wrong codes for ${no}. Don’t let them in; call the resident.`); return; }
    const id2=await sha(code+'|'+no); const p=S.d.passes.find(x=>x.id===id2);
    const nm=toMin(nowHM());
    if(!p){ S[k].push(Date.now()); toast(`Code not valid for ${no}. Call the resident.`); return; }
    if(p.usedAt){ toast(`This pass was already used at ${fmtTime(p.usedAt)}.`); return; }
    if(p.date!==today()||nm<toMin(p.from)-15||nm>toMin(p.to)){ toast(`This pass is for ${fmtDate(p.date)}, ${p.from}–${p.to}. Call the resident.`); return; }
    if(await guard(async()=>{ await store.update('passes',p.id,{usedAt:nowIso()}); await logEntry({name:p.name,type:'Guest',houseNo:no,vehicle:p.vehicle||'',people:p.people||1,via:'pass',approvedBy:p.by||''}); },`Pass valid: ${p.name}, ${p.people} people for ${no}. Let them in.`)) f.reset();
  }
  else if(kind==='pass'){
    const h=S.myHouse; const code=String(crypto.getRandomValues(new Uint32Array(1))[0]%1000000).padStart(6,'0'); const id2=await sha(code+'|'+h);
    const data={houseNo:h,name:g('name'),date:g('date'),from:g('from'),to:g('to'),people:+g('people')||1,vehicle:g('vehicle').toUpperCase(),by:S.uid||'',at:nowIso()};
    if(await guard(()=>store.set('passes',id2,data))){
      f.reset(); const txt=`You're invited to ${S.cfg.name}, house ${h}. Show this code at the gate: ${code}. Valid on ${fmtDate(data.date)}, ${data.from}–${data.to}, for ${data.people} ${data.people>1?'people':'person'}. Works once.`;
      openModal('Guest pass ready', `<p>Send this code to ${esc(data.name)}. It is shown only now; the app stores only a scrambled version, so even the committee can’t read it.</p><p class="mono" style="font-size:2.2rem;letter-spacing:.2em;text-align:center">${code}</p><div class="toolbar"><a class="btn accent" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">Send on WhatsApp</a><button class="btn" data-act="copy-txt" data-v="${esc(txt)}">Copy message</button></div>`);
    }
  }
  else if(kind==='pref'){ await guard(()=>store.set('housePrefs',S.myHouse,{delivery:g('delivery'),by:S.uid||'',at:nowIso()}),'Saved'); }
  else if(kind==='gatecfg'){ await guard(()=>saveCfg({gate:{nightFrom:g('nightFrom'),nightTo:g('nightTo'),regFrom:g('regFrom')||'00:00',regTo:g('regTo')||'06:00',timeout:Math.max(15,+g('timeout')||90),requirePhoto:fd.get('requirePhoto')==='on'}}),'Security rules saved'); render(); }
  else if(kind==='blocklist'){ if(!g('name')&&!g('vehicle')){ toast('Enter a name or a vehicle number.'); return; } if(await guard(()=>store.add('blocklist',{name:g('name'),vehicle:g('vehicle').toUpperCase(),reason:g('reason'),at:today(),by:S.uid||''}),'Added to blocklist')) f.reset(); }
  else if(kind==='staff'){
    let idDoc=(S.d.staff.find(x=>x.id===id)||{}).idDoc||''; const file=fd.get('file'); if(file&&file.size){ if(!await guard(async()=>{ idDoc=(await upload(file)).url; })) return; }
    const data={name:g('name'),work:g('work'),phone:g('phone'),houses:g('houses').split(',').map(x=>x.trim().toUpperCase()).filter(Boolean),policeVerified:fd.get('policeVerified')==='on',idDoc};
    if(await guard(()=> id? store.set('staff',id,data) : store.add('staff',data),'Saved')) closeModal();
  }
  else if(kind==='claim'){
    const months=fd.getAll('months').map(String); if(!months.length){ toast('Tick the months you paid for.'); return; }
    if(!/^\w{6,22}$/.test(g('utr'))){ toast('Enter the UPI reference or UTR number from your payment app.'); return; }
    if(await guard(()=>store.add('payClaims',{houseNo:S.myHouse,months,amount:+g('amount'),utr:g('utr'),date:g('date'),status:'submitted',by:S.uid||'',at:nowIso()}),'Sent. The treasurer will confirm and you’ll get a receipt.')) closeModal();
  }
  else if(kind==='bankcsv'){
    const file=fd.get('file'); if(!file||!file.size) return; const text=await file.text(); const rows=parseCSV(text).map(r=>r.join(' '));
    const C=S.d.payClaims.filter(c=>c.status==='submitted'); let n=0;
    for(const c of C){ if(rows.some(r=>r.includes(c.utr))){ n++; await guard(()=>store.update('payClaims',c.id,{matched:true})); } }
    closeModal(); toast(n?`${n} of ${C.length} payments found in the statement. Confirm them in the list.`:`None of the ${C.length} reported UTRs are in this statement.`);
  }
  else if(kind==='vote'){
    if(!S.myHouse){ toast('Choose your house first.'); return; }
    const mine={...myVotes()}; delete mine.id; mine[id]={opt:+g('opt'),houseNo:S.myHouse,at:nowIso()};
    await guard(()=>store.set('votes',S.uid||'demo-me',mine),'Vote recorded');
  }
  else if(kind==='poll'){
    const options=(fd.get('options')||'').toString().split('\n').map(x=>x.trim()).filter(Boolean); if(options.length<2){ toast('Give at least two options.'); return; }
    if(await guard(()=>store.add('polls',{question:g('question'),options,closes:g('closes'),secret:fd.get('secret')==='on',perHouse:fd.get('perHouse')==='on',status:'open',createdAt:nowIso(),by:S.uid||''}),'Voting started')) closeModal();
  }
  else if(kind==='setup'){
    const base={name:g('name'),regNo:g('regNo'),address:g('address'),monthlyDue:+g('monthlyDue')||0,openingBalance:+g('openingBalance')||0,openingFY:+g('openingFY'),approvalsNeeded:+g('approvalsNeeded')||2,upi:g('upi'),bank:g('bank'),designations:g('designations').split(',').map(x=>x.trim()).filter(Boolean)};
    const needHouses = !S.live || !houseNos().length;
    let nos=houseNos();
    if(needHouses){ const bl=g('blocks').split(',').map(x=>x.trim().toUpperCase()).filter(Boolean); nos=genUnits(bl,+g('floors')||1,+g('perFloor')||1,g('skip'),+g('shopsG')||0,+g('shopsF')||0); if(nos.length>3000){ toast('That is more than 3,000 units. Check the numbers.'); return; } base.blocks=bl; base.floors=+g('floors'); base.perFloor=+g('perFloor'); }
    if(!S.live && !S.hasLive && db && S.canEdit){
      S.pendingLive=true; toast(`Creating ${nos.length} houses…`);
      const ok=await guard(async()=>{ for(let i=0;i<nos.length;i+=25){ await Promise.all(nos.slice(i,i+25).map(no=>db.doc('houses/'+no).set({no,block:no.split('-')[0],type:no.startsWith('SHOP')?'shop':'flat',floor:unitFloor(no),occupancy:'owner',owner:{name:'',phone:'',email:''},members:0,docs:[],createdAt:nowIso()}))); }
        if(S.uid) await db.doc('members/'+S.uid).set({role:'chairman',blocks:[],at:nowIso()});
        await db.doc('config/society').set({...base,houseNos:nos,createdAt:nowIso()}); });
      if(ok){ toast('Society created. Start by filling in house details.'); S.tab='houses'; }
      return;
    }
    if(!S.live){ Object.assign(S.cfg,base); if(needHouses){ S.cfg.houseNos=nos; } if(S.view==='local'){ persistLocal(); toast('Saved on this computer.'); } else toast('Saved for this demo only.'); render(); return; }
    await guard(()=>saveCfg(base),'Settings saved');
  }
  } finally { done(); }
});

render(); init();
</script>

</body></html>
